<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学生手册 · 刷题</title>
<style>
  :root{
    --bg:#0b1020; --card:#151c30; --card2:#1d2740; --line:#2c3a5c;
    --ink:#e8eefc; --dim:#8fa1c7; --accent:#4dabf7; --ok:#5fd39a; --bad:#ff7a7a; --warn:#ffb454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{margin:0 auto; padding:14px 12px 100px; max-width:720px; background:var(--bg); color:var(--ink);
       font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       padding-left:max(12px, env(safe-area-inset-left));
       padding-right:max(12px, env(safe-area-inset-right));
       padding-bottom:max(100px, calc(env(safe-area-inset-bottom) + 70px));
       overscroll-behavior-y:contain}
  button,.opt,.item,.ck{touch-action:manipulation}

  /* 微信内打开提示 */
  #wxHint{display:none; background:rgba(255,180,84,.13); border:1px solid rgba(255,180,84,.4);
          border-radius:10px; padding:11px 13px; margin-bottom:12px; font-size:13px; line-height:1.65; color:var(--warn)}
  #wxHint b{color:var(--warn)}
  #wxHint .x{float:right; cursor:pointer; opacity:.6; padding:0 4px}

  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .top h1{font-size:19px; margin:0}
  .top .back{background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px;
             padding:6px 12px; font-size:13px; cursor:pointer}
  .top .back:active{background:var(--card)}

  .prog{background:var(--card2); border-radius:8px; height:26px; position:relative; overflow:hidden; margin-bottom:14px}
  .prog i{position:absolute; left:0; top:0; bottom:0; background:rgba(95,211,154,.3); width:0; transition:.25s}
  .prog span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px}

  /* 首页 */
  .menu{display:grid; gap:11px}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; cursor:pointer; transition:.15s}
  .item:active{background:var(--card2); transform:scale(.99)}
  .item h3{margin:0 0 4px; font-size:16px}
  .item p{margin:0; color:var(--dim); font-size:13px}
  .item .n{float:right; color:var(--accent); font-size:14.5px; font-weight:700; letter-spacing:.3px}
  .item.special{border-color:var(--warn)}
  .item.special .n{color:var(--warn)}

  /* 题目区 */
  .qcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px; margin-bottom:14px}
  .qtype{font-size:12px; color:var(--accent); letter-spacing:1px; margin-bottom:10px}
  .qtext{font-size:16.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word}
  .blank{color:var(--accent); font-weight:700}

  .opts{margin-top:16px; display:grid; gap:9px}
  .opt{background:var(--card2); border:1.5px solid var(--line); border-radius:10px; padding:14px 15px;
       font-size:15.5px; cursor:pointer; transition:.12s; line-height:1.6; min-height:52px;
       display:flex; align-items:center}
  .opt:active{transform:scale(.995)}
  .opt.right{border-color:var(--ok); background:rgba(95,211,154,.14)}
  .opt.wrong{border-color:var(--bad); background:rgba(255,122,122,.14)}
  .opt.dim{opacity:.5}

  .tf{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:18px}
  .tf button{padding:22px; border-radius:12px; border:1.5px solid var(--line); background:var(--card2);
             color:var(--ink); font-size:19px; font-weight:600; cursor:pointer; min-height:72px}
  .tf button:active{background:var(--line)}
  .tf button.ok{border-color:var(--ok); background:rgba(95,211,154,.16)}
  .tf button.no{border-color:var(--bad); background:rgba(255,122,122,.16)}

  .fillbox{margin-top:16px}
  .fillbox input{width:100%; background:var(--card2); border:1.5px solid var(--line); border-radius:10px;
                 padding:13px 14px; color:var(--ink); font-size:16px; outline:none}
  .fillbox input:focus{border-color:var(--accent)}
  .fillbox .btns{display:flex; gap:9px; margin-top:10px}
  .fillbox .btns button{flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
                        background:var(--card2); color:var(--ink); font-size:15px; cursor:pointer}

  .ansbox{margin-top:16px; background:rgba(77,171,247,.09); border-left:3px solid var(--accent);
          border-radius:8px; padding:12px 14px; font-size:14.5px; white-space:pre-wrap; display:none}
  .ansbox.show{display:block}
  .ansbox b{color:var(--accent)}

  .actions{display:flex; gap:9px; margin-top:16px}
  .actions button{flex:1; padding:14px; border-radius:11px; border:0; font-size:15.5px; font-weight:600; cursor:pointer}
  .btn-next{background:var(--accent); color:#06101f}
  .btn-next:disabled{opacity:.4}
  .btn-self{background:var(--card2); color:var(--ink); border:1px solid var(--line) !important}

  .feedback{margin-top:14px; font-size:15px; font-weight:600; text-align:center; padding:10px; border-radius:10px}
  .feedback.good{color:var(--ok); background:rgba(95,211,154,.1)}
  .feedback.bad{color:var(--bad); background:rgba(255,122,122,.1)}

  /* 结果页 */
  .result{text-align:center; padding:30px 16px}
  .result .big{font-size:52px; font-weight:800; color:var(--accent); line-height:1.2}
  .result .lbl{color:var(--dim); font-size:14px; margin-bottom:22px}
  .result .row{display:flex; justify-content:space-around; margin:24px 0; font-size:14px}
  .result .row div b{display:block; font-size:22px; color:var(--ink)}
  .result .row .g{color:var(--ok)} .result .row .r{color:var(--bad)}
  .result button{margin-top:12px; width:100%; padding:15px; border-radius:12px; border:0; font-size:16px;
                 font-weight:600; cursor:pointer; background:var(--accent); color:#06101f}
  .result button.sec{background:var(--card2); color:var(--ink); border:1px solid var(--line)}

  .empty{text-align:center; padding:60px 20px; color:var(--dim)}
</style>
</head>
<body>

<div class="top">
  <h1 id="title">学生手册 · 刷题</h1>
  <button class="back" id="backBtn" style="display:none" onclick="goHome()">返回</button>
</div>
<div id="wxHint">
  <span class="x" onclick="this.parentNode.style.display='none'">✕</span>
  <b>建议点右上角「···」→ 用浏览器打开</b><br>
  微信内置浏览器里有些功能不完整，用系统浏览器（Safari / Chrome / 夸克）体验更好。
</div>
<div class="prog" id="progWrap" style="display:none"><i id="progi"></i><span id="progt"></span></div>

<div id="app"></div>

联席会复审，并公示复审结果。\n（四）党委学生工作部审核，学校学生工作指导委员会审定，并公示审定结果"},{"q":"全日制普通本科生，同时具备下列条件者，授予相应学科门类学士学位","a":"（一）遵守《高等学校学生行为准则》。\n（二）完成教学计划的各项要求，经审核准予毕业。\n（三）课程成绩算术平均值不低于 70 分（含，下同）。\n（四）在籍期间未因考核作弊或其他学术不端行为受过留校察看处分。\n警告、严重警告处分的解除程序\n由本人申请，班主任及年级辅导员签署意见，所在学院主管学生工作副书记审核同意后，院党政联席会审定，学院公示，报学生工作处备案后生效\n“三好学生”的基本条件 ：\n（一）爱社会主义祖国，拥护中国共产党的领导 ；\n（二）道德品质优良，行为文明，模范遵守国家法律法规和学校的有关规章制度，群众基础好 ；\n（三）综合考评总分位于班级前 10 名 ；\n（四）热爱所学专业，勤奋学习，成绩优异，参评当学年度所修课程的平均学业成绩达 80 分及以上且无不及格课程，成绩计算方式以教务处公布的为准 ；三年级及以上学生外语通过大学英语四级考试（体育艺术类、专升本、职高对口班学生参加大学英语四级考试成绩在 360 分以上）或同等级别考试的优先参评 ；\n（五）积极参加社会实践活动，善于学习和吸收新知识，有较强的解决实际问题的能力和开拓创新精神 ；\n（六）积极参加体育锻炼和文娱活动，身体健康，有良好的卫生行为习惯及良好的心理素质，达到《大学生体质健康标准》。"},{"q":"学生在校期间依法履行哪些义务？","a":"（一）遵守宪法和法律、法规 ；\n（二）遵守学校《章程》和规章制度 ；\n（三）恪守学术道德，完成规定学业 ；\n（四）按规定缴纳学费及有关费用，履行获得贷学金及助学金\n的相应义务 ；\n（五）遵守学生行为规范，尊敬师长，养成良好的思想品德和\n行为习惯 ；\n法律、法规及学校《章程》规定的其他义务。"},{"q":"学生在什么情况下不得转专业？","a":"（一）新生入学未满一学期或本科三年级以上或专科二年级以上的 ；\n（二）以特殊招生形式录取的（如专升本）；\n（三）国家有相关规定或者录取前与学校有明确约定的（如免费师范生、吐鲁番地区定向免费师范生、内地新疆班、职高对口类等）；\n（四）改变招生层次、类别的（如文科生不能转入理科专业，中外合作办学类、表演类、美术类、体育类等专业学生不能跨类转专业，也不能转入普通类专业）；\n（五）已有过 1 次转专业记录的。"},{"q":"优秀学生奖学金评选等级标准：","a":"一等优秀学生奖学金评选比例为参评总人数3%，标准为2000/人/学年；\n二等优秀学生奖学金评选比例为参评总人数10%，标准为1000/人/学年；"}]};

  qa:     { name: '简答/论述', desc: '点看答案 ✦ 然后自评记住了', key: 'qa' },
};

function shuffle(a){ const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

function goHome(){
  session = null;
  titleEl.textContent = '学生手册 · 刷题';
  backBtn.style.display = 'none';
  progWrap.style.display = 'none';
  renderHome();
}

function renderHome(){
  const total = DATA.judge.length + DATA.choice.length + DATA.fill.length + DATA.qa.length;
  const wrongN = Object.keys(store.wrong).length;
  let h = '<div class="menu">';
  h += `<div class="item" onclick="start('all')"><span class="n">共 ${total} 题</span><h3>全部混合刷</h3><p>随机顺序 · 四种题型混着来</p></div>`;
  for (const k of ['judge','choice','fill','qa']){
    const t = TYPES[k];
    h += `<div class="item" onclick="start('${k}')"><span class="n">${DATA[t.key].length} 题</span><h3>${t.name}</h3><p>${t.desc}</p></div>`;
  }
  if (wrongN > 0){
    h += `<div class="item special" onclick="start('wrong')"><span class="n">${wrongN} 题</span><h3>⭐ 错题重练</h3><p>只刷之前做错的</p></div>`;
  }
  const s = store.stats;
  const acc = (s.right + s.wrong) > 0 ? Math.round(s.right / (s.right + s.wrong) * 100) : 0;
  h += '</div>';
  h += `<div style="text-align:center;color:var(--dim);font-size:13px;margin-top:18px">
          累计答对 <b style="color:var(--ok)">${s.right}</b> 题 ，
          答错 <b style="color:var(--bad)">${s.wrong}</b> 题 ，
          正确率 <b style="color:var(--accent)">${acc}%</b>
        </div>`;
  h += `<div style="text-align:center;margin-top:14px">
          <button class="back" onclick="resetAll()">清空所有记录</button>
        </div>`;
  app.innerHTML = h;
}

function resetAll(){
  if (!confirm('确定清空全部刷题记录？')) return;
  store = { done:{}, wrong:{}, stats:{ right:0, wrong:0 } };
  save(); renderHome();
}

function start(mode){
  let list = [];
  if (mode === 'all'){
    list = shuffle([
      ...DATA.judge.map(x => ({ ...x, type: 'judge' })),
      ...DATA.choice.map(x => ({ ...x, type: 'choice' })),
      ...DATA.fill.map(x => ({ ...x, type: 'fill' })),
      ...DATA.qa.map(x => ({ ...x, type: 'qa' })),
    ]);
  } else if (mode === 'wrong'){
    for (const k of ['judge','choice','fill','qa']){
      DATA[k].forEach((x, i) => { if (store.wrong[k + ':' + i]) list.push({ ...x, type: k, oi: i }); });
    }
    list = shuffle(list);
  } else {
    list = shuffle(DATA[mode].map((x, i) => ({ ...x, type: mode, oi: i })));
  }
  if (!list.length){ alert('这个类别没有题目'); return; }
  session = { list, idx: 0, right: 0, wrongList: [], mode };
  backBtn.style.display = 'block';
  progWrap.style.display = 'block';
  titleEl.textContent = mode === 'all' ? '全部混合' : (mode === 'wrong' ? '错题重练' : TYPES[mode].name);
  renderQ();
}

function updateProg(){
  const s = session;
  const p = s.idx / s.list.length * 100;
  progi.style.width = p + '%';
  progt.textContent = `${s.idx} / ${s.list.length}　对 ${s.right}`;
}

function renderQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderResult();
  updateProg();
  const q = s.list[s.idx];
  const t = TYPES[q.type];
  let h = `<div class="qcard"><div class="qtype">${t.name}　第 ${s.idx+1} 题</div>`;
  h += `<div class="qtext">${hl(q.q)}</div>`;

  if (q.type === 'judge'){
    h += `<div class="tf" id="tf">
            <button onclick="answerTF('对')" id="btnT">√ 对</button>
            <button onclick="answerTF('错')" id="btnF">× 错</button>
          </div>`;
  } else if (q.type === 'choice'){
    h += `<div class="opts" id="opts">`;
    q.opts.forEach((o, i) => { h += `<div class="opt" id="opt${i}" onclick="answerChoice(${i})">${hl(o)}</div>`; });
    h += `</div>`;
    h += `<div style="color:var(--dim);font-size:13px;margin-top:10px">正确答案可能有多选 · 选完点下面的按钮提交</div>`;
    h += `<div class="actions"><button class="btn-next" id="submitChoice" onclick="submitChoice()" disabled>提交</button></div>`;
    s.choiceSel = new Set();
  } else if (q.type === 'fill'){
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerFill();return false;">
            <input id="fillInput" placeholder="输入答案 · 多个空用空格分开" autocomplete="off" enterkeyhint="done" required>
            <div class="btns">
              <button type="submit">提交</button>
              <button type="button" onclick="showFillAnswer()">看答案</button>
            </div>
          </form>`;
  } else {
    h += `<div class="actions"><button class="btn-self" onclick="showQA()">看答案</button></div>`;
  }

  h += `<div class="ansbox" id="ansbox"></div>`;
  h += `<div class="feedback" id="fb" style="display:none"></div>`;
  h += `<div class="actions" id="nextWrap" style="display:none">
          <button class="btn-next" id="nextBtn" onclick="nextQ()">下一题 →</button>
        </div>`;
  h += '</div>';
  app.innerHTML = h;

  if (q.type === 'fill'){
    const inp = document.getElementById('fillInput');
    inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') answerFill(); });
  }
}

// 把空格高亮
function hl(s){
  return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\s{3,}|_{3,})/g, '<span class="blank">＿＿＿</span>');
}

function showAnswer(ans, ok){
  const box = document.getElementById('ansbox');
  box.innerHTML = '<b>正确答案</b><br>' + String(ans).replace(/</g,'&lt;');
  box.classList.add('show');
  const fb = document.getElementById('fb');
  fb.style.display = 'block';
  if (ok === true){ fb.className = 'feedback good'; fb.textContent = '✅ 答对了'; }
  else if (ok === false){ fb.className = 'feedback bad'; fb.textContent = '❌ 答错了，看上面的正确答案'; }
  else { fb.className = 'feedback'; fb.style.color = 'var(--dim)'; fb.textContent = '看完自己判断 · 下面点"我记住了"'; }
  document.getElementById('nextWrap').style.display = 'flex';
}

function mark(ok, key){
  const s = session;
  const q = s.list[s.idx];
  const id = q.type + ':' + (q.oi !== undefined ? q.oi : s.idx);
  if (ok){
    s.right++;
    store.stats.right++;
    delete store.wrong[id];
  } else {
    s.wrongList.push(q);
    store.stats.wrong++;
    store.wrong[id] = true;
  }
  save();
  updateProg();
}

function answerTF(val){
  const q = session.list[session.idx];
  const ok = (val === q.a);
  document.getElementById('btnT').disabled = true;
  document.getElementById('btnF').disabled = true;
  document.getElementById('btnT').className = (q.a === '对') ? 'ok' : (val === '对' ? 'no' : '');
  document.getElementById('btnF').className = (q.a === '错') ? 'ok' : (val === '错' ? 'no' : '');
  mark(ok);
  showAnswer(q.a, ok);
}

function answerChoice(i){
  const q = session.list[session.idx];
  const s = session;
  if (s.submitted) return;
  const el = document.getElementById('opt' + i);
  if (s.choiceSel.has(i)){ s.choiceSel.delete(i); el.classList.remove('right'); el.classList.add('dim'); }
  else { s.choiceSel.add(i); el.classList.add('right'); el.classList.remove('dim'); }
  document.getElementById('submitChoice').disabled = s.choiceSel.size === 0;
}

function submitChoice(){
  const q = session.list[session.idx];
  const s = session;
  s.submitted = true;
  const LETTERS = 'ABCDEFGH';
  const mine = [...s.choiceSel].map(i => LETTERS[i]).sort().join('');
  const ok = (mine === q.a);
  q.opts.forEach((o, i) => {
    const el = document.getElementById('opt' + i);
    const L = LETTERS[i];
    el.onclick = null;
    if (q.a.includes(L)) { el.classList.remove('dim'); el.classList.add('right'); }
    else if (s.choiceSel.has(i)) { el.classList.remove('right'); el.classList.add('wrong'); }
    else { el.classList.remove('right'); el.classList.add('dim'); }
  });
  const btn = document.getElementById('submitChoice');
  if (btn) btn.style.display = 'none';
  mark(ok);
  showAnswer(q.a, ok);
  s.submitted = false;
}

function norm(s){
  return String(s).toLowerCase()
    .replace(/[\s，,。．.、；;：:（）()【】\[\]"'"'']/g, '')
    .trim();
}

function answerFill(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a);
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok);
}

function showFillAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  mark(false);
  showAnswer(q.a, null);
  // 自评按钮
  addSelfEval();
}

function showQA(){
  const q = session.list[session.idx];
  mark(false);
  showAnswer(q.a, null);
  addSelfEval();
}

function addSelfEval(){
  const wrap = document.getElementById('nextWrap');
  const btn = document.createElement('button');
  btn.className = 'btn-self';
  btn.textContent = '我记住了 ✓';
  btn.onclick = () => {
    const s = session;
    const q = s.list[s.idx];
    const id = q.type + ':' + (q.oi !== undefined ? q.oi : s.idx);
    delete store.wrong[id];
    store.stats.wrong = Math.max(0, store.stats.wrong - 1);
    store.stats.right++;
    save();
    nextQ();
  };
  wrap.insertBefore(btn, wrap.firstChild);
}

function nextQ(){
  session.idx++;
  renderQ();
}

function renderResult(){
  const s = session;
  const total = s.list.length;
  const acc = Math.round(s.right / total * 100);
  let h = `<div class="qcard result">
            <div class="big">${acc}%</div>
            <div class="lbl">本轮 ${total} 题 · 答对 ${s.right} 题</div>
            <div class="row">
              <div class="g"><b>${s.right}</b>答对</div>
              <div class="r"><b>${total - s.right}</b>答错</div>
            </div>`;
  if (acc >= 90) h += '<div style="color:var(--ok);font-size:15px">很棒 · 这个掌握得不错</div>';
  else if (acc >= 70) h += '<div style="color:var(--warn);font-size:15px">还行 · 错的那几题再刷一遍</div>';
  else h += '<div style="color:var(--bad);font-size:15px">先把错题重练一遍吧</div>';

  h += `<button onclick="start('${s.mode}')">再来一轮</button>`;
  if (s.wrongList.length) h += `<button class="sec" onclick="start('wrong')">只刷本轮错题（${s.wrongList.length}）</button>`;
  h += `<button class="sec" onclick="goHome()">回首页</button>`;
  h += '</div>';
  app.innerHTML = h;
  progWrap.style.display = 'none';
}

// 快捷键：判断题按 1/2 · 选择题按 A-D
document.addEventListener('keydown', e => {
  if (!session) return;
  const q = session.list[session.idx];
  if (!q) return;
  if (q.type === 'judge'){
    if (e.key === '1') answerTF('对');
    if (e.key === '2') answerTF('错');
  }
  if (q.type === 'choice' && !session.submitted){
    const L = 'ABCDEFGH';
    const i = L.indexOf(e.key.toUpperCase());
    if (i >= 0) answerChoice(i);
    if (e.key === 'Enter') submitChoice();
  }
  if (e.key === 'Enter' && document.getElementById('nextWrap')?.style.display === 'flex'){
    const nb = document.getElementById('nextBtn');
    if (nb) nb.click();
  }
});

renderHome();
</script>
</body>
</html>
