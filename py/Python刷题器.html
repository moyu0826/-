<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 刷题器</title>
<style>
  :root{
    --bg:#edf1fa; --card:#fffaf0; --card2:#f8f3e8; --line:#d7def0;
    --ink:#172347; --dim:#6f7c99; --accent:#405a99; --ok:#4a8a5e; --bad:#b64a45;
    --warn:#b8860b; --py1:#a8894e; --py2:#405a99;
    --gold:#c5a468; --gold2:#d9bd83; --navy:#172347; --cream:#fffaf0;
    --mist:#e7ecf7; --steel:#96a6c9; --deep:#10204d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto; padding:14px 12px 100px; max-width:760px; color:var(--ink);
       background:
         radial-gradient(ellipse 90% 60% at 15% 0%, #f8faff 0%, transparent 55%),
         radial-gradient(ellipse 80% 55% at 85% 100%, #e2e8f5 0%, transparent 55%),
         linear-gradient(165deg,#f8faff 0%,#edf1fa 45%,#e7ecf7 100%);
       background-attachment:fixed;
       font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       padding-left:max(12px,env(safe-area-inset-left));
       padding-right:max(12px,env(safe-area-inset-right));
       padding-bottom:max(100px,calc(env(safe-area-inset-bottom) + 70px))}
  button,.opt,.item,touch-action{touch-action:manipulation}

  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .top h1{font-size:19px; margin:0; color:var(--navy)}
  .top h1 span{color:var(--gold)}
  .top .back{background:var(--cream); border:1px solid var(--gold2); color:var(--accent);
             border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer}

  .prog{background:#e2e8f5; border-radius:8px; height:26px; position:relative; overflow:hidden; margin-bottom:14px;
        border:1px solid var(--line)}
  .prog i{position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--gold2),var(--gold)); width:0; transition:.25s}
  .prog span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px}

  .menu{display:grid; gap:11px}
  .item{background:var(--card); border:1.5px solid var(--gold2); border-radius:14px; padding:16px 18px;
        cursor:pointer; box-shadow:0 2px 10px rgba(93,113,158,.09); position:relative}
  .item:active{background:var(--card2); border-color:var(--gold)}
  .item h3{margin:0 0 4px; font-size:16px; color:var(--navy)}
  .item p{margin:0; color:var(--dim); font-size:13px}
  .item .n{float:right; color:var(--accent); font-size:14.5px; font-weight:700}
  .item.special{border-color:var(--gold)} .item.special .n{color:var(--warn)}
  .item.code{background:linear-gradient(135deg,#fffaf0,#f8f3e8); border-color:var(--gold)}

  .qcard{background:var(--card); border:1.5px solid var(--gold2); border-radius:14px; padding:18px 16px;
         margin-bottom:14px; box-shadow:0 2px 12px rgba(93,113,158,.08)}
  .qtype{font-size:12px; color:var(--accent); letter-spacing:1px; margin-bottom:10px}
  .qtext{font-size:16.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word}
  .codeblock{background:#172347; border:1px solid var(--gold); border-radius:8px; padding:13px;
             font:13.5px/1.65 Consolas,"Courier New",monospace; white-space:pre; overflow-x:auto;
             color:#e7ecf7; margin:12px 0}
  .codeblock .kw{color:#e8b96a}.codeblock .st{color:#a8c5e8}.codeblock .nu{color:#d9bd83}

  .opts{margin-top:16px; display:grid; gap:9px}
  .opt{background:#fffdf8; border:1.5px solid var(--line); border-radius:10px; padding:14px 15px;
       font-size:15.5px; cursor:pointer; line-height:1.6; min-height:52px; display:flex; align-items:center;
       color:var(--ink)}
  .opt.right{border-color:var(--ok); background:rgba(74,138,94,.14)}
  .opt.wrong{border-color:var(--bad); background:rgba(182,74,69,.14)}
  .opt.dim{opacity:.45}

  .tf{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:18px}
  .tf button{padding:22px; border-radius:12px; border:1.5px solid var(--gold2); background:#fffdf8;
             color:var(--ink); font-size:19px; font-weight:600; cursor:pointer; min-height:72px}
  .tf button.ok{border-color:var(--ok); background:rgba(63,185,80,.16)}
  .tf button.no{border-color:var(--bad); background:rgba(248,81,73,.16)}

  .fillbox{margin-top:16px}
  .fillbox input{width:100%; background:var(--card2); border:1.5px solid var(--line); border-radius:10px;
                 padding:13px 14px; color:var(--ink); font-size:16px; outline:none;
                 font-family:Consolas,monospace}
  .fillbox input:focus{border-color:var(--accent)}
  .fillbox .btns{display:flex; gap:9px; margin-top:10px}
  .fillbox .btns button{flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
                        background:var(--card2); color:var(--ink); font-size:15px; cursor:pointer}

  .ansbox{margin-top:16px; background:rgba(64,90,153,.07); border-left:3px solid var(--gold);
          border-radius:8px; padding:12px 14px; font-size:14.5px; white-space:pre-wrap; display:none}
  .ansbox.show{display:block}
  .ansbox b{color:var(--accent)}
  .ansbox .mono{font-family:Consolas,monospace; color:var(--py1)}
  .explain{margin-top:13px; padding-top:13px; border-top:1px dashed var(--gold2);
           font-size:14px; line-height:1.8; color:#2c3a5c}
  .explain b{color:var(--warn)}

  .actions{display:flex; gap:9px; margin-top:16px; flex-wrap:wrap}
  .actions button{flex:1; min-width:120px; padding:14px; border-radius:11px; border:0;
                  font-size:15.5px; font-weight:600; cursor:pointer}
  .btn-next{background:var(--accent); color:#06101f}
  .btn-self{background:var(--card2); color:var(--ink); border:1px solid var(--line) !important}
  .btn-run{background:var(--ok); color:#06101f}
  .btn-ref{background:var(--card2); color:var(--py1); border:1px solid var(--py2) !important}

  .feedback{margin-top:14px; font-size:15px; font-weight:600; text-align:center; padding:10px; border-radius:10px}
  .feedback.good{color:var(--ok); background:rgba(63,185,80,.1)}
  .feedback.bad{color:var(--bad); background:rgba(248,81,73,.1)}
  .feedback.mid{color:var(--warn); background:rgba(210,153,34,.1)}

  /* 实操题 */
  .editor{width:100%; min-height:200px; background:#172347; color:#e7ecf7; border:1.5px solid var(--gold);
          border-radius:10px; padding:13px; font:13.5px/1.65 Consolas,"Courier New",monospace;
          resize:vertical; outline:none; tab-size:4}
  .editor:focus{border-color:var(--accent)}
  .testlist{margin-top:14px; display:grid; gap:8px}
  .testrow{background:#fffdf8; border-radius:8px; padding:11px 13px; font-size:13.5px;
           border-left:3px solid var(--line)}
  .testrow.pass{border-left-color:var(--ok)}
  .testrow.fail{border-left-color:var(--bad)}
  .testrow .call{font-family:Consolas,monospace; color:var(--accent); font-size:13px}
  .testrow .kv{margin-top:5px; font-family:Consolas,monospace; font-size:12.5px; line-height:1.7}
  .testrow .got{color:var(--bad)} .testrow .exp{color:var(--ok)}
  .tipbox{margin-top:14px; background:rgba(197,164,104,.12); border-left:3px solid var(--gold);
          border-radius:8px; padding:12px 14px; font-size:14px; display:none}
  .tipbox.show{display:block}
  .tipbox h4{margin:0 0 8px; font-size:14px; color:var(--warn)}
  .tipbox ul{margin:0; padding-left:20px}
  .tipbox li{margin:6px 0; line-height:1.65}
  .pyodide-status{font-size:12.5px; color:var(--dim); margin-top:10px; text-align:center}
  .pyodide-status.ready{color:var(--ok)}
  .pyodide-status.err{color:var(--bad)}

  .result{text-align:center; padding:30px 16px}
  .result .big{font-size:52px; font-weight:800; color:var(--accent); line-height:1.2}
  .result .lbl{color:var(--dim); font-size:14px; margin-bottom:22px}
  .result .row{display:flex; justify-content:space-around; margin:24px 0; font-size:14px}
  .result .row div b{display:block; font-size:22px}
  .result .row .g{color:var(--ok)} .result .row .r{color:var(--bad)}
  .result button{margin-top:12px; width:100%; padding:15px; border-radius:12px; border:0;
                 font-size:16px; font-weight:600; cursor:pointer; background:var(--accent); color:#06101f}
  .result button.sec{background:var(--card2); color:var(--ink); border:1px solid var(--line)}

  /* ═══ 目录界面：手机屏幕 ═══ */
  .phone{max-width:340px; margin:20px auto; background:linear-gradient(170deg,#fffaf0,#f3e8cf);
         border:2.5px solid var(--gold); border-radius:34px; padding:9px;
         box-shadow:0 10px 34px rgba(93,113,158,.22), inset 0 0 0 1px rgba(255,255,255,.7)}
  .phone-inner{background:linear-gradient(175deg,#f8faff 0%,#e7ecf7 100%); border-radius:27px;
               padding:20px 16px 18px; position:relative; overflow:hidden}
  .phone-inner::before{content:''; position:absolute; top:9px; left:50%; transform:translateX(-50%);
                       width:64px; height:5px; background:var(--navy); border-radius:3px; opacity:.25}
  .phone-title{text-align:center; font-size:12px; color:var(--steel); letter-spacing:2px; margin:14px 0 18px}
  .entry{display:flex; align-items:center; gap:12px; background:#fffdf8; border:1.5px solid var(--gold2);
         border-radius:14px; padding:15px 16px; margin-bottom:12px; cursor:pointer;
         box-shadow:0 2px 8px rgba(93,113,158,.09)}
  .entry:active{background:#f3e8cf; transform:scale(.985)}
  .entry .ico{font-size:24px; line-height:1}
  .entry .txt{flex:1}
  .entry .txt b{display:block; font-size:16px; color:var(--navy)}
  .entry .txt small{color:var(--dim); font-size:12px}
  .entry .arw{color:var(--gold); font-size:18px}
  .welcome{text-align:center; margin-top:22px; color:var(--steel); font-size:13px}
  .welcome .big{font-size:15px; color:var(--navy); margin-bottom:6px; letter-spacing:1px}
  .welcome .chibi{font-size:40px; margin-top:8px; display:block}
  .soon{text-align:center; color:var(--dim); font-size:13px; padding:40px 20px; line-height:2}
  .soon .ic{font-size:44px; display:block; margin-bottom:12px; opacity:.5}

  /* ═══ 笔记区 ═══ */
  .notelist{display:grid; gap:10px}
  .noteitem{display:flex; align-items:center; gap:12px; background:var(--cream);
            border:1.5px solid var(--gold2); border-radius:13px; padding:14px 15px; cursor:pointer;
            box-shadow:0 2px 8px rgba(93,113,158,.08)}
  .noteitem:active{background:var(--card2); transform:scale(.99)}
  .noteitem .nid{flex:0 0 34px; height:34px; border-radius:50%; background:linear-gradient(140deg,var(--gold2),var(--gold));
                 color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center;
                 box-shadow:0 2px 6px rgba(197,164,104,.4)}
  .noteitem .nt{flex:1; min-width:0}
  .noteitem .nt b{display:block; font-size:15.5px; color:var(--navy); line-height:1.4}
  .noteitem .nt small{color:var(--dim); font-size:12px}
  .noteitem .narw{color:var(--gold); font-size:20px; font-weight:300}

  .notehead{background:linear-gradient(135deg,#fffaf0,#f3e8cf); border:1.5px solid var(--gold);
            border-radius:14px; padding:16px 17px; margin-bottom:14px}
  .notehead .no{font-size:11.5px; color:var(--gold); letter-spacing:2px; margin-bottom:6px}
  .notehead h2{margin:0; font-size:19px; color:var(--navy); line-height:1.45}

  .nb-p{margin:12px 0; font-size:15px; line-height:1.85; color:var(--ink)}
  .nb-h{margin:20px 0 8px; font-size:15.5px; color:var(--accent); padding-left:9px;
        border-left:3px solid var(--gold)}
  .nb-code{background:#172347; border:1px solid var(--gold); border-radius:10px; padding:13px 14px;
           font:13.5px/1.7 Consolas,"Courier New",monospace; white-space:pre-wrap; overflow-x:auto;
           color:#e7ecf7; margin:12px 0; tab-size:4}
  .nb-out{background:#e7ecf7; border-radius:10px; padding:11px 14px; margin:-4px 0 14px;
          border-left:3px solid var(--steel)}
  .nb-out b{font-size:11.5px; color:var(--steel); letter-spacing:1px; display:block; margin-bottom:5px}
  .nb-out pre{margin:0; font:13px/1.65 Consolas,"Courier New",monospace; color:var(--navy); white-space:pre-wrap}
  .nb-tip{background:rgba(64,90,153,.09); border-left:3px solid var(--accent); border-radius:9px;
          padding:12px 14px; margin:13px 0; font-size:14px; line-height:1.8; color:#2c3a5c}
  .nb-warn{background:rgba(197,164,104,.15); border-left:3px solid var(--gold); border-radius:9px;
           padding:12px 14px; margin:13px 0; font-size:14px; line-height:1.8; color:#6b5320}
  .nb-note{background:linear-gradient(135deg,#fffaf0,#f3e8cf); border:1.5px solid var(--gold2);
           border-radius:11px; padding:13px 15px; margin:14px 0; font-size:14px; line-height:1.8;
           color:var(--navy); box-shadow:0 2px 8px rgba(197,164,104,.15)}
  .notefoot{display:flex; gap:9px; margin-top:22px}
  .notefoot button{flex:1; padding:13px; border-radius:11px; border:1.5px solid var(--gold2);
                   background:var(--cream); color:var(--accent); font-size:14.5px; font-weight:600; cursor:pointer}
  .notefoot button:disabled{opacity:.35}

  /* ═══ 闯关模式 ═══ */
  .levelitem{display:flex; align-items:center; gap:13px; background:var(--cream);
             border:1.5px solid var(--gold2); border-radius:14px; padding:15px 16px; margin-bottom:11px;
             cursor:pointer; box-shadow:0 2px 9px rgba(93,113,158,.08); position:relative; overflow:hidden}
  .levelitem::after{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
                    background:linear-gradient(180deg,var(--gold2),var(--gold))}
  .levelitem:active{background:var(--card2); transform:scale(.99)}
  .levelitem.locked{opacity:.5; cursor:not-allowed; background:#f2f0ea}
  .levelitem.locked::after{background:#c9c9c9}
  .levelitem.passed::after{background:linear-gradient(180deg,#7ec98f,#4a8a5e)}
  .levelitem .lnum{flex:0 0 42px; height:42px; border-radius:12px;
                   background:linear-gradient(140deg,var(--gold2),var(--gold)); color:#fff;
                   font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center;
                   box-shadow:0 3px 8px rgba(197,164,104,.35)}
  .levelitem.locked .lnum{background:#bdbdbd; box-shadow:none}
  .levelitem.passed .lnum{background:linear-gradient(140deg,#8fd9a1,#4a8a5e); box-shadow:0 3px 8px rgba(74,138,94,.3)}
  .levelitem .lt{flex:1; min-width:0}
  .levelitem .lt b{display:block; font-size:15.5px; color:var(--navy); line-height:1.35}
  .levelitem .lt small{color:var(--dim); font-size:12px; display:block; margin-top:2px}
  .levelitem .lstate{font-size:12px; font-weight:600; flex:0 0 auto}
  .levelitem .lstate.ok{color:var(--ok)}
  .levelitem .lstate.lock{color:#aaa}
</style>
</head>
<body>

<div class="top">
  <h1><span>🐍</span> Python 刷题器</h1>
  <button class="back" id="backBtn" style="display:none" onclick="goHome()">返回</button>
</div>
<div class="prog" id="progWrap" style="display:none"><i id="progi"></i><span id="progt"></span></div>

<div id="app"></div>

<script>
/* Pyodide 多源自动切换 ✦ 一个 CDN 挂了换下一个 */
window.__PY_CDNS = [
  'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/',
  'https://fastly.jsdelivr.net/pyodide/v0.26.2/full/',
  'https://unpkg.com/pyodide@0.26.2/'
];
window.__PY_IDX = null;
window.__PY_FAILED = false;
(function loadNext(i){
  if (i >= window.__PY_CDNS.length) {
    window.__PY_FAILED = true;
    window.dispatchEvent(new Event('pyodidefail'));
    return;
  }
  const idx = window.__PY_CDNS[i];
  const s = document.createElement('script');
  s.src = idx + 'pyodide.js';
  s.onload = () => {
    window.__PY_IDX = idx;
    window.dispatchEvent(new Event('pyodideloaded'));
  };
  s.onerror = () => loadNext(i + 1);
  document.head.appendChild(s);
})(0);
</script>
<script>
const DATA = {"judge":[{"q":"print(1, 2) 的输出是 1 2（中间有空格）","a":"对","e":"print 接收多个参数时默认用【空格】分隔，所以输出 1 2，不是 12。"},{"q":"print() 输出完会自动换行","a":"对","e":"print() 默认 end=\"\\n\"，所以每次都自动换行。想不换行就写 print(x, end=\"\")。"},{"q":"print(\"a\", \"b\", sep=\"-\") 输出 a-b","a":"对","e":"sep 参数控制多个参数之间的分隔符，默认是空格，改成 \"-\" 就输出 a-b。"},{"q":"Python 的变量名可以用中文","a":"对","e":"Python 3 允许用中文做变量名（合法的 Unicode 标识符），但不建议，因为很多编辑器/库会出错。"},{"q":"变量名可以以数字开头，比如 2name = 1","a":"错","e":"变量名不能以数字开头（2name 是语法错误）。可以用字母、下划线开头，或者下划线+数字。"},{"q":"Python 变量不需要提前声明类型","a":"对","e":"Python 是动态类型语言，赋值时才确定类型，不需要提前写 int a = 1 这种声明。"},{"q":"7 // 2 的结果是 3","a":"对","e":"// 是【整除】，只保留商的整数部分。7 // 2 = 3（小数部分被丢掉，不是四舍五入）。"},{"q":"2 ** 3 的结果是 6","a":"错","e":"** 是【乘方】，不是乘法。2 ** 3 = 2³ = 8，不是 6。"},{"q":"7 % 2 的结果是 1","a":"对","e":"% 是【取余】，7 ÷ 2 = 3 余 1，所以结果是 1。常用于判断奇偶：n % 2 == 0 就是偶数。"},{"q":"Python 里 1 / 2 的结果是 0","a":"错","e":"Python 3 的 / 是【真除法】，永远返回浮点数。1 / 2 = 0.5，不是 0。要整除得用 //。"},{"q":"input() 返回的内容永远是字符串类型","a":"对","e":"input() 读到的永远是最原始的一行文本，类型是 str。所以 input() 后要算数必须先用 int() 转换。"},{"q":"input() 的提示文字要写在括号里","a":"对","e":"括号里写提示文字：input(\"请输入：\")。括号里不写东西也行，但用户会不知道要输什么。"},{"q":"int(\"3.5\") 能成功转换成 3","a":"错","e":"int() 只能转换【纯整数形式】的字符串。\"3.5\" 有小点，int() 处理不了会报 ValueError。要转得先 float(\"3.5\")。"},{"q":"\"3\" + \"4\" 的结果是 \"34\"","a":"对","e":"字符串相加是【拼接】不是算术加法。\"3\" + \"4\" 得到 \"34\"。想算 7 得先 int(\"3\") + int(\"4\")。"},{"q":"float(\"3\") 会报错","a":"错","e":"float(\"3\") 是合法的，得到 3.0。浮点转换允许整数形式。会报错的是 int(\"3.5\") 这种。"},{"q":"if 后面的冒号可以省略","a":"错","e":"if 后面的冒号是语法要求，不能省。冒号 + 缩进共同表示「下面是这个条件成立时执行的块」。"},{"q":"elif 可以单独使用，前面不需要 if","a":"错","e":"elif 是「else if」的缩写，它必须跟在 if（或另一个 elif）后面。单独的 elif 是语法错误。"},{"q":"if 语句块靠缩进来表示范围","a":"对","e":"Python 用【缩进】表示代码块，不用大括号。同一个块的缩进量必须一致，否则报 IndentationError。"},{"q":"Python 用 4 个空格作为标准缩进","a":"对","e":"PEP 8 官方规范是每层缩进 4 个空格。混用 Tab 和空格会报错（TabError），所以统一用空格。"},{"q":"列表是可变的，元组是不可变的","a":"对","e":"list 是可变序列（能增删改），tuple 是不可变序列（创建后不能改）。所以元组能做字典的键，列表不能。"},{"q":"字符串可以直接用 s[0] = \"x\" 修改","a":"错","e":"字符串是不可变类型，s[0] = \"x\" 会报 TypeError。想改只能新建一个字符串，比如 s = \"x\" + s[1:]。"},{"q":"None 表示\"什么都没有\"","a":"对","e":"None 是 Python 的特殊值，表示「空」「没有」。函数不写 return 时返回的就是 None。"},{"q":"and 的优先级比 or 高","a":"对","e":"优先级：not > and > or。所以 a and b or c 等价于 (a and b) or c。不确定就加括号。"},{"q":"not 1 == 2 的结果是 True","a":"对","e":"先算 1 == 2 得到 False，再 not False 得到 True。注意 == 的优先级比 not 高。"},{"q":"1 and 0 的结果是 0","a":"对","e":"and 是「短路」运算：左边 1 为真，就返回右边的 0。所以 1 and 0 得 0。"},{"q":"0 or \"abc\" 的结果是 \"abc\"","a":"对","e":"or 也是短路：左边 0 是假，就返回右边的 \"abc\"。所以结果不是 True 而是 \"abc\" 本身。"},{"q":"while 循环体可能一次都不执行","a":"对","e":"while 是先判断再执行，条件一开始就是假的话，循环体一次都不跑。"},{"q":"while True: 是死循环的写法","a":"对","e":"while True: 后面没有 break 就是死循环。这种写法很常见，靠循环体里的 break 退出。"},{"q":"range(5) 产生 0,1,2,3,4","a":"对","e":"range(n) 产生 0 到 n-1。range(5) = 0,1,2,3,4，【不包含 5】。这个「左闭右开」最容易搞错。"},{"q":"range(1, 10, 3) 产生 1,4,7","a":"对","e":"range(起, 止, 步长)：从 1 开始，每次加 3，到 10 之前停 → 1, 4, 7（下一个 10 超出了）。"},{"q":"range(10, 0, -1) 是倒序","a":"对","e":"步长为负数就是倒着数。range(10, 0, -1) 产生 10,9,8,...,1，不包含 0。"},{"q":"for 循环后面必须写一个冒号","a":"对","e":"for 语句和 if 一样，末尾必须有冒号，下一行缩进。"},{"q":"break 是跳出本次循环，继续下一次","a":"错","e":"说反了！break 是【跳出整个循环】，continue 才是跳过本次、继续下一次。这是最常考的一组。"},{"q":"continue 是跳过本次循环剩下的代码","a":"对","e":"continue 会跳过循环体剩下的代码，直接进入下一次循环。所以循环不会结束，只是这一次不执行完。"},{"q":"列表下标从 1 开始","a":"错","e":"列表下标从【0】开始。lst = [10,20,30] 时，lst[0]=10、lst[1]=20、lst[2]=30。"},{"q":"lst[-1] 取的是最后一个元素","a":"对","e":"负数下标是从末尾往前数：-1 是最后一个，-2 是倒数第二个。这个用法很常用。"},{"q":"列表里可以放不同类型的数据","a":"对","e":"列表元素类型可以不一样，[1, \"abc\", 3.14, True] 是合法的。这点和 C/Java 的数组不同。"},{"q":"lst.append(x) 会把 x 加到列表末尾","a":"对","e":"append 加到末尾。加到指定位置用 insert(下标, 值)，合并另一个列表用 extend()。"},{"q":"字典的键可以用列表","a":"错","e":"字典的键必须是【不可变】类型（int/str/tuple 等）。列表可变所以不能做键，会报 TypeError: unhashable type。"},{"q":"d.get(\"不存在的键\") 会报错","a":"错","e":"get() 就是为「安全取值」设计的：键不存在时返回 None（或你指定的默认值），不会报错。"},{"q":"d[\"不存在的键\"] 会报 KeyError","a":"对","e":"直接用 d[键] 取值时，键不存在会抛 KeyError。所以不确定键在不在就用 get()。"},{"q":"字典的键必须唯一","a":"对","e":"字典的键不能重复。给同一个键赋两次值，后一次会覆盖前一次。"},{"q":"lst[1:3] 取的是下标 1、2、3 三个元素","a":"错","e":"切片是【左闭右开】：lst[1:3] 包含下标 1 和 2，不包含 3。这是 Python 切片的铁律。"},{"q":"lst[::-1] 可以把列表倒过来","a":"对","e":"切片的第三个参数是步长，-1 表示从后往前，所以 lst[::-1] 就是把列表倒过来。字符串也能这么用。"},{"q":"函数不写 return 时会返回 None","a":"对","e":"函数没有 return 语句时，Python 自动返回 None。所以 print(函数()) 会打印 None。"},{"q":"函数必须先定义再调用","a":"对","e":"Python 是解释执行，函数定义必须先于调用。写在调用后面会报 NameError。"},{"q":"函数参数可以有默认值","a":"对","e":"def f(a, b=10) 里 b 有默认值，调用时可以不传。这样同一个函数能适应不同场景。"},{"q":"有默认值的参数要放在没有默认值的参数前面","a":"错","e":"说反了！有默认值的参数必须【放在最后】。def f(a=1, b) 是语法错误（SyntaxError: non-default argument follows default argument）。"},{"q":"print 和 return 的作用是一样的","a":"错","e":"完全不是一回事！print 是把内容显示到屏幕上，return 是把值【交回给调用者】。函数里 print 了但没 return，外面拿到的还是 None。"},{"q":"return 后面的代码不会被执行","a":"对","e":"return 一旦执行，函数立刻结束，后面的代码永远跑不到。这叫「不可达代码」。"},{"q":"open 的 \"w\" 模式会清空原文件内容","a":"对","e":"\"w\" 是覆盖写：文件存在就先清空再写。想保留原内容往后加，要用 \"a\" 模式。"},{"q":"open 的 \"a\" 模式是追加写入","a":"对","e":"\"a\" 是 append 追加模式，在文件末尾接着写。文件不存在时会自动创建。"},{"q":"\"r\" 模式下文件不存在会报错","a":"对","e":"\"r\" 是只读模式，文件不存在直接抛 FileNotFoundError。所以读之前最好判断一下在不在。"},{"q":"读写中文文件时必须写 encoding=\"utf-8\"","a":"对","e":"Windows 中文系统默认编码是 GBK，Python 默认也用系统编码。不写 encoding=\"utf-8\" 读 UTF-8 文件会乱码或报 UnicodeDecodeError。"},{"q":"with open(...) as f: 会自动关闭文件","a":"对","e":"with 是上下文管理器，退出 with 块时自动调用 f.close()，就算中间报错也会关。比手动 close() 安全得多。"},{"q":"__init__ 方法在创建对象时会自动调用","a":"对","e":"Student() 创建对象时，Python 自动调用 __init__ 初始化。所以 __init__ 叫「构造方法」。"},{"q":"类名一般用大写字母开头（如 Student）","a":"对","e":"按 PEP 8 规范，类名用【大驼峰】（每个单词首字母大写），比如 Student、MyClass。函数和变量用小写下划线。"},{"q":"一个类只能创建一个对象","a":"错","e":"一个类可以创建任意多个对象，每个对象互相独立。s1 = Student(\"小明\")、s2 = Student(\"小红\") 是两个不同的人。"},{"q":"self 代表对象自己","a":"对","e":"self 就是「当前这个对象自己」的引用。调用 s.show() 时，self 自动等于 s，不用手动传。"},{"q":"类的方法里 self 可以省略不写","a":"错","e":"方法定义时第一个参数必须是 self（名字可以换但强烈建议叫 self）。不写的话调用时会报参数个数不对。"},{"q":"在方法里写 self.x = 10 会修改对象的属性","a":"对","e":"在方法里 self.x = 10 就是给这个对象设置/修改属性 x。所有方法都能通过 self 访问到。"},{"q":"对象的属性只能在 __init__ 里创建","a":"错","e":"属性可以在任何方法里创建（比如 def set_age(self): self.age = 18），不限于 __init__。但规范做法是在 __init__ 里初始化。"}],"choice":[{"q":"print(3 + 4 * 2) 的输出是？","opts":["A、 11","B、 14","C、 7","D、 24"],"a":"A","e":"先算乘除后算加减：4*2=8，3+8=11。Python 的运算优先级和数学一样。"},{"q":"print(10 // 3) 的输出是？","opts":["A、 3","B、 3.33","C、 4","D、 1"],"a":"A","e":"// 是整除，10//3 只取商的整数部分 3（小数 0.33 被丢掉）。"},{"q":"print(2 ** 3 ** 2) 的输出是？","opts":["A、 64","B、 512","C、 36","D、 12"],"a":"B","e":"** 是【右结合】的：2 ** 3 ** 2 先算 3**2=9，再算 2**9=512。不是 (2**3)**2=64。"},{"q":"type(3.0) 的结果是？","opts":["A、 <class 'int'>","B、 <class 'float'>","C、 <class 'str'>","D、 <class 'number'>"],"a":"B","e":"3.0 带小数点就是 float。注意：3 是 int，3.0 是 float，虽然值相等但类型不同。"},{"q":"print(\"5\" + \"3\") 的输出是？","opts":["A、 8","B、 53","C、 \"53\"","D、 报错"],"a":"B","e":"两个字符串相加是【拼接】，\"5\"+\"3\" = \"53\"。想算 8 得写 int(\"5\")+int(\"3\")。"},{"q":"print(int(\"7\") + 3) 的输出是？","opts":["A、 73","B、 10","C、 报错","D、 \"73\""],"a":"B","e":"int(\"7\") 先把字符串转成数字 7，再加 3 得到 10。"},{"q":"a = [1, 2, 3]；print(a[1]) 的输出是？","opts":["A、 1","B、 2","C、 3","D、 报错"],"a":"B","e":"下标从 0 开始：a[0]=1、a[1]=2、a[2]=3。所以 a[1] 是 2。"},{"q":"a = [1, 2, 3]；print(a[-1]) 的输出是？","opts":["A、 1","B、 2","C、 3","D、 报错"],"a":"C","e":"负下标从末尾数：a[-1] 是最后一个元素 3，a[-2] 是 2。"},{"q":"a = [1, 2, 3]；print(a[1:3]) 的输出是？","opts":["A、 [1, 2]","B、 [2, 3]","C、 [1, 2, 3]","D、 [2]"],"a":"B","e":"切片左闭右开：a[1:3] 取下标 1 和 2，得到 [2, 3]。不包含下标 3。"},{"q":"下面哪个不是 Python 的合法变量名？","opts":["A、 my_name","B、 _count","C、 2value","D、 名字"],"a":"C","e":"变量名不能以数字开头。2value 是语法错误。名字（中文）反而是合法的。"},{"q":"print(len(\"hello\")) 的输出是？","opts":["A、 4","B、 5","C、 6","D、 报错"],"a":"B","e":"\"hello\" 有 5 个字符，len() 返回长度 5。空格也算字符。"},{"q":"d = {\"a\": 1}；print(d.get(\"b\", 0)) 的输出是？","opts":["A、 None","B、 0","C、 报错","D、 1"],"a":"B","e":"get(\"b\", 0) 的第二个参数是默认值：键 b 不存在时返回 0，而不是报错。"},{"q":"for i in range(3): print(i, end=\" \") 输出？","opts":["A、 0 1 2","B、 1 2 3","C、 0 1 2 3","D、 1 2"],"a":"A","e":"range(3) 产生 0,1,2。end=\" \" 让每个数字后面跟空格不换行，所以输出 0 1 2。"},{"q":"print(1 == 1.0) 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 1"],"a":"A","e":"1 == 1.0 比较的是【值】不是类型，1 和 1.0 数值相等所以是 True。真要比较类型得用 type() 或 is。"},{"q":"x = 5；x += 3；print(x) 的输出是？","opts":["A、 5","B、 8","C、 53","D、 报错"],"a":"B","e":"x += 3 等价于 x = x + 3，5+3=8。这是复合赋值运算符，还有 -= *= /= //= 等。"},{"q":"下面哪个能创建空列表？","opts":["A、 list()","B、 []","C、 两者都行","D、 两者都不行"],"a":"C","e":"list() 和 [] 都能创建空列表，两种写法等价。[] 更常用，list() 常用来把其他可迭代对象转成列表。"},{"q":"print(bool(\"\")) 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 0"],"a":"B","e":"空字符串是「假值」，bool(\"\") = False。Python 里 0、\"\"、[]、{}、None 都算 False。"},{"q":"print(bool(\"0\")) 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 0"],"a":"A","e":"注意！\"0\" 是非空字符串，是「真值」，bool(\"0\") = True。只有空字符串 \"\" 才是 False。这题最容易错。"},{"q":"def f(): pass；print(f()) 的输出是？","opts":["A、 None","B、 0","C、 报错","D、 什么都不输出"],"a":"A","e":"函数体只有 pass（什么都不做）且没有 return，返回 None。print(f()) 就打 None。"},{"q":"def f(a, b=2): return a + b；print(f(1)) 输出？","opts":["A、 3","B、 1","C、 报错","D、 None"],"a":"A","e":"调用 f(1) 时 b 用默认值 2，1+2=3。这就是默认参数的意义：不传就用默认值。"},{"q":"print(\"abc\" * 2) 的输出是？","opts":["A、 abcabc","B、 abc2","C、 报错","D、 abc abc"],"a":"A","e":"字符串 * 整数 是【重复】：\"abc\" * 2 得到 \"abcabc\"。这是 Python 的语法糖。"},{"q":"s = \"hello\"；print(s.upper()) 的输出是？","opts":["A、 hello","B、 HELLO","C、 Hello","D、 报错"],"a":"B","e":"upper() 把字符串全转大写，\"hello\" → \"HELLO\"。lower() 是小写，title() 是首字母大写。"},{"q":"list1 = [1, 2]；list2 = list1；list2.append(3)；print(list1) 输出？","opts":["A、 [1, 2]","B、 [1, 2, 3]","C、 报错","D、 [3]"],"a":"B","e":"关键！list2 = list1 只是让两个名字指向【同一个列表】，不是复制。改 list2 就是改 list1。真要复制得用 list1.copy() 或 list1[:]。"},{"q":"print(sorted([3, 1, 2])) 的输出是？","opts":["A、 [3, 1, 2]","B、 [1, 2, 3]","C、 None","D、 报错"],"a":"B","e":"sorted() 返回【排序后的新列表】，原列表不变。[3,1,2] 排完是 [1,2,3]。"},{"q":"x = [1, 2, 3]；print(x[::-1]) 的输出是？","opts":["A、 [1, 2, 3]","B、 [3, 2, 1]","C、 [3]","D、 报错"],"a":"B","e":"切片 lst[::-1] 步长 -1，就是从后往前取，等于把列表倒过来。字符串也能这么用。"},{"q":"下面哪个是不可变类型？","opts":["A、 list","B、 dict","C、 tuple","D、 set"],"a":"C","e":"tuple（元组）是不可变类型，创建后不能改。list、dict、set 都是可变的。"},{"q":"print(3 == \"3\") 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 3"],"a":"B","e":"3 是 int，\"3\" 是 str，类型不同值也不相等，所以是 False。Python 不会自动转换类型（和 JS 不同）。"},{"q":"for i in range(1, 5): if i == 3: break；print(i, end=\"\") 输出？","opts":["A、 123","B、 12","C、 1234","D、 4"],"a":"B","e":"range(1,5) 是 1,2,3,4。i 等于 3 时 break 直接跳出整个循环，所以只打印了 1 和 2。"},{"q":"for i in range(1, 5): if i == 3: continue；print(i, end=\"\") 输出？","opts":["A、 123","B、 124","C、 12","D、 1234"],"a":"B","e":"range(1,5) 是 1,2,3,4。i 等于 3 时 continue 跳过 print，继续下一次，所以打印 1、2、4。"},{"q":"open(\"a.txt\", \"w\") 中的 \"w\" 表示？","opts":["A、 只读","B、 写入（清空）","C、 追加","D、 读写"],"a":"B","e":"\"w\" = write（覆盖写，会清空原文件）；\"r\" = read（只读）；\"a\" = append（追加）。"},{"q":"print(len([1, [2, 3], 4])) 的输出是？","opts":["A、 3","B、 4","C、 5","D、 报错"],"a":"A","e":"len([1, [2, 3], 4]) 数的是【顶层】元素个数：1、[2,3]、4 共 3 个。嵌套列表算一个元素。"},{"q":"x = 10；if x > 5: print(\"A\")；else: print(\"B\") 输出？","opts":["A、 A","B、 B","C、 报错","D、 什么都不输出"],"a":"A","e":"10 > 5 为真，执行 if 分支打印 A。else 分支不会执行。"},{"q":"下面哪个会报错？","opts":["A、 int(\"5\")","B、 int(5.9)","C、 int(\"5.9\")","D、 float(\"5\")"],"a":"C","e":"int(\"5.9\") 会报错！int() 只能处理纯整数形式的字符串。想转得先 float(\"5.9\") 再 int()。"},{"q":"print(\"- \".join([\"a\", \"b\", \"c\"])) 的输出是？","opts":["A、 a-b-c","B、 a - b - c","C、 - a - b - c","D、 abc"],"a":"A","e":"\"- \".join([\"a\",\"b\",\"c\"]) 用 \"- \" 把三个元素连起来，得到 a- b- c。注意 join 是【分隔符在前】。"},{"q":"d = {\"x\": 1, \"y\": 2}；print(list(d.keys())) 的输出是？","opts":["A、 dict_keys(['x','y'])","B、 ['x', 'y']","C、 ['x']","D、 报错"],"a":"B","e":"list(d.keys()) 把字典的键转成列表，得到 ['x', 'y']。不转的话是 dict_keys 视图对象。"}],"fill":[{"q":"print 输出时如果想改变分隔符，要写 print(a, b, ____=\"-\")","a":"sep","e":"sep = separator（分隔符）。print(1, 2, sep=\"-\") 输出 1-2。"},{"q":"print 输出完不想换行，要写 print(x, ____=\"\")","a":"end","e":"end 控制输出结束符，默认 \"\\n\"（换行）。改成 end=\"\" 就不换行。"},{"q":"7 除以 2 取整数的运算符是 ____（两个字符）","a":"//","e":"// 是整除运算符，7 // 2 = 3。注意不是 /（真除法得 3.5）。"},{"q":"求余数的运算符是 ____","a":"%","e":"% 是取余运算符，7 % 2 = 1。判断偶数常用 n % 2 == 0。"},{"q":"求乘方的运算符是 ____（两个字符）","a":"**","e":"** 是乘方运算符，2 ** 10 = 1024。注意不是 ^（^ 在 Python 里是异或）。"},{"q":"把字符串转成整数的函数是 ____()","a":"int","e":"int() 把字符串或浮点数转成整数。注意 int(\"3.5\") 会报错，得先 float 转换。"},{"q":"把数字转成字符串的函数是 ____()","a":"str","e":"str() 把任何东西转成字符串，str(123) = \"123\"。拼接字符串时经常要用。"},{"q":"获取列表长度的函数是 ____()","a":"len","e":"len() 返回长度，能用于字符串、列表、字典、元组。"},{"q":"if 语句后面必须写一个 ____（符号）","a":":","e":"if 条件后面必须跟冒号，这是 Python 的语法标识，表示「下面是代码块」。"},{"q":"表示「否则如果」的关键字是 ____","a":"elif","e":"elif = else if，是「否则如果」。它必须跟在 if 后面，不能单独使用。"},{"q":"立即跳出整个循环的关键字是 ____","a":"break","e":"break 立刻跳出【整个】循环，循环后面的代码继续执行。"},{"q":"跳过本次循环剩余部分的关键字是 ____","a":"continue","e":"continue 跳过本次循环剩下的代码，直接进入下一轮。循环本身不会结束。"},{"q":"for i in ____(5): 会循环 5 次","a":"range","e":"range() 生成整数序列。range(5) = 0,1,2,3,4；range(1,6) = 1,2,3,4,5。"},{"q":"列表里添加元素到末尾的方法是 ____()","a":"append","e":"append() 把元素加到列表【末尾】。加多个用 extend()，插到指定位置用 insert()。"},{"q":"字典里安全取值（不报错）的方法是 ____()","a":"get","e":"get() 安全取值：键不存在返回 None 或默认值，不会报 KeyError。"},{"q":"定义函数用的关键字是 ____","a":"def","e":"def = define，定义函数的关键字。def 函数名(参数): 然后缩进写函数体。"},{"q":"函数返回值用的关键字是 ____","a":"return","e":"return 把值交回给调用者，同时立刻结束函数。不写 return 时函数返回 None。"},{"q":"打开文件的函数是 ____()","a":"open","e":"open() 打开文件，返回文件对象。通常配合 with 一起用，自动关闭。"},{"q":"以追加模式打开文件，模式字符串是 ____","a":"a","e":"\"a\" = append 追加模式，在文件末尾接着写，不会清空原内容。"},{"q":"读中文文件时 encoding 参数一般写 ____","a":"utf-8","e":"encoding=\"utf-8\" 是跨平台安全的选择。Windows 默认 GBK，不写容易乱码。"},{"q":"自动关闭文件的语法是 ____ open(...) as f:","a":"with","e":"with open(...) as f: 是上下文管理器，块结束时自动 f.close()，就算报错也会关。"},{"q":"定义类用的关键字是 ____","a":"class","e":"class 定义类，class 类名: 然后缩进写属性和方法。类名习惯用大驼峰。"},{"q":"类的构造函数名是 ____","a":"__init__","e":"__init__ 是构造方法（注意前后各两个下划线），创建对象时自动调用。"},{"q":"类方法里的第一个参数约定叫 ____","a":"self","e":"self 是方法里「当前对象」的引用。调用 obj.method() 时，self 自动等于 obj。"},{"q":"创建对象时调用类名，会自动执行 ____ 方法","a":"__init__","e":"__init__ 在创建对象时自动执行，用来初始化属性。所以 s = Student(\"小明\") 会自动调用 __init__(s, \"小明\")。"}],"read":[{"title":"基础运算","code":"print(3 + 4 * 2 - 1)","a":"10","e":"先算乘除：4*2=8。再从左到右加减：3+8=10，10-1=9？不对，是 3+8=11，11-1=10。"},{"title":"整除与余数","code":"print(17 // 5, 17 % 5)","a":"3 2","e":"17 // 5 = 3（整除），17 % 5 = 2（余数）。print 用空格分隔两个值。"},{"title":"字符串拼接","code":"print(\"Py\" + \"thon\")","a":"Python","e":"两个字符串用 + 连接，\"Py\" + \"thon\" = \"Python\"。"},{"title":"类型转换","code":"print(int(\"12\") + 3)\nprint(str(12) + \"3\")","a":"15\n123","e":"第一行 int(\"12\") 转成数字 12，12+3=15。第二行 str(12) 转成 \"12\"，再拼 \"3\" 得 \"123\"。两行的区别就在这一个转换。"},{"title":"列表索引","code":"a = [10, 20, 30, 40]\nprint(a[0], a[-1], a[1:3])","a":"10 40 [20, 30]","e":"a[0]=10，a[-1]=40（最后一个），a[1:3] 是左闭右开取下标 1、2 得 [20, 30]。"},{"title":"列表追加","code":"a = [1, 2]\na.append([3, 4])\nprint(len(a))\nprint(a)","a":"3\n[1, 2, [3, 4]]","e":"append([3,4]) 是把【整个列表】当成一个元素加进去，所以长度从 2 变 3，结果是 [1, 2, [3, 4]]。想合并得用 extend。"},{"title":"range 求和","code":"s = 0\nfor i in range(1, 6):\n    s += i\nprint(s)","a":"15","e":"range(1,6) 是 1,2,3,4,5。累加：1+2+3+4+5=15。"},{"title":"break 的作用","code":"for i in range(5):\n    if i == 2:\n        break\n    print(i, end=\"\")","a":"01","e":"i=0 打印 0；i=1 打印 1；i=2 时 break 直接跳出，后面的都不执行。所以输出 01。"},{"title":"continue 的作用","code":"for i in range(5):\n    if i % 2 == 0:\n        continue\n    print(i, end=\"\")","a":"13","e":"range(5) 是 0-4。偶数 0、2、4 被 continue 跳过，只打印奇数 1 和 3。"},{"title":"while 循环","code":"n = 3\nwhile n > 0:\n    print(n, end=\" \")\n    n -= 1","a":"3 2 1","e":"n 从 3 开始，每次减 1，直到 n=0 时条件不成立退出。输出 3 2 1（每个后面跟空格）。"},{"title":"字典遍历","code":"d = {\"a\": 1, \"b\": 2}\nfor k in d:\n    print(k, end=\" \")","a":"a b","e":"for k in d 遍历的是字典的【键】。d 的键是 a 和 b，所以输出 a b。想遍历值用 d.values()。"},{"title":"列表推导式","code":"print([x * 2 for x in range(4)])","a":"[0, 2, 4, 6]","e":"列表推导式：[x*2 for x in range(4)] 把 0,1,2,3 各乘 2，得到 [0, 2, 4, 6]。"},{"title":"函数默认参数","code":"def f(a, b=10):\n    return a + b\nprint(f(5))\nprint(f(5, 1))","a":"15\n6","e":"f(5) 只传一个参数，b 用默认值 10，5+10=15。f(5,1) 两个都传，5+1=6。默认参数的价值就在这里。"},{"title":"print vs return","code":"def f():\n    return 5\n    print(99)\nprint(f())","a":"5","e":"return 5 执行后函数立刻结束，print(99) 永远跑不到。所以外面拿到的返回值是 5。"},{"title":"嵌套列表","code":"m = [[1, 2], [3, 4]]\nprint(m[1][0])","a":"3","e":"m[1] 是第二个子列表 [3, 4]，再 [0] 取第一个元素 3。嵌套列表就这样一层层取。"},{"title":"字符串方法","code":"s = \" Hello World \"\nprint(s.strip().lower())","a":"hello world","e":".strip() 去掉首尾空格，.lower() 转小写。\" Hello World \" → \"Hello World\" → \"hello world\"。字符串方法可以链式调用。"},{"title":"sorted 排序","code":"print(sorted([3, 1, 2], reverse=True))","a":"[3, 2, 1]","e":"sorted() 默认是从小到大，reverse=True 改成从大到小。所以 [3,1,2] → [3,2,1]。"},{"title":"字典推导","code":"d = {i: i*i for i in range(1, 4)}\nprint(d)","a":"{1: 1, 2: 4, 3: 9}","e":"字典推导式 {键: 值 for ...}。i 取 1,2,3，值分别是 1,4,9。"},{"title":"全局与局部","code":"x = 1\ndef f():\n    x = 2\nf()\nprint(x)","a":"1","e":"关键！函数里的 x = 2 创建的是【局部变量】，不影响外面的全局 x。所以外面还是 1。想在函数里改全局得用 global x。"},{"title":"类的实例化","code":"class Dog:\n    def __init__(self, name):\n        self.name = name\n    def bark(self):\n        return self.name + \" 叫\"\n\nd = Dog(\"旺财\")\nprint(d.bark())","a":"旺财 叫","e":"d = Dog(\"旺财\") 时 __init__ 设置 self.name = \"旺财\"。调用 bark() 时 self 自动是 d，返回 \"旺财\" + \" 叫\"。"},{"title":"布尔运算","code":"print(True and False, True or False, not True)","a":"False True False","e":"True and False = False，True or False = True，not True = False。print 用空格分隔三个值。"},{"title":"集合去重","code":"print(len(set([1, 2, 2, 3, 3, 3])))","a":"3","e":"set() 自动去重，[1,2,2,3,3,3] 变成 {1,2,3}，长度是 3。"},{"title":"隐式转换陷阱","code":"print(\"3\" * 3)","a":"333","e":"\"3\" 是字符串，字符串 * 3 是【重复】不是乘法！所以得到 \"333\"。"},{"title":"多变量赋值","code":"a, b = 1, 2\na, b = b, a\nprint(a, b)","a":"2 1","e":"a, b = 1, 2 是元组解包。a, b = b, a 先建元组 (2, 1) 再解包，所以 a=2、b=1。Python 交换变量不用临时变量。"}],"code":[{"title":"交换两个变量","level":1,"desc":"给定两个变量 a = 10，b = 20，请交换它们的值，然后打印 a 和 b。\n\n要求输出格式：\n20 10","starter":"a = 10\nb = 20\n# 在这里写你的代码\n\nprint(a, b)","expect_all_at_once":"20 10","ref":"a = 10\nb = 20\n\n# 方法一：Python 特色写法\na, b = b, a\nprint(a, b)\n\n# 方法二：借助临时变量\n# tmp = a\n# a = b\n# b = tmp","tips":["Python 里 a, b = b, a 就完成了交换，不需要临时变量","这是 Python 特有的元组解包，C/Java 都得用中间变量","了解差：a, b = b, a 是先建元组 (b, a) 再解包赋值"]},{"title":"判断奇偶","level":1,"desc":"写一个函数 check(n)，如果 n 是偶数打印「偶数」，否则打印「奇数」。\n\n测试会用 check(4) 和 check(7) 调用。","starter":"def check(n):\n    # 在这里写你的代码\n    pass","tests":[["check(4)","偶数"],["check(7)","奇数"],["check(0)","偶数"]],"ref":"def check(n):\n    if n % 2 == 0:\n        print(\"偶数\")\n    else:\n        print(\"奇数\")","tips":["判断偶数最简单是 n % 2 == 0","也可以写 if n % 2: print(\"奇数\") else: print(\"偶数\")（0 是假，非 0 是真）","更进一步可以用一行：print(\"偶数\" if n % 2 == 0 else \"奇数\")"]},{"title":"求 1 到 100 的和","level":1,"desc":"用循环求 1 + 2 + 3 + ... + 100 的结果并打印。\n\n要求输出：\n5050","starter":"total = 0\n# 在这里写循环\n\nprint(total)","expect_all_at_once":"5050","ref":"total = 0\nfor i in range(1, 101):\n    total += i\nprint(total)\n\n# 数学公式法：\n# print(100 * 101 // 2)","tips":["range(1, 101) 是 1 到 100，注意不是 range(101)","等差数列求和公式：n*(n+1)//2 → 100*101//2 = 5050，O(1) 秒出","Python 内置 sum(range(1, 101)) 一行也行"]},{"title":"列表去重（保持顺序）","level":2,"desc":"写一个函数 dedupe(lst)，去掉列表里重复的元素，并保持原来出现的顺序。\n\n测试用例：\n  dedupe([1, 2, 2, 3, 1]) → [1, 2, 3]\n  dedupe(['a', 'b', 'a']) → ['a', 'b']","starter":"def dedupe(lst):\n    # 在这里写你的代码\n    return lst\n\nprint(dedupe([1, 2, 2, 3, 1]))","tests":[["print(dedupe([1, 2, 2, 3, 1]))","[1, 2, 3]"],["print(dedupe(['a', 'b', 'a']))","['a', 'b']"],["print(dedupe([5]))","[5]"]],"ref":"def dedupe(lst):\n    return list(dict.fromkeys(lst))\n\n# 或者：\n# result = []\n# for x in lst:\n#     if x not in result:\n#         result.append(x)\n# return result","tips":["list(dict.fromkeys(lst)) 是最优雅的写法：字典键唯一且保序（Python 3.7+）","不要用 list(set(lst)) · 集合无序，会把原来的顺序打乱","如果数据量大（10 万条以上），dict.fromkeys 是 O(n)，双重循环是 O(n²)"]},{"title":"统计词频","level":2,"desc":"给定字符串 text，统计每个字符出现的次数，用字典返回。\n\n测试用例：\n  count(\"aab\") → {'a': 2, 'b': 1}","starter":"def count(text):\n    result = {}\n    # 在这里写你的代码\n    return result\n\nprint(count(\"aab\"))","tests":[["print(count(\"aab\"))","{'a': 2, 'b': 1}"],["print(count(\"abc\"))","{'a': 1, 'b': 1, 'c': 1}"]],"ref":"def count(text):\n    result = {}\n    for ch in text:\n        result[ch] = result.get(ch, 0) + 1\n    return result\n\n# 或者用 collections.Counter：\n# from collections import Counter\n# return dict(Counter(text))","tips":["关键在 result.get(ch, 0) + 1 —— get 的第二个参数是默认值，避免 KeyError","标准库 collections.Counter 一行就能统计：Counter(text)","如果要做「按次数排序」，用 sorted(d.items(), key=lambda x: -x[1])"]},{"title":"找最大值（不用 max）","level":2,"desc":"写一个函数 find_max(lst)，返回列表里的最大值。\n不允许使用内置函数 max()。\n\n测试用例：\n  find_max([3, 7, 2]) → 7","starter":"def find_max(lst):\n    # 在这里写你的代码\n    return 0\n\nprint(find_max([3, 7, 2]))","tests":[["print(find_max([3, 7, 2]))","7"],["print(find_max([-5, -1, -9]))","-1"],["print(find_max([42]))","42"]],"ref":"def find_max(lst):\n    m = lst[0]\n    for x in lst:\n        if x > m:\n            m = x\n    return m","tips":["初始值要用 lst[0]，不能写 0 —— 否则全是负数时答案错","这样写是 O(n)，只遍历一遍，是最优的","实际项目直接 max(lst) 就行，这个题是练基本功"]},{"title":"判断素数","level":2,"desc":"写一个函数 is_prime(n)，判断 n 是不是素数（质数），返回 True 或 False。\n\n测试用例：\n  is_prime(7) → True\n  is_prime(8) → False","starter":"def is_prime(n):\n    # 在这里写你的代码\n    return False\n\nprint(is_prime(7))","tests":[["print(is_prime(7))","True"],["print(is_prime(8))","False"],["print(is_prime(2))","True"],["print(is_prime(1))","False"]],"ref":"def is_prime(n):\n    if n < 2:\n        return False\n    for i in range(2, int(n ** 0.5) + 1):\n        if n % i == 0:\n            return False\n    return True","tips":["必须先处理 n < 2 的情况（1、0、负数都不是素数）","循环只需要到 √n，不用到 n · 这是最关键的优化，复杂度从 O(n) 降到 O(√n)","sqrt 用 int(n ** 0.5) 就行，或者 import math 用 math.isqrt(n)"]},{"title":"斐波那契数列","level":3,"desc":"写一个函数 fib(n)，返回第 n 个斐波那契数。\n定义：fib(0)=0, fib(1)=1, fib(n)=fib(n-1)+fib(n-2)\n\n测试用例：\n  fib(0) → 0\n  fib(6) → 8","starter":"def fib(n):\n    # 在这里写你的代码\n    return 0\n\nprint(fib(6))","tests":[["print(fib(0))","0"],["print(fib(1))","1"],["print(fib(6))","8"],["print(fib(10))","55"]],"ref":"def fib(n):\n    if n < 2:\n        return n\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a","tips":["递归写法 fib(n-1) + fib(n-2) 会重复计算，O(2^n) 慢得离谱（n=35 要算好几秒）","迭代写法 O(n)，两个变量滚动就够了，内存 O(1)","如果只是要第 n 项，还可以用矩阵快速幂做到 O(log n)"]},{"title":"九九乘法表","level":2,"desc":"用嵌套循环打印九九乘法表的下三角。\n\n要求输出第一行是 1*1=1，第二行是 1*2=2 2*2=4，以此类推。\n只打印 i >= j 的部分（j 从 1 到 i）。\n\n示例（前两行）：\n1*1=1\n1*2=2 2*2=4","starter":"# 用两层 for 循环\nfor i in range(1, 10):\n    # 在这里写内层循环\n    pass","expect_contains":["1*1=1","2*2=4","3*3=9","9*9=81"],"ref":"for i in range(1, 10):\n    for j in range(1, i + 1):\n        print(f\"{j}*{i}={j*i}\", end=\" \")\n    print()","tips":["内层 range(1, i+1) 是关键 —— 只循环到 i，才能形成三角形","end=\" \" 让同一行不换行，每行结束后单独 print() 换行","f\"{j}*{i}={j*i}\" 是 f-string，比 \"%d*%d=%d\" % (...) 更清楚"]},{"title":"字符串反转","level":1,"desc":"写一个函数 reverse(s)，把字符串倒过来。\n\n测试用例：\n  reverse(\"abc\") → \"cba\"","starter":"def reverse(s):\n    # 在这里写你的代码\n    return s\n\nprint(reverse(\"abc\"))","tests":[["print(reverse(\"abc\"))","cba"],["print(reverse(\"hello\"))","olleh"]],"ref":"def reverse(s):\n    return s[::-1]\n\n# 或者：\n# return \"\".join(reversed(s))","tips":["s[::-1] 是切片步长 -1，一行搞定，Python 最地道的写法","\"\".join(reversed(s)) 也可以，但略啰嗦","不要用 for 循环一个个拼字符串 · 因为字符串不可变，每次都新建，O(n²)"]},{"title":"成绩等级转换","level":2,"desc":"写一个函数 grade(score)，按分数返回等级：\n  90 分以上（含 90）→ \"A\"\n  80-89 → \"B\"\n  70-79 → \"C\"\n  60-69 → \"D\"\n  60 分以下 → \"不及格\"\n\n测试用例：\n  grade(95) → A\n  grade(59) → 不及格","starter":"def grade(score):\n    # 在这里写你的代码\n    return \"\"\n\nprint(grade(95))","tests":[["print(grade(95))","A"],["print(grade(85))","B"],["print(grade(70))","C"],["print(grade(60))","D"],["print(grade(59))","不及格"],["print(grade(90))","A"]],"ref":"def grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    elif score >= 60:\n        return \"D\"\n    else:\n        return \"不及格\"","tips":["if/elif 的顺序很重要：必须从高到低，否则 95 会先命中 60 那个条件","边界值要特别注意：90 应该是 A（用 >= 不是 >）","干净点可以用字典 + 二分，但成绩这种简单的 if/elif 最清楚"]},{"title":"设计一个学生类","level":3,"desc":"设计一个类 Student，要求：\n· 创建时传入 name 和 score\n· 有一个方法 is_pass()，分数 >= 60 返回 True\n· 有一个方法 show()，打印「姓名：xxx，分数：xxx」\n\n测试用例：\n  s = Student(\"小明\", 85)；print(s.is_pass()) → True","starter":"class Student:\n    def __init__(self, name, score):\n        # 在这里写你的代码\n        pass\n\n    def is_pass(self):\n        pass\n\n    def show(self):\n        pass\n\n\ns = Student(\"小明\", 85)\nprint(s.is_pass())\ns.show()","tests":[["s = Student(\"小明\", 85)\nprint(s.is_pass())","True"],["s = Student(\"小红\", 55)\nprint(s.is_pass())","False"],["s = Student(\"小明\", 85)\ns.show()","姓名：小明，分数：85"]],"ref":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def is_pass(self):\n        return self.score >= 60\n\n    def show(self):\n        print(f\"姓名：{self.name}，分数：{self.score}\")","tips":["self.name = name 这一步不能漏 · 否则方法里访问不到","方法里访问属性必须写 self.xxx，不能直接写 name（那是局部变量）","更规范的做法是加 @property 和类型标注（def __init__(self, name: str, score: float)）"]}]};
const NOTES = [{"id":1,"title":"print：让程序开口说话","sub":"第一课 · 输出","blocks":[{"t":"p","c":"程序跑完了，你得知道它算出了什么。print 就是那个「把结果给你看」的工具。学会它，你写的每一行代码都能开口说话。"},{"t":"h","c":"最小例子"},{"t":"code","c":"print(\"你好，Python\")"},{"t":"out","c":"你好，Python"},{"t":"p","c":"就这一行。括号里放什么，屏幕上就显示什么。文字要用引号包起来，单引号双引号都行。"},{"t":"h","c":"一次打印多个东西"},{"t":"code","c":"print(\"年龄：\", 18)\nprint(1, 2, 3)"},{"t":"out","c":"年龄： 18\n1 2 3"},{"t":"note","c":"print 用逗号隔开的多个值，输出时它们之间会自动加一个【空格】。"},{"t":"p","c":"如果你不想要那个空格，可以改 sep 参数："},{"t":"code","c":"print(1, 2, 3, sep=\"-\")\nprint(1, 2, 3, sep=\"\")"},{"t":"out","c":"1-2-3\n123"},{"t":"h","c":"不想换行怎么办"},{"t":"p","c":"print 每次结束都会自动换行。想连着打印，就用 end 参数："},{"t":"code","c":"print(\"a\", end=\"\")\nprint(\"b\", end=\"\")\nprint(\"c\")"},{"t":"out","c":"abc"},{"t":"warn","c":"常见错误：print(\"你好\") 写成 print(你好) 会报错 NameError —— 因为 Python 会以为 你好 是个变量名，而不是文字。文字必须加引号。"}]},{"id":2,"title":"变量：给数据起个名字","sub":"第二课 · 变量与类型","blocks":[{"t":"p","c":"写程序时你需要把数据存起来，方便后面用。变量就是一个「贴着名字的盒子」，你把值放进去，以后叫名字就能取出来。"},{"t":"h","c":"最小例子"},{"t":"code","c":"name = \"小明\"\nage = 18\nprint(name, age)"},{"t":"out","c":"小明 18"},{"t":"p","c":"等号 = 不是「等于」，而是「把右边的值装进左边的名字里」。这叫赋值。"},{"t":"h","c":"变量可以改"},{"t":"code","c":"x = 10\nprint(x)\nx = 20\nprint(x)\nx = x + 5\nprint(x)"},{"t":"out","c":"10\n20\n25"},{"t":"note","c":"x = x + 5 的意思是：先算右边的 x+5（此时是 25），再把结果装回 x。所以 x 变成了 25。"},{"t":"h","c":"四种基本类型"},{"t":"code","c":"print(type(18))        # 整数 int\nprint(type(3.14))      # 小数 float\nprint(type(\"你好\"))    # 文字 str\nprint(type(True))      # 布尔 bool"},{"t":"out","c":"<class 'int'>\n<class 'float'>\n<class 'str'>\n<class 'bool'>"},{"t":"p","c":"类型决定了这个数据能干什么。数字能加减，文字能拼接，True/False 用来做判断。"},{"t":"h","c":"起名字的规矩"},{"t":"code","c":"my_name = \"李\"      # ✅ 可以：字母、下划线开头\n_age2 = 18          # ✅ 可以：中间可以有数字\n2name = \"x\"         # ❌ 报错：不能数字开头\nmy-name = \"x\"       # ❌ 报错：不能有横线"},{"t":"warn","c":"变量名区分大小写！Name 和 name 是两个不同的变量。这是新手最常踩的坑。"}]},{"id":3,"title":"运算：让程序算起来","sub":"第三课 · 运算符","blocks":[{"t":"p","c":"Python 能当计算器用，而且比计算器多几个好用的运算符。"},{"t":"h","c":"五个基本运算符"},{"t":"code","c":"print(7 + 3)    # 加 → 10\nprint(7 - 3)    # 减 → 4\nprint(7 * 3)    # 乘 → 21\nprint(7 / 3)    # 除 → 2.3333333333333335\nprint(7 // 3)   # 整除 → 2   ⭐\nprint(7 % 3)    # 取余 → 1   ⭐\nprint(7 ** 3)   # 乘方 → 343 ⭐"},{"t":"note","c":"三个特殊的：// 整除（只留整数部分）、% 取余（剩下多少）、** 乘方（几次方）。考试必考。"},{"t":"h","c":"为什么 7/3 不是 2"},{"t":"p","c":"Python 3 的 / 永远是「真除法」，结果带小数。想只要整数部分就用 //。"},{"t":"code","c":"print(7 / 3)     # 2.3333333333333335\nprint(7 // 3)    # 2"},{"t":"h","c":"取余的妙用：判断奇偶"},{"t":"code","c":"n = 7\nprint(n % 2)     # 1 → 奇数\n\nn = 8\nprint(n % 2)     # 0 → 偶数"},{"t":"p","c":"任何数 % 2，结果是 0 就是偶数，是 1 就是奇数。这个技巧后面写判断时天天用。"},{"t":"h","c":"运算优先级"},{"t":"code","c":"print(3 + 4 * 2)      # 11 ← 先乘后加\nprint((3 + 4) * 2)    # 14 ← 括号优先\nprint(2 ** 3 ** 2)    # 512 ← 乘方是【右结合】"},{"t":"warn","c":"2 ** 3 ** 2 等于 512，不是 64！因为乘方从右往左算：先 3**2=9，再 2**9=512。不确定就加括号。"}]},{"id":4,"title":"input 输入：让程序听懂你","sub":"第四课 · 输入与类型转换","blocks":[{"t":"p","c":"前面都是你写死的数据。input 能让程序停下来等你输入，这样程序就「活」了。"},{"t":"h","c":"最小例子"},{"t":"code","c":"name = input(\"你叫什么名字？\")\nprint(\"你好，\" + name)"},{"t":"out","c":"你叫什么名字？小明\n你好，小明"},{"t":"p","c":"括号里的文字是提示语。程序会显示它，然后等你按回车。"},{"t":"h","c":"⭐ 最关键的一点"},{"t":"note","c":"input() 拿到的永远是【字符串】！就算你输入的是 18，它也是文字 \"18\"，不是数字 18。"},{"t":"code","c":"age = input(\"你几岁？\")\nprint(type(age))        # <class 'str'>"},{"t":"h","c":"所以要用 int() 转换"},{"t":"code","c":"age = int(input(\"你几岁？\"))\nprint(age + 1)          # 正常算数"},{"t":"p","c":"经典套娃写法：int(input(提示语))，先读到文字，再转成整数。"},{"t":"h","c":"三个转换函数"},{"t":"code","c":"print(int(\"18\"))       # 18     字符串→整数\nprint(float(\"3.14\"))   # 3.14   字符串→小数\nprint(str(18))         # \"18\"   数字→字符串\nprint(int(3.9))        # 3      小数→整数（直接砍掉小数，不四舍五入）"},{"t":"warn","c":"int(\"3.5\") 会报错！带小点的字符串不能直接转 int，得先 float(\"3.5\") 再 int()。"},{"t":"h","c":"字符串和数字不能混着算"},{"t":"code","c":"print(\"5\" + \"3\")        # 53  ← 拼接！不是 8\nprint(int(\"5\") + 3)    # 8   ← 先转换再算\nprint(\"5\" + 3)         # ❌ TypeError"}]},{"id":5,"title":"if 判断：让程序会做选择","sub":"第五课 · 条件判断","blocks":[{"t":"p","c":"程序要会「看情况办事」。分数线到了就及格，没到就不及格 —— 这就是 if。"},{"t":"h","c":"最小例子"},{"t":"code","c":"score = 85\nif score >= 60:\n    print(\"及格了\")"},{"t":"out","c":"及格了"},{"t":"note","c":"注意两件事：① if 后面必须有【冒号】 ② 下面一行必须缩进（4 个空格）"},{"t":"h","c":"if / else：二选一"},{"t":"code","c":"score = 45\nif score >= 60:\n    print(\"及格\")\nelse:\n    print(\"不及格\")"},{"t":"out","c":"不及格"},{"t":"h","c":"if / elif / else：多选一"},{"t":"code","c":"score = 85\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelif score >= 70:\n    print(\"C\")\nelse:\n    print(\"不及格\")"},{"t":"out","c":"B"},{"t":"warn","c":"elif 的顺序必须【从高到低】！如果先写 score >= 60，那 85 分也会命中这一条，后面的都轮不到。"},{"t":"h","c":"缩进就是代码块的边界"},{"t":"code","c":"x = 10\nif x > 5:\n    print(\"大\")\n    print(\"真的很大\")\nprint(\"这句一定会打印\")"},{"t":"out","c":"大\n真的很大\n这句一定会打印"},{"t":"p","c":"缩进 4 个空格的属于 if 的块，不缩进的属于外面。Python 靠缩进区分层次，不用大括号。"},{"t":"warn","c":"同一个块里缩进量必须一致。混用 Tab 和空格会报 TabError。"}]},{"id":6,"title":"while 循环：条件真就一直做","sub":"第六课 · 循环（一）","blocks":[{"t":"p","c":"想让程序重复做同一件事，就用循环。while 的意思是「只要条件成立，就一直做」。"},{"t":"h","c":"最小例子"},{"t":"code","c":"n = 1\nwhile n <= 3:\n    print(n)\n    n = n + 1"},{"t":"out","c":"1\n2\n3"},{"t":"p","c":"拆开看这个过程：n=1 时打印 1、n 变 2；n=2 时打印 2、n 变 3；n=3 时打印 3、n 变 4；n=4 时条件 4<=3 不成立，循环结束。"},{"t":"warn","c":"⭐ 死循环警告：忘记写 n = n + 1，n 永远是 1，条件永远成立，程序会一直跑下去，只能 Ctrl+C 强制停止。"},{"t":"h","c":"while True + break 的常见写法"},{"t":"code","c":"while True:\n    cmd = input(\"输入 exit 退出：\")\n    if cmd == \"exit\":\n        break\n    print(\"你输入了：\" + cmd)"},{"t":"p","c":"这是最常用的交互式写法：永远循环，靠 break 在内部跳出。菜单、游戏主循环都这么写。"},{"t":"h","c":"break 和 continue 的区别"},{"t":"code","c":"# break：直接跳出整个循环\nfor i in range(5):\n    if i == 2:\n        break\n    print(i, end=\" \")\n# 输出：0 1\n\n# continue：跳过这一次，继续下一次\nfor i in range(5):\n    if i == 2:\n        continue\n    print(i, end=\" \")\n# 输出：0 1 3 4"},{"t":"note","c":"记忆口诀：break = 跳出整个循环（不干了）；continue = 跳过本次（这次算了，下次继续）。"}]},{"id":7,"title":"for + range：按次数重复","sub":"第七课 · 循环（二）","blocks":[{"t":"p","c":"while 是「不知道要循环几次，看条件」。for 是「知道要循环几次」。Python 里 for 更常用，因为它不会写出死循环。"},{"t":"h","c":"最小例子"},{"t":"code","c":"for i in range(3):\n    print(i)"},{"t":"out","c":"0\n1\n2"},{"t":"p","c":"range(3) 会依次产生 0、1、2。每一轮 i 拿到一个值，循环体就执行一次。"},{"t":"note","c":"⭐ range(3) 产生 0,1,2 —— 不含 3！这叫「左闭右开」，是最容易搞错的地方。"},{"t":"h","c":"range 的三种写法"},{"t":"code","c":"range(5)          # 0,1,2,3,4\nrange(1, 6)       # 1,2,3,4,5\nrange(1, 10, 2)   # 1,3,5,7,9   ← 步长 2\nrange(10, 0, -1)  # 10,9,...,1  ← 倒着数"},{"t":"h","c":"累加器的经典套路"},{"t":"code","c":"total = 0\nfor i in range(1, 101):\n    total = total + i\nprint(total)"},{"t":"out","c":"5050"},{"t":"p","c":"这是最重要的循环模式：先设一个初始值，循环里不断累加。求和、计数、找最大值都是这个套路。"},{"t":"h","c":"遍历列表"},{"t":"code","c":"fruits = [\"苹果\", \"香蕉\", \"橙子\"]\nfor f in fruits:\n    print(\"我喜欢吃\" + f)"},{"t":"out","c":"我喜欢吃苹果\n我喜欢吃香蕉\n我喜欢吃橙子"},{"t":"warn","c":"for 后面同样必须有冒号 + 缩进。而且循环体至少得有一行，不然报 IndentationError。"}]},{"id":8,"title":"列表 list：一次存很多数据","sub":"第八课 · 容器（一）","blocks":[{"t":"p","c":"如果要存 100 个学生的成绩，用 100 个变量会疯掉。列表就是「一排格子」，一个名字管一堆数据。"},{"t":"h","c":"创建和访问"},{"t":"code","c":"scores = [85, 92, 78]\nprint(scores[0])     # 85  ← 第一格\nprint(scores[1])     # 92\nprint(scores[-1])    # 78  ← 最后一个\nprint(len(scores))   # 3   ← 有几个"},{"t":"note","c":"⭐ 下标从 0 开始！第一个是 [0]，不是 [1]。负数从后往前数，[-1] 是最后一个。"},{"t":"h","c":"增删改"},{"t":"code","c":"a = [1, 2, 3]\n\na.append(4)      # 加到末尾  → [1,2,3,4]\na.insert(0, 0)   # 插到开头  → [0,1,2,3,4]\na.remove(2)      # 删除 2    → [0,1,3,4]\na[0] = 99        # 改第一格  → [99,1,3,4]\nprint(a)"},{"t":"h","c":"切片：一次取一片"},{"t":"code","c":"a = [10, 20, 30, 40, 50]\nprint(a[1:3])    # [20, 30]      ← 下标 1、2（不含 3）\nprint(a[:2])     # [10, 20]      ← 从头取\nprint(a[2:])     # [30, 40, 50]  ← 取到尾\nprint(a[::-1])   # [50,40,30,20,10] ← 倒过来"},{"t":"note","c":"切片也是「左闭右开」。a[1:3] 包含下标 1 和 2，不含 3。"},{"t":"h","c":"常用方法速查"},{"t":"code","c":"a = [3, 1, 2]\nprint(len(a))        # 3      长度\nprint(sum(a))        # 6      求和\nprint(max(a))        # 3      最大值\nprint(sorted(a))     # [1,2,3] 排序（返回新列表）\nprint(a)             # [3,1,2] 原列表没变\n\na.sort()             # 直接改原列表\nprint(a)             # [1,2,3]"},{"t":"warn","c":"sorted(a) 返回新列表、原列表不动；a.sort() 直接改原列表、返回 None。搞混了会写错。"}]},{"id":9,"title":"字典 dict：用名字取数据","sub":"第九课 · 容器（二）","blocks":[{"t":"p","c":"列表用编号取数据（第 0 个）。但有时你想用名字取 —— 比如用一个学生名字查他的成绩。这就是字典。"},{"t":"h","c":"创建和取值"},{"t":"code","c":"scores = {\"小明\": 85, \"小红\": 92}\nprint(scores[\"小明\"])    # 85"},{"t":"p","c":"字典是「键 → 值」的配对。\"小明\" 是键，85 是值。用方括号加键名来取值。"},{"t":"h","c":"⭐ 安全取值：get"},{"t":"code","c":"scores = {\"小明\": 85}\n\nprint(scores[\"小红\"])        # ❌ KeyError 报错！\nprint(scores.get(\"小红\"))    # None   ← 不报错\nprint(scores.get(\"小红\", 0)) # 0      ← 给个默认值"},{"t":"note","c":"不确定键在不在，就用 get()。它不会报错，找不到就返回 None 或你指定的默认值。"},{"t":"h","c":"增删改"},{"t":"code","c":"d = {\"a\": 1}\n\nd[\"b\"] = 2        # 新增  → {'a':1,'b':2}\nd[\"a\"] = 99       # 修改  → {'a':99,'b':2}\ndel d[\"a\"]        # 删除  → {'b':2}\nprint(d)"},{"t":"h","c":"遍历字典"},{"t":"code","c":"d = {\"a\": 1, \"b\": 2}\n\nfor k in d:                    # 遍历键\n    print(k)\n\nfor k, v in d.items():         # 同时拿键和值\n    print(k, v)\n\nfor v in d.values():           # 只遍历值\n    print(v)"},{"t":"out","c":"a\nb\na 1\nb 2\n1\n2"},{"t":"h","c":"词频统计：字典的经典用法"},{"t":"code","c":"text = \"aab\"\ncount = {}\nfor ch in text:\n    count[ch] = count.get(ch, 0) + 1\nprint(count)"},{"t":"out","c":"{'a': 2, 'b': 1}"},{"t":"tip","c":"count.get(ch, 0) + 1 是关键：键不存在时默认拿 0，加 1 后变成 1；存在时拿原来的值再加 1。"},{"t":"warn","c":"字典的键必须是不可变类型（字符串、数字、元组）。用列表当键会报 TypeError: unhashable type。"}]},{"id":10,"title":"函数 def：把代码打包","sub":"第十课 · 函数","blocks":[{"t":"p","c":"如果你把「算平均分」的代码写了 5 遍，改一次就要改 5 个地方。函数就是把这堆代码打包成一个名字，以后叫名字就行。"},{"t":"h","c":"最小例子"},{"t":"code","c":"def say_hi():\n    print(\"你好\")\n\nsay_hi()\nsay_hi()"},{"t":"out","c":"你好\n你好"},{"t":"p","c":"def 是 define（定义）。定义只是告诉 Python「有这么个东西」，不执行。要调用才执行，写 say_hi()。"},{"t":"h","c":"带参数的函数"},{"t":"code","c":"def greet(name):\n    print(\"你好，\" + name)\n\ngreet(\"小明\")\ngreet(\"小红\")"},{"t":"out","c":"你好，小明\n你好，小红"},{"t":"p","c":"参数让同一个函数每次做的事可以不一样。这就是函数的价值：一份逻辑，适应很多情况。"},{"t":"h","c":"默认参数"},{"t":"code","c":"def greet(name, word=\"你好\"):\n    print(word + \"，\" + name)\n\ngreet(\"小明\")            # 你好，小明\ngreet(\"小明\", \"早上好\")  # 早上好，小明"},{"t":"note","c":"有默认值的参数必须放在【最后】。def f(a=1, b) 是语法错误。"},{"t":"h","c":"多个参数"},{"t":"code","c":"def add(a, b):\n    print(a + b)\n\nadd(3, 5)"},{"t":"out","c":"8"},{"t":"warn","c":"函数必须先定义再调用。写在调用后面会报 NameError。Python 从上往下执行。"}]},{"id":11,"title":"return 和 print 的区别 ⭐","sub":"第十一课 · 返回值","blocks":[{"t":"p","c":"这是初学者最容易搞混的一对，也是考试的重点。先记住一句话：print 给人看，return 给程序用。"},{"t":"h","c":"看这个对比"},{"t":"code","c":"# 版本 A：用 print\ndef add_a(a, b):\n    print(a + b)\n\nresult = add_a(3, 5)\nprint(\"返回值是：\", result)"},{"t":"out","c":"8\n返回值是： None"},{"t":"code","c":"# 版本 B：用 return\ndef add_b(a, b):\n    return a + b\n\nresult = add_b(3, 5)\nprint(\"返回值是：\", result)"},{"t":"out","c":"返回值是： 8"},{"t":"note","c":"版本 A 只是把 8 显示出来，函数本身返回 None。版本 B 把 8 交回给了调用者，所以 result 能拿到 8。"},{"t":"h","c":"为什么这很重要"},{"t":"code","c":"def double_a(x):\n    print(x * 2)\n\ndef double_b(x):\n    return x * 2\n\n# 想把结果再加 1\nprint(double_a(5) + 1)   # ❌ TypeError: NoneType + int\nprint(double_b(5) + 1)   # ✅ 11"},{"t":"p","c":"print 出来的值不能被继续使用，return 出来的可以。所以想让函数的结果参与后续计算，必须用 return。"},{"t":"h","c":"return 会立刻结束函数"},{"t":"code","c":"def f():\n    return 5\n    print(\"这行永远不会执行\")\n\nprint(f())"},{"t":"out","c":"5"},{"t":"warn","c":"函数里没写 return 时，Python 自动返回 None。所以忘记 return 是新手最常见的 bug。"},{"t":"h","c":"一个函数可以有多个 return"},{"t":"code","c":"def check(n):\n    if n > 0:\n        return \"正数\"\n    elif n < 0:\n        return \"负数\"\n    return \"零\""},{"t":"p","c":"每次执行到 return 就结束了，所以只会走到其中一个分支。这种写法比用变量存结果再返回更清晰。"}]},{"id":12,"title":"文件读写：让数据活过重启","sub":"第十二课 · 文件","blocks":[{"t":"p","c":"程序一关，变量里的数据全没了。想让数据留下来，就得写进文件。"},{"t":"h","c":"写文件"},{"t":"code","c":"with open(\"test.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"第一行\\n\")\n    f.write(\"第二行\")"},{"t":"p","c":"运行完，同目录下就多了一个 test.txt，里面是两行文字。"},{"t":"h","c":"读文件"},{"t":"code","c":"with open(\"test.txt\", \"r\", encoding=\"utf-8\") as f:\n    content = f.read()\n    print(content)"},{"t":"out","c":"第一行\n第二行"},{"t":"h","c":"逐行读（大文件必须这样）"},{"t":"code","c":"with open(\"test.txt\", \"r\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(line.strip())"},{"t":"tip","c":"strip() 去掉行尾的换行符。不加的话每行都会多一个空行（因为 print 自己也会换行）。"},{"t":"h","c":"三个模式"},{"t":"code","c":"\"r\"  # 只读，文件不存在会报错\n\"w\"  # 写入，会先清空原内容！\n\"a\"  # 追加，在末尾接着写"},{"t":"warn","c":"⭐ \"w\" 会清空原文件！想保留原内容往后加，一定用 \"a\"。这个坑很多人踩过。"},{"t":"h","c":"encoding 必须写"},{"t":"code","c":"with open(\"a.txt\", \"r\", encoding=\"utf-8\") as f:\n    print(f.read())"},{"t":"p","c":"Windows 中文系统默认编码是 GBK。不写 encoding=\"utf-8\"，读写中文会乱码或报 UnicodeDecodeError。"},{"t":"h","c":"为什么用 with"},{"t":"code","c":"# 不推荐\nf = open(\"a.txt\", \"r\", encoding=\"utf-8\")\ndata = f.read()\nf.close()        # 忘记这行文件就一直被占用\n\n# 推荐\nwith open(\"a.txt\", \"r\", encoding=\"utf-8\") as f:\n    data = f.read()\n# 出了 with 块自动关闭，就算中间报错也会关"},{"t":"note","c":"with 叫「上下文管理器」，它保证文件一定会被关闭。养成习惯：永远用 with，不要手动 close。"}]},{"id":13,"title":"类 class：把数据和动作打包","sub":"第十三课 · 面向对象","blocks":[{"t":"p","c":"前 12 课的代码都是「一条条指令」。类是另一种想法：把「东西」和「这个东西能做什么」打包在一起。"},{"t":"p","c":"比如一个学生，有姓名和分数（数据），有「是否及格」「自我介绍」（动作）。用类来描述最自然。"},{"t":"h","c":"最小例子"},{"t":"code","c":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def show(self):\n        print(self.name, self.score)\n\ns = Student(\"小明\", 85)\ns.show()"},{"t":"out","c":"小明 85"},{"t":"p","c":"拆开看：class Student 定义了一个「模板」。s = Student(...) 按模板造出一个具体的学生。s.show() 让他自我介绍。"},{"t":"h","c":"__init__ 是什么"},{"t":"code","c":"class Dog:\n    def __init__(self, name):\n        print(\"我被创建了！\")\n        self.name = name\n\nd = Dog(\"旺财\")    # 这行会自动打印「我被创建了！」"},{"t":"out","c":"我被创建了！"},{"t":"note","c":"__init__ 叫「构造方法」，创建对象时自动调用，用来初始化属性。不用你手动调。"},{"t":"h","c":"self 到底是什么"},{"t":"code","c":"class Counter:\n    def __init__(self):\n        self.n = 0\n\n    def add(self):\n        self.n = self.n + 1\n\nc = Counter()\nc.add()\nc.add()\nc.add()\nprint(c.n)"},{"t":"out","c":"3"},{"t":"p","c":"self 就是「当前这个对象自己」。c.add() 执行时，self 自动等于 c。所以 self.n 就是 c.n，改了三次变成 3。"},{"t":"note","c":"方法定义时第一个参数必须是 self。名字可以换，但强烈建议就叫 self。"},{"t":"h","c":"多个对象互不影响"},{"t":"code","c":"class Student:\n    def __init__(self, name):\n        self.name = name\n\na = Student(\"小明\")\nb = Student(\"小红\")\nprint(a.name, b.name)"},{"t":"out","c":"小明 小红"},{"t":"p","c":"一个类可以造出无数个对象，每个对象的属性独立。这就是类和「一个变量」的区别。"},{"t":"warn","c":"方法里访问属性必须写 self.name，不能直接写 name（那是个不存在的局部变量）。加 self 是最常忘的一步。"}]}];

function renderBlock(b){
  const c = b.c;
  switch (b.t) {
    case 'h':    return `<div class="nb-h">${esc(c)}</div>`;
    case 'code': return `<pre class="nb-code">${hlPy(c)}</pre>`;
    case 'out':  return `<div class="nb-out"><b>运行结果</b><pre>${esc(c)}</pre></div>`;
    case 'tip':  return `<div class="nb-tip">💡 ${esc(c)}</div>`;
    case 'warn': return `<div class="nb-warn">⚠️ ${esc(c)}</div>`;
    case 'note': return `<div class="nb-note">⭐ ${esc(c)}</div>`;
    default:     return `<p class="nb-p">${esc(c)}</p>`;
  }
}

function openNoteDetail(id){
  const n = NOTES.find(x => x.id === id);
  if (!n) return;
  titleEl.textContent = '📖 ' + n.title.split('：')[0];
  backBtn.style.display = 'block';
  progWrap.style.display = 'none';

  let h = `<div class="notehead">
             <div class="no">第 ${n.id} 课 / 共 13 课　·　${esc(n.sub)}</div>
             <h2>${esc(n.title)}</h2>
           </div>`;

  h += `<div class="notefoot">

        </div>`;

          <button class="back" onclick="openNote()">返回目录</button>
        </div>`;
  app.innerHTML = h;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openQuiz(){
  titleEl.textContent = '✏️ 刷题区';
  backBtn.style.display = 'block';
  const total = DATA.judge.length + DATA.choice.length + DATA.fill.length + DATA.read.length + DATA.code.length;
  const wrongN = Object.keys(store.wrong).length;
  const codeDone = Object.keys(store.codeDone || {}).length;
  let h = '<div class="menu">';

    h += `<div class="item" onclick="start('${k}')"><span class="n">${DATA[k].length} 题</span><h3>${TYPES[k].name}</h3><p>${TYPES[k].desc}</p></div>`;
  }
  h += `<div class="item code" onclick="start('code')"><span class="n">${DATA.code.length} 题 ${codeDone ? '· 已过 ' + codeDone : ''}</span><h3>💻 代码实操</h3><p>${TYPES.code.desc}</p></div>`;

    h += `<div class="item special" onclick="start('wrong')"><span class="n">${wrongN} 题</span><h3>⭐ 错题重练</h3><p>只刷之前做错的</p></div>`;
  }
  const passedN = Object.keys(store.levelDone || {}).length;
  h += `<div class="item code" onclick="openLevels()"><span class="n">已过 ${passedN}/8 关</span><h3>🚩 闯关模式</h3><p>知识连贯 ✦ 难度递增 ✦ 通过才解锁下一关</p></div>`;
  h += '</div>';
  app.innerHTML = h;
  progWrap.style.display = 'none';
}

function openLevels(){
  titleEl.textContent = '🚩 闯关模式';
  backBtn.style.display = 'block';
  progWrap.style.display = 'none';

  let h = '';
  const done = store.levelDone || {};
  let passedCount = 0;
  LEVELS.forEach(lv => {
    const passed = !!done[lv.id];
    // 解锁条件：第 1 关永远开；其他关需要上一关通过
    const unlocked = (lv.id === 1) || !!done[lv.id - 1];
    if (passed) passedCount++;
    const n = lv.judge.length + lv.choice.length + lv.fill.length + lv.read.length;
    const cls = passed ? 'levelitem passed' : (unlocked ? 'levelitem' : 'levelitem locked');
    const click = unlocked ? `onclick="startLevel(${lv.id})"` : '';
    h += `<div class="${cls}" ${click}>
            <span class="lnum">${passed ? '✓' : (unlocked ? lv.id : '🔒')}</span>
            <span class="lt">
              <b>${esc(lv.name)}</b>
              <small>${esc(lv.topic)}　·　${n} 题　·　通过线 ${lv.pass}%</small>
            </span>
            <span class="lstate ${passed ? 'ok' : 'lock'}">${passed ? '已通关' : (unlocked ? '未挑战' : '未解锁')}</span>
          </div>`;
  });

  const top = `<div class="qcard" style="padding:16px 17px;text-align:center">
                 <div style="font-size:15px;color:var(--navy);font-weight:600;margin-bottom:6px">
                   已通关 ${passedCount} / ${LEVELS.length} 关
                 </div>
                 <div style="font-size:12.5px;color:var(--dim)">
                   每关 ${LEVELS[0].pass}% 以上算通过 ✦ 通过才解锁下一关
                 </div>
               </div>`;
  app.innerHTML = top + h;
}

function startLevel(id){
  const L = LEVELS.find(x => x.id === id);
  if (!L) return;
  const list = [];
  L.judge.forEach(i => { if (DATA.judge[i]) list.push({...DATA.judge[i], type:'judge', oi:i}); });
  L.choice.forEach(i => { if (DATA.choice[i]) list.push({...DATA.choice[i], type:'choice', oi:i}); });
  L.fill.forEach(i => { if (DATA.fill[i]) list.push({...DATA.fill[i], type:'fill', oi:i}); });
  L.read.forEach(i => { if (DATA.read[i]) list.push({...DATA.read[i], type:'read', oi:i}); });
  if (!list.length){ alert('这一关没有题目'); return; }
  session = { list: shuffle(list), idx: 0, right: 0, mode: 'level', level: L };
  backBtn.style.display = 'block';
  progWrap.style.display = 'block';
  titleEl.textContent = '第 ' + L.id + ' 关 · ' + L.name;
  renderQ();
}

function openTalk(){
  titleEl.textContent = '💬 讨论区';
  backBtn.style.display = 'block';
  progWrap.style.display = 'none';
  app.innerHTML = `<div class="qcard"><div class="soon">
    <span class="ic">💬</span>

    <span style="font-size:12px;color:#96a6c9">需要先在仓库里开启 Discussions</span>

}

function resetAll(){
  if (!confirm('确定清空全部刷题记录？')) return;
  store = { wrong:{}, stats:{right:0,wrong:0}, codeDone:{} };
  save(); renderHome();
}

function start(mode){
  let list = [];
  if (mode === 'all'){
    list = shuffle([
      ...DATA.judge.map((x,i)=>({...x,type:'judge',oi:i})),
      ...DATA.choice.map((x,i)=>({...x,type:'choice',oi:i})),
      ...DATA.fill.map((x,i)=>({...x,type:'fill',oi:i})),
      ...DATA.read.map((x,i)=>({...x,type:'read',oi:i})),
    ]);
  } else if (mode === 'wrong'){
    for (const k of ['judge','choice','fill','read']){
      DATA[k].forEach((x,i)=>{ if (store.wrong[k+':'+i]) list.push({...x,type:k,oi:i}); });
    }
    list = shuffle(list);
  } else if (mode === 'code'){
    list = shuffle(DATA.code.map((x,i)=>({...x,type:'code',oi:i})));
  } else {
    list = shuffle(DATA[mode].map((x,i)=>({...x,type:mode,oi:i})));
  }
  if (!list.length){ alert('这个类别没有题目'); return; }
  session = { list, idx:0, right:0, mode };
  backBtn.style.display = 'block';
  progWrap.style.display = mode === 'code' ? 'none' : 'block';
  titleEl.textContent = mode === 'all' ? '全部混合' : (mode === 'wrong' ? '错题重练' : TYPES[mode].name);
  renderQ();
}

function updateProg(){
  const s = session;
  if (!s.list.length) return;
  progi.style.width = (s.idx / s.list.length * 100) + '%';
  progt.textContent = `${s.idx} / ${s.list.length}　对 ${s.right}`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hlPy(code){
  let s = esc(code);
  s = s.replace(/\b(def|return|if|elif|else|for|while|import|from|class|try|except|with|as|in|not|and|or|break|continue|pass|lambda|None|True|False)\b/g,'<span class="kw">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g,'<span class="st">$1</span>');
  return s;
}

function renderQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderResult();
  updateProg();
  const q = s.list[s.idx];
  const t = TYPES[q.type];
  let h = `<div class="qcard"><div class="qtype">${t.name}　第 ${s.idx+1} / ${s.list.length} 题</div>`;

  if (q.type === 'read'){
    h += `<div class="qtext">这段代码输出什么？</div>`;
    h += `<div class="codeblock">${hlPy(q.code)}</div>`;
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerRead();return false;">
            <input id="fillInput" placeholder="输入输出结果 ✦ 多行用分号或回车分开" autocomplete="off" enterkeyhint="done" required>
            <div class="btns"><button type="submit">提交</button><button type="button" onclick="showReadAnswer()">看答案</button></div>
          </form>`;
  } else if (q.type === 'judge'){
    h += `<div class="qtext">${esc(q.q)}</div>`;
    h += `<div class="tf"><button onclick="answerTF('对')" id="btnT">✓ 对</button><button onclick="answerTF('错')" id="btnF">， 错</button></div>`;
  } else if (q.type === 'choice'){
    h += `<div class="qtext">${esc(q.q)}</div><div class="opts">`;
    q.opts.forEach((o,i)=>{ h += `<div class="opt" onclick="answerChoice(${i})">${esc(o)}</div>`; });
    h += `</div><div class="actions"><button class="btn-next" id="submitChoice" onclick="submitChoice()" disabled>提交</button></div>`;
    s.choiceSel = new Set();
  } else if (q.type === 'fill'){
    h += `<div class="qtext">${esc(q.q)}</div>`;
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerFill();return false;">
            <input id="fillInput" placeholder="输入答案" autocomplete="off" enterkeyhint="done" required>
            <div class="btns"><button type="submit">提交</button><button type="button" onclick="showFillAnswer()">看答案</button></div>
          </form>`;
  }

  h += `<div class="ansbox" id="ansbox"></div>`;
  h += `<div class="feedback" id="fb" style="display:none"></div>`;
  h += `<div class="actions" id="nextWrap" style="display:none"><button class="btn-next" onclick="nextQ()">下一题 →</button></div>`;
  h += '</div>';
  app.innerHTML = h;

  const inp = document.getElementById('fillInput');
  if (inp) inp.focus();
}

function norm(s){
  return String(s).toLowerCase().replace(/[\s，,。．.、；;：:（）()【】\[\]"'"'']/g,'').trim();
}

function showAnswer(ans, ok, mono, explain){
  const box = document.getElementById('ansbox');
  let html = '<b>正确答案</b><br>' + (mono ? `<span class="mono">${esc(ans)}</span>` : esc(ans));
  if (explain) {
    html += '<div class="explain"><b>💡 解析</b><br>' + esc(explain).replace(/\n/g, '<br>') + '</div>';
  }
  box.innerHTML = html;
  box.classList.add('show');
  const fb = document.getElementById('fb');
  fb.style.display = 'block';
  if (ok === true){ fb.className='feedback good'; fb.textContent='✅ 答对了'; }
  else if (ok === false){ fb.className='feedback bad'; fb.textContent='❌ 答错了，看上面的正确答案'; }
  else { fb.className='feedback mid'; fb.textContent='看完自己判断 ✦ 点「我记住了」继续'; }
  document.getElementById('nextWrap').style.display = 'flex';
  if (ok !== true) addSelfEval();
}

function addSelfEval(){
  const wrap = document.getElementById('nextWrap');
  if (wrap.querySelector('.btn-self')) return;
  const btn = document.createElement('button');
  btn.className = 'btn-self';
  btn.textContent = '我记住了 ✓';
  btn.onclick = () => { markRight(); nextQ(); };
  wrap.insertBefore(btn, wrap.firstChild);
}

function markRight(){
  const s = session; const q = s.list[s.idx];
  const id = q.type + ':' + q.oi;
  delete store.wrong[id];
  store.stats.right++;
  save();
}

function mark(ok){
  const s = session; const q = s.list[s.idx];
  const id = q.type + ':' + (q.oi !== undefined ? q.oi : s.idx);
  if (ok){ s.right++; store.stats.right++; delete store.wrong[id]; }
  else { store.stats.wrong++; store.wrong[id] = true; }
  save(); updateProg();
}

function answerTF(val){
  const q = session.list[session.idx];
  const ok = (val === q.a);
  document.getElementById('btnT').disabled = true;
  document.getElementById('btnF').disabled = true;
  document.getElementById('btnT').className = (q.a==='对') ? 'ok' : (val==='对'?'no':'');
  document.getElementById('btnF').className = (q.a==='错') ? 'ok' : (val==='错'?'no':'');
  mark(ok);
  showAnswer(q.a, ok, false, q.e);
}

function answerChoice(i){
  const s = session; const q = s.list[s.idx];
  if (s.submitted) return;
  const el = document.querySelectorAll('.opt')[i];
  if (s.choiceSel.has(i)){ s.choiceSel.delete(i); el.classList.remove('right'); el.classList.add('dim'); }
  else { s.choiceSel.add(i); el.classList.add('right'); el.classList.remove('dim'); }
  document.getElementById('submitChoice').disabled = s.choiceSel.size === 0;
}

function submitChoice(){
  const s = session; const q = s.list[s.idx];
  s.submitted = true;
  const L = 'ABCDEF';
  const mine = [...s.choiceSel].map(i=>L[i]).sort().join('');
  const ok = (mine === q.a);
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.onclick = null;
    if (q.a.includes(L[i])) { el.classList.remove('dim'); el.classList.add('right'); }
    else if (s.choiceSel.has(i)) { el.classList.remove('right'); el.classList.add('wrong'); }
    else el.classList.add('dim');
  });
  const btn = document.getElementById('submitChoice');
  if (btn) btn.style.display = 'none';
  mark(ok);
  showAnswer(q.a, ok, false, q.e);
  s.submitted = false;
}

function answerFill(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a);
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok, false, q.e);
}

function showFillAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  showAnswer(q.a, null, false, q.e);
}

function answerRead(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a) || norm(mine) === norm(q.a.replace(/\n/g,''));
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok, true, q.e);
}

function showReadAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  showAnswer(q.a, null, true, q.e);
}

function nextQ(){ session.idx++; renderQ(); }

function renderResult(){
  const s = session;
  const total = s.list.length;
  const acc = Math.round(s.right / total * 100);
  let h = `<div class="qcard result"><div class="big">${acc}%</div>
            <div class="lbl">本轮 ${total} 题 ✦ 答对 ${s.right} 题</div>
            <div class="row"><div class="g"><b>${s.right}</b>答对</div><div class="r"><b>${total-s.right}</b>答错</div></div>`;
  if (acc >= 90) h += '<div style="color:var(--ok);font-size:15px">很棒 ✦ 这个掌握得不错</div>';
  else if (acc >= 70) h += '<div style="color:var(--warn);font-size:15px">还行 ✦ 错的那几题再刷一遍</div>';
  else h += '<div style="color:var(--bad);font-size:15px">先把错题重练一遍吧</div>';
  if (s.mode === 'level' && s.level) {
    const pct = Math.round(s.right / total * 100);
    const passed = pct >= s.level.pass;
    h += `<div style="margin:16px 0;padding:14px;border-radius:11px;text-align:center;font-size:15px;font-weight:600;
            background:${passed ? 'rgba(74,138,94,.14)' : 'rgba(182,74,69,.12)'};
            color:${passed ? 'var(--ok)' : 'var(--bad)'}">
            ${passed ? '🎉 通关！已解锁第 ' + (s.level.id + 1) + ' 关' : '差一点 · 需要 ' + s.level.pass + '% 才能通关'}
          </div>`;
    h += `<button onclick="startLevel(${s.level.id})">再挑战一次</button>`;
    h += `<button class="sec" onclick="openLevels()">回到关卡列表</button>`;
  } else {
    h += `<button onclick="start('${s.mode}')">再来一轮</button>`;
  }
  h += `<button class="sec" onclick="goHome()">回首页</button></div>`;
  app.innerHTML = h;
  progWrap.style.display = 'none';

  // 闯关：记录通关状态
  if (s.mode === 'level' && s.level) {
    const pct = Math.round(s.right / total * 100);
    if (pct >= s.level.pass) {
      store.levelDone = store.levelDone || {};
      store.levelDone[s.level.id] = true;
      save();
    }
  }
}

/* ══════════ 代码实操题 ══════════ */
let pyodide = null;
let pyReady = false;

async function ensurePyodide(){
  if (pyodide) return pyodide;
  if (typeof loadPyodide !== 'function') throw new Error('Pyodide 脚本没加载成功（可能被网络拦截）');
  const idx = window.__PY_IDX || window.__PY_CDNS[0];
  pyodide = await loadPyodide({ indexURL: idx });
  return pyodide;
}

const RUNNER = `
import sys, io, json, traceback

def _run(user_code, tests_json, mode):
    tests = json.loads(tests_json)
    result = {"mode": mode, "rows": [], "error": None, "base_output": ""}

    # 1) 先执行用户代码 · 捕获输出
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    g = {}
    try:
        exec(user_code, g)
    except SyntaxError as e:
        sys.stdout = old
        result["error"] = "语法错误（第 %s 行）: %s" % (e.lineno, e.msg)
        return json.dumps(result, ensure_ascii=False)
    except Exception as e:
        sys.stdout = old
        result["error"] = "运行报错: %s: %s" % (type(e).__name__, e)
        return json.dumps(result, ensure_ascii=False)
    sys.stdout = old
    result["base_output"] = buf.getvalue()

    if mode == "all":
        got = result["base_output"].strip()
        result["rows"].append({"call": "完整输出", "got": got, "expect": tests[0], "ok": got == tests[0]})
        return json.dumps(result, ensure_ascii=False)

    if mode == "contains":
        out = result["base_output"]
        for kw in tests:
            result["rows"].append({"call": "包含 " + kw, "got": "找到" if kw in out else "没找到", "expect": kw, "ok": kw in out})
        return json.dumps(result, ensure_ascii=False)

    # mode == tests · 逐个跑测试用例
    for item in tests:
        call, expect = item[0], item[1]
        buf2 = io.StringIO()
        sys.stdout = buf2
        try:
            exec(call, g)
            got = buf2.getvalue().strip()
            ok = (got == expect.strip())
            sys.stdout = old
            result["rows"].append({"call": call.replace(chr(10), " ; "), "got": got, "expect": expect, "ok": ok})
        except Exception as e:
            sys.stdout = old
            result["rows"].append({"call": call.replace(chr(10), " ; "), "got": "报错: %s: %s" % (type(e).__name__, e), "expect": expect, "ok": False})
    return json.dumps(result, ensure_ascii=False)
`;

async function runCodeTests(){
  const q = session.list[session.idx];
  const editor = document.getElementById('editor');
  const results = document.getElementById('testResults');
  const status = document.getElementById('pyStatus');
  const userCode = editor.value;

  if (!userCode.trim()){ alert('先写点代码吧'); return; }

  // 显示加载状态
  results.innerHTML = '<div style="color:var(--dim);font-size:13.5px">⏳ 正在准备 Python 环境（首次约 10-30 秒）...</div>';
  status.className = 'pyodide-status';
  status.textContent = '⏳ 加载 Python 运行时...';

  try {
    const py = await ensurePyodide();
    status.className = 'pyodide-status ready';
    status.textContent = '✅ Python 3.12 已就绪';

    // 准备测试数据
    let mode, tests;
    if (q.tests){
      mode = 'tests';
      tests = JSON.stringify(q.tests);
    } else if (q.expect_all_at_once !== undefined){
      mode = 'all';
      tests = JSON.stringify([q.expect_all_at_once]);
    } else if (q.expect_contains){
      mode = 'contains';
      tests = JSON.stringify(q.expect_contains);
    } else {
      results.innerHTML = '<div style="color:var(--bad)">这道题没有配置测试用例</div>';
      return;
    }

    await py.runPythonAsync(RUNNER);
    const resJson = py.globals.get('_run')(
      userCode,
      tests,
      mode
    );
    const res = JSON.parse(resJson);

    if (res.error){
      results.innerHTML = `<div class="testrow fail"><div class="call">运行出错</div>
        <div class="kv got">${esc(res.error)}</div></div>`;
      status.textContent = '❌ 运行出错';
      status.className = 'pyodide-status err';
      return;
    }

    // 渲染结果
    let h = '<div class="testlist">';
    let passN = 0;
    res.rows.forEach(r => {
      if (r.ok) passN++;
      h += `<div class="testrow ${r.ok ? 'pass' : 'fail'}">
              <div class="call">${r.ok ? '✅' : '❌'} ${esc(r.call)}</div>
              <div class="kv">实际: <span class="${r.ok ? '' : 'got'}">${esc(r.got)}</span></div>
              <div class="kv">期望: <span class="exp">${esc(r.expect)}</span></div>
            </div>`;
    });
    h += '</div>';
    results.innerHTML = h;

    const total = res.rows.length;
    if (passN === total){
      status.className = 'pyodide-status ready';
      status.textContent = `🎉 全部通过（${passN}/${total}）`;
      store.codeDone = store.codeDone || {};
      store.codeDone[q.oi] = true;
      store.stats.right++;
      save();
      // 显示优化建议
      const tip = document.getElementById('tipBox');
      if (tip) tip.classList.add('show');
    } else {
      status.className = 'pyodide-status err';
      status.textContent = `通过 ${passN} / ${total} 个用例`;
      store.codeDone = store.codeDone || {};
      delete store.codeDone[q.oi];
      save();
    }
  } catch (e) {
    status.className = 'pyodide-status err';
    status.textContent = '❌ ' + e.message;
    results.innerHTML = `<div class="testrow fail"><div class="kv got">${esc(e.message)}</div>
      <div class="kv" style="color:var(--dim);margin-top:6px">如果一直失败，可能是 CDN 被拦截 ✦ 可以改用「看参考答案」自学</div></div>`;
  }
}

function showRef(){
  const tip = document.getElementById('tipBox');
  if (tip) tip.classList.add('show');
  const box = document.getElementById('refBox');
  if (box) box.style.display = 'block';
}

function renderCodeQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderCodeResult();
  const q = s.list[s.idx];

  let h = `<div class="qcard">
    <div class="qtype">代码实操　第 ${s.idx+1} / ${s.list.length} 题　难度 ${'⭐'.repeat(q.level)}</div>
    <div class="qtext" style="font-size:17px;font-weight:600;margin-bottom:12px">${esc(q.title)}</div>
    <div style="background:var(--card2);border-radius:10px;padding:14px;font-size:14.5px;line-height:1.8;white-space:pre-wrap">${esc(q.desc)}</div>
    <div style="margin-top:16px;font-size:13px;color:var(--dim);margin-bottom:6px">你的代码：</div>
    <textarea class="editor" id="editor" spellcheck="false">${esc(q.starter)}</textarea>
    <div class="actions">
      <button class="btn-run" onclick="runCodeTests()">▶ 运行测试</button>
      <button class="btn-ref" onclick="showRef()">看参考答案</button>
    </div>
    <div class="pyodide-status" id="pyStatus">首次运行需要加载 Python 运行时（约 10-30 秒）</div>
    <div id="testResults"></div>
    <div class="tipbox" id="tipBox">
      <h4>💡 优化建议</h4>
      <ul>${q.tips.map(t => '<li>' + esc(t) + '</li>').join('')}</ul>
    </div>
    <div id="refBox" style="display:none;margin-top:14px">
      <div style="font-size:13px;color:var(--py1);margin-bottom:6px">参考答案：</div>
      <div class="codeblock">${hlPy(q.ref)}</div>
    </div>
    <div class="actions" id="nextWrap">
      <button class="btn-self" onclick="nextCodeQ()">下一题 →</button>
    </div>
  </div>`;
  app.innerHTML = h;
}

function nextCodeQ(){ session.idx++; renderCodeQ(); }

function renderCodeResult(){
  const s = session;
  let h = `<div class="qcard result"><div class="big">${s.list.length}</div>
            <div class="lbl">实操题全部过了一遍</div>
            <button onclick="start('code')">再刷一轮</button>
            <button class="sec" onclick="goHome()">回首页</button></div>`;
  app.innerHTML = h;
}

/* 重写 start，让 code 走自己的渲染 */
const _start = start;
start = function(mode){
  _start(mode);
  if (mode === 'code') renderCodeQ();
};

const _renderQ = renderQ;
renderQ = function(){
  if (session && session.list[session.idx] && session.list[session.idx].type === 'code'){
    return renderCodeQ();
  }
  _renderQ();
};

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  if (!session || !session.list) return;
  const q = session.list[session.idx];
  if (!q) return;
  if (q.type === 'judge'){
    if (e.key === '1') answerTF('对');
    if (e.key === '2') answerTF('错');
  }
  if (q.type === 'choice' && !session.submitted){
    const L = 'ABCDEF';
    const i = L.indexOf(e.key.toUpperCase());
    if (i >= 0 && i < q.opts.length) answerChoice(i);
    if (e.key === 'Enter') submitChoice();
  }
});

renderHome();

/* 首页后台预热 Pyodide ✦ 点进实操题时就不用等了 */
setTimeout(() => { ensurePyodide().catch(() => {}); }, 2500);
</script>
</body>
</html>
