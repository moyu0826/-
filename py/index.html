<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 刷题器</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1f2630; --line:#30363d;
    --ink:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; --bad:#f85149;
    --warn:#d29922; --py1:#ffd43b; --py2:#4b8bbe;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto; padding:14px 12px 100px; max-width:760px; background:var(--bg); color:var(--ink);
       font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       padding-left:max(12px,env(safe-area-inset-left));
       padding-right:max(12px,env(safe-area-inset-right));
       padding-bottom:max(100px,calc(env(safe-area-inset-bottom) + 70px))}
  button,.opt,.item,touch-action{touch-action:manipulation}

  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .top h1{font-size:19px; margin:0}
  .top h1 span{color:var(--py1)}
  .top .back{background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px;
             padding:6px 12px; font-size:13px; cursor:pointer}

  .prog{background:var(--card2); border-radius:8px; height:26px; position:relative; overflow:hidden; margin-bottom:14px}
  .prog i{position:absolute; left:0; top:0; bottom:0; background:rgba(88,166,255,.3); width:0; transition:.25s}
  .prog span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12.5px}

  .menu{display:grid; gap:11px}
  .item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; cursor:pointer}
  .item:active{background:var(--card2)}
  .item h3{margin:0 0 4px; font-size:16px}
  .item p{margin:0; color:var(--dim); font-size:13px}
  .item .n{float:right; color:var(--accent); font-size:14.5px; font-weight:700}
  .item.special{border-color:var(--warn)} .item.special .n{color:var(--warn)}
  .item.code{background:linear-gradient(135deg,#161b22,#1b2430); border-color:var(--py2)}

  .qcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px; margin-bottom:14px}
  .qtype{font-size:12px; color:var(--accent); letter-spacing:1px; margin-bottom:10px}
  .qtext{font-size:16.5px; line-height:1.75; white-space:pre-wrap; word-break:break-word}
  .codeblock{background:#0b0f14; border:1px solid var(--line); border-radius:8px; padding:13px;
             font:13.5px/1.65 Consolas,"Courier New",monospace; white-space:pre; overflow-x:auto;
             color:#c9d1d9; margin:12px 0}
  .codeblock .kw{color:#ff7b72}.codeblock .st{color:#a5d6ff}.codeblock .nu{color:#79c0ff}

  .opts{margin-top:16px; display:grid; gap:9px}
  .opt{background:var(--card2); border:1.5px solid var(--line); border-radius:10px; padding:14px 15px;
       font-size:15.5px; cursor:pointer; line-height:1.6; min-height:52px; display:flex; align-items:center}
  .opt.right{border-color:var(--ok); background:rgba(63,185,80,.14)}
  .opt.wrong{border-color:var(--bad); background:rgba(248,81,73,.14)}
  .opt.dim{opacity:.45}

  .tf{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:18px}
  .tf button{padding:22px; border-radius:12px; border:1.5px solid var(--line); background:var(--card2);
             color:var(--ink); font-size:19px; font-weight:600; cursor:pointer; min-height:72px}
  .tf button.ok{border-color:var(--ok); background:rgba(63,185,80,.16)}
  .tf button.no{border-color:var(--bad); background:rgba(248,81,73,.16)}

  .fillbox{margin-top:16px}
  .fillbox input{width:100%; background:var(--card2); border:1.5px solid var(--line); border-radius:10px;
                 padding:13px 14px; color:var(--ink); font-size:16px; outline:none;
                 font-family:Consolas,monospace}
  .fillbox input:focus{border-color:var(--accent)}
  .fillbox .btns{display:flex; gap:9px; margin-top:10px}
  .fillbox .btns button{flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
                        background:var(--card2); color:var(--ink); font-size:15px; cursor:pointer}

  .ansbox{margin-top:16px; background:rgba(88,166,255,.09); border-left:3px solid var(--accent);
          border-radius:8px; padding:12px 14px; font-size:14.5px; white-space:pre-wrap; display:none}
  .ansbox.show{display:block}
  .ansbox b{color:var(--accent)}
  .ansbox .mono{font-family:Consolas,monospace; color:var(--py1)}

  .actions{display:flex; gap:9px; margin-top:16px; flex-wrap:wrap}
  .actions button{flex:1; min-width:120px; padding:14px; border-radius:11px; border:0;
                  font-size:15.5px; font-weight:600; cursor:pointer}
  .btn-next{background:var(--accent); color:#06101f}
  .btn-self{background:var(--card2); color:var(--ink); border:1px solid var(--line) !important}
  .btn-run{background:var(--ok); color:#06101f}
  .btn-ref{background:var(--card2); color:var(--py1); border:1px solid var(--py2) !important}

  .feedback{margin-top:14px; font-size:15px; font-weight:600; text-align:center; padding:10px; border-radius:10px}
  .feedback.good{color:var(--ok); background:rgba(63,185,80,.1)}
  .feedback.bad{color:var(--bad); background:rgba(248,81,73,.1)}
  .feedback.mid{color:var(--warn); background:rgba(210,153,34,.1)}

  /* 实操题 */
  .editor{width:100%; min-height:200px; background:#0b0f14; color:#c9d1d9; border:1.5px solid var(--line);
          border-radius:10px; padding:13px; font:13.5px/1.65 Consolas,"Courier New",monospace;
          resize:vertical; outline:none; tab-size:4}
  .editor:focus{border-color:var(--accent)}
  .testlist{margin-top:14px; display:grid; gap:8px}
  .testrow{background:var(--card2); border-radius:8px; padding:11px 13px; font-size:13.5px;
           border-left:3px solid var(--line)}
  .testrow.pass{border-left-color:var(--ok)}
  .testrow.fail{border-left-color:var(--bad)}
  .testrow .call{font-family:Consolas,monospace; color:var(--accent); font-size:13px}
  .testrow .kv{margin-top:5px; font-family:Consolas,monospace; font-size:12.5px; line-height:1.7}
  .testrow .got{color:var(--bad)} .testrow .exp{color:var(--ok)}
  .tipbox{margin-top:14px; background:rgba(210,153,34,.08); border-left:3px solid var(--warn);
          border-radius:8px; padding:12px 14px; font-size:14px; display:none}
  .tipbox.show{display:block}
  .tipbox h4{margin:0 0 8px; font-size:14px; color:var(--warn)}
  .tipbox ul{margin:0; padding-left:20px}
  .tipbox li{margin:6px 0; line-height:1.65}
  .pyodide-status{font-size:12.5px; color:var(--dim); margin-top:10px; text-align:center}
  .pyodide-status.ready{color:var(--ok)}
  .pyodide-status.err{color:var(--bad)}

  .result{text-align:center; padding:30px 16px}
  .result .big{font-size:52px; font-weight:800; color:var(--accent); line-height:1.2}
  .result .lbl{color:var(--dim); font-size:14px; margin-bottom:22px}
  .result .row{display:flex; justify-content:space-around; margin:24px 0; font-size:14px}
  .result .row div b{display:block; font-size:22px}
  .result .row .g{color:var(--ok)} .result .row .r{color:var(--bad)}
  .result button{margin-top:12px; width:100%; padding:15px; border-radius:12px; border:0;
                 font-size:16px; font-weight:600; cursor:pointer; background:var(--accent); color:#06101f}
  .result button.sec{background:var(--card2); color:var(--ink); border:1px solid var(--line)}
</style>
</head>
<body>

<div class="top">
  <h1><span>🐍</span> Python 刷题器</h1>
  <button class="back" id="backBtn" style="display:none" onclick="goHome()">返回</button>
</div>
<div class="prog" id="progWrap" style="display:none"><i id="progi"></i><span id="progt"></span></div>

<div id="app"></div>

<script>
/* Pyodide 多源自动切换 ✦ 一个 CDN 挂了换下一个 */
window.__PY_CDNS = [
  'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/',
  'https://fastly.jsdelivr.net/pyodide/v0.26.2/full/',
  'https://unpkg.com/pyodide@0.26.2/'
];
window.__PY_IDX = null;
window.__PY_FAILED = false;
(function loadNext(i){
  if (i >= window.__PY_CDNS.length) {
    window.__PY_FAILED = true;
    window.dispatchEvent(new Event('pyodidefail'));
    return;
  }
  const idx = window.__PY_CDNS[i];
  const s = document.createElement('script');
  s.src = idx + 'pyodide.js';
  s.onload = () => {
    window.__PY_IDX = idx;
    window.dispatchEvent(new Event('pyodideloaded'));
  };
  s.onerror = () => loadNext(i + 1);
  document.head.appendChild(s);
})(0);
</script>

nit__ 方法在创建对象时会自动调用","a":"对"},{"q":"类名一般用大写字母开头（如 Student）","a":"对"},{"q":"一个类只能创建一个对象","a":"错"},{"q":"self 代表对象自己","a":"对"},{"q":"类的方法里 self 可以省略不写","a":"错"},{"q":"在方法里写 self.x = 10 会修改对象的属性","a":"对"},{"q":"对象的属性只能在 __init__ 里创建","a":"错"}],"choice":[{"q":"print(3 + 4 * 2) 的输出是？","opts":["A、 11","B、 14","C、 7","D、 24"],"a":"A"},{"q":"print(10 // 3) 的输出是？","opts":["A、 3","B、 3.33","C、 4","D、 1"],"a":"A"},{"q":"print(2 ** 3 ** 2) 的输出是？","opts":["A、 64","B、 512","C、 36","D、 12"],"a":"B"},{"q":"type(3.0) 的结果是？","opts":["A、 <class 'int'>","B、 <class 'float'>","C、 <class 'str'>","D、 <class 'number'>"],"a":"B"},{"q":"print(\"5\" + \"3\") 的输出是？","opts":["A、 8","B、 53","C、 \"53\"","D、 报错"],"a":"B"},{"q":"print(int(\"7\") + 3) 的输出是？","opts":["A、 73","B、 10","C、 报错","D、 \"73\""],"a":"B"},{"q":"a = [1, 2, 3]；print(a[1]) 的输出是？","opts":["A、 1","B、 2","C、 3","D、 报错"],"a":"B"},{"q":"a = [1, 2, 3]；print(a[-1]) 的输出是？","opts":["A、 1","B、 2","C、 3","D、 报错"],"a":"C"},{"q":"a = [1, 2, 3]；print(a[1:3]) 的输出是？","opts":["A、 [1, 2]","B、 [2, 3]","C、 [1, 2, 3]","D、 [2]"],"a":"B"},{"q":"下面哪个不是 Python 的合法变量名？","opts":["A、 my_name","B、 _count","C、 2value","D、 名字"],"a":"C"},{"q":"print(len(\"hello\")) 的输出是？","opts":["A、 4","B、 5","C、 6","D、 报错"],"a":"B"},{"q":"d = {\"a\": 1}；print(d.get(\"b\", 0)) 的输出是？","opts":["A、 None","B、 0","C、 报错","D、 1"],"a":"B"},{"q":"for i in range(3): print(i, end=\" \") 输出？","opts":["A、 0 1 2","B、 1 2 3","C、 0 1 2 3","D、 1 2"],"a":"A"},{"q":"print(1 == 1.0) 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 1"],"a":"A"},{"q":"x = 5；x += 3；print(x) 的输出是？","opts":["A、 5","B、 8","C、 53","D、 报错"],"a":"B"},{"q":"下面哪个能创建空列表？","opts":["A、 list()","B、 []","C、 两者都行","D、 两者都不行"],"a":"C"},{"q":"print(bool(\"\")) 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 0"],"a":"B"},{"q":"print(bool(\"0\")) 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 0"],"a":"A"},{"q":"def f(): pass；print(f()) 的输出是？","opts":["A、 None","B、 0","C、 报错","D、 什么都不输出"],"a":"A"},{"q":"def f(a, b=2): return a + b；print(f(1)) 输出？","opts":["A、 3","B、 1","C、 报错","D、 None"],"a":"A"},{"q":"print(\"abc\" * 2) 的输出是？","opts":["A、 abcabc","B、 abc2","C、 报错","D、 abc abc"],"a":"A"},{"q":"s = \"hello\"；print(s.upper()) 的输出是？","opts":["A、 hello","B、 HELLO","C、 Hello","D、 报错"],"a":"B"},{"q":"list1 = [1, 2]；list2 = list1；list2.append(3)；print(list1) 输出？","opts":["A、 [1, 2]","B、 [1, 2, 3]","C、 报错","D、 [3]"],"a":"B"},{"q":"print(sorted([3, 1, 2])) 的输出是？","opts":["A、 [3, 1, 2]","B、 [1, 2, 3]","C、 None","D、 报错"],"a":"B"},{"q":"x = [1, 2, 3]；print(x[::-1]) 的输出是？","opts":["A、 [1, 2, 3]","B、 [3, 2, 1]","C、 [3]","D、 报错"],"a":"B"},{"q":"下面哪个是不可变类型？","opts":["A、 list","B、 dict","C、 tuple","D、 set"],"a":"C"},{"q":"print(3 == \"3\") 的输出是？","opts":["A、 True","B、 False","C、 报错","D、 3"],"a":"B"},{"q":"for i in range(1, 5): if i == 3: break；print(i, end=\"\") 输出？","opts":["A、 123","B、 12","C、 1234","D、 4"],"a":"B"},{"q":"for i in range(1, 5): if i == 3: continue；print(i, end=\"\") 输出？","opts":["A、 123","B、 124","C、 12","D、 1234"],"a":"B"},{"q":"open(\"a.txt\", \"w\") 中的 \"w\" 表示？","opts":["A、 只读","B、 写入（清空）","C、 追加","D、 读写"],"a":"B"},{"q":"print(len([1, [2, 3], 4])) 的输出是？","opts":["A、 3","B、 4","C、 5","D、 报错"],"a":"A"},{"q":"x = 10；if x > 5: print(\"A\")；else: print(\"B\") 输出？","opts":["A、 A","B、 B","C、 报错","D、 什么都不输出"],"a":"A"},{"q":"下面哪个会报错？","opts":["A、 int(\"5\")","B、 int(5.9)","C、 int(\"5.9\")","D、 float(\"5\")"],"a":"C"},{"q":"print(\"- \".join([\"a\", \"b\", \"c\"])) 的输出是？","opts":["A、 a-b-c","B、 a - b - c","C、 - a - b - c","D、 abc"],"a":"A"},{"q":"d = {\"x\": 1, \"y\": 2}；print(list(d.keys())) 的输出是？","opts":["A、 dict_keys(['x','y'])","B、 ['x', 'y']","C、 ['x']","D、 报错"],"a":"B"}],"fill":[{"q":"print 输出时如果想改变分隔符，要写 print(a, b, ____=\"-\")","a":"sep"},{"q":"print 输出完不想换行，要写 print(x, ____=\"\")","a":"end"},{"q":"7 除以 2 取整数的运算符是 ____（两个字符）","a":"//"},{"q":"求余数的运算符是 ____","a":"%"},{"q":"求乘方的运算符是 ____（两个字符）","a":"**"},{"q":"把字符串转成整数的函数是 ____()","a":"int"},{"q":"把数字转成字符串的函数是 ____()","a":"str"},{"q":"获取列表长度的函数是 ____()","a":"len"},{"q":"if 语句后面必须写一个 ____（符号）","a":":"},{"q":"表示「否则如果」的关键字是 ____","a":"elif"},{"q":"立即跳出整个循环的关键字是 ____","a":"break"},{"q":"跳过本次循环剩余部分的关键字是 ____","a":"continue"},{"q":"for i in ____(5): 会循环 5 次","a":"range"},{"q":"列表里添加元素到末尾的方法是 ____()","a":"append"},{"q":"字典里安全取值（不报错）的方法是 ____()","a":"get"},{"q":"定义函数用的关键字是 ____","a":"def"},{"q":"函数返回值用的关键字是 ____","a":"return"},{"q":"打开文件的函数是 ____()","a":"open"},{"q":"以追加模式打开文件，模式字符串是 ____","a":"a"},{"q":"读中文文件时 encoding 参数一般写 ____","a":"utf-8"},{"q":"自动关闭文件的语法是 ____ open(...) as f:","a":"with"},{"q":"定义类用的关键字是 ____","a":"class"},{"q":"类的构造函数名是 ____","a":"__init__"},{"q":"类方法里的第一个参数约定叫 ____","a":"self"},{"q":"创建对象时调用类名，会自动执行 ____ 方法","a":"__init__"}],"read":[{"title":"基础运算","code":"print(3 + 4 * 2 - 1)","a":"10"},{"title":"整除与余数","code":"print(17 // 5, 17 % 5)","a":"3 2"},{"title":"字符串拼接","code":"print(\"Py\" + \"thon\")","a":"Python"},{"title":"类型转换","code":"print(int(\"12\") + 3)\nprint(str(12) + \"3\")","a":"15\n123"},{"title":"列表索引","code":"a = [10, 20, 30, 40]\nprint(a[0], a[-1], a[1:3])","a":"10 40 [20, 30]"},{"title":"列表追加","code":"a = [1, 2]\na.append([3, 4])\nprint(len(a))\nprint(a)","a":"3\n[1, 2, [3, 4]]"},{"title":"range 求和","code":"s = 0\nfor i in range(1, 6):\n    s += i\nprint(s)","a":"15"},{"title":"break 的作用","code":"for i in range(5):\n    if i == 2:\n        break\n    print(i, end=\"\")","a":"01"},{"title":"continue 的作用","code":"for i in range(5):\n    if i % 2 == 0:\n        continue\n    print(i, end=\"\")","a":"13"},{"title":"while 循环","code":"n = 3\nwhile n > 0:\n    print(n, end=\" \")\n    n -= 1","a":"3 2 1"},{"title":"字典遍历","code":"d = {\"a\": 1, \"b\": 2}\nfor k in d:\n    print(k, end=\" \")","a":"a b"},{"title":"列表推导式","code":"print([x * 2 for x in range(4)])","a":"[0, 2, 4, 6]"},{"title":"函数默认参数","code":"def f(a, b=10):\n    return a + b\nprint(f(5))\nprint(f(5, 1))","a":"15\n6"},{"title":"print vs return","code":"def f():\n    return 5\n    print(99)\nprint(f())","a":"5"},{"title":"嵌套列表","code":"m = [[1, 2], [3, 4]]\nprint(m[1][0])","a":"3"},{"title":"字符串方法","code":"s = \" Hello World \"\nprint(s.strip().lower())","a":"hello world"},{"title":"sorted 排序","code":"print(sorted([3, 1, 2], reverse=True))","a":"[3, 2, 1]"},{"title":"字典推导","code":"d = {i: i*i for i in range(1, 4)}\nprint(d)","a":"{1: 1, 2: 4, 3: 9}"},{"title":"全局与局部","code":"x = 1\ndef f():\n    x = 2\nf()\nprint(x)","a":"1"},{"title":"类的实例化","code":"class Dog:\n    def __init__(self, name):\n        self.name = name\n    def bark(self):\n        return self.name + \" 叫\"\n\nd = Dog(\"旺财\")\nprint(d.bark())","a":"旺财 叫"},{"title":"布尔运算","code":"print(True and False, True or False, not True)","a":"False True False"},{"title":"集合去重","code":"print(len(set([1, 2, 2, 3, 3, 3])))","a":"3"},{"title":"隐式转换陷阱","code":"print(\"3\" * 3)","a":"333"},{"title":"多变量赋值","code":"a, b = 1, 2\na, b = b, a\nprint(a, b)","a":"2 1"}],"code":[{"title":"交换两个变量","level":1,"desc":"给定两个变量 a = 10，b = 20，请交换它们的值，然后打印 a 和 b。\n\n要求输出格式：\n20 10","starter":"a = 10\nb = 20\n# 在这里写你的代码\n\nprint(a, b)","expect_all_at_once":"20 10","ref":"a = 10\nb = 20\n\n# 方法一：Python 特色写法\na, b = b, a\nprint(a, b)\n\n# 方法二：借助临时变量\n# tmp = a\n# a = b\n# b = tmp","tips":["Python 里 a, b = b, a 就完成了交换，不需要临时变量","这是 Python 特有的元组解包，C/Java 都得用中间变量","了解差：a, b = b, a 是先建元组 (b, a) 再解包赋值"]},{"title":"判断奇偶","level":1,"desc":"写一个函数 check(n)，如果 n 是偶数打印「偶数」，否则打印「奇数」。\n\n测试会用 check(4) 和 check(7) 调用。","starter":"def check(n):\n    # 在这里写你的代码\n    pass","tests":[["check(4)","偶数"],["check(7)","奇数"],["check(0)","偶数"]],"ref":"def check(n):\n    if n % 2 == 0:\n        print(\"偶数\")\n    else:\n        print(\"奇数\")","tips":["判断偶数最简单是 n % 2 == 0","也可以写 if n % 2: print(\"奇数\") else: print(\"偶数\")（0 是假，非 0 是真）","更进一步可以用一行：print(\"偶数\" if n % 2 == 0 else \"奇数\")"]},{"title":"求 1 到 100 的和","level":1,"desc":"用循环求 1 + 2 + 3 + ... + 100 的结果并打印。\n\n要求输出：\n5050","starter":"total = 0\n# 在这里写循环\n\nprint(total)","expect_all_at_once":"5050","ref":"total = 0\nfor i in range(1, 101):\n    total += i\nprint(total)\n\n# 数学公式法：\n# print(100 * 101 // 2)","tips":["range(1, 101) 是 1 到 100，注意不是 range(101)","等差数列求和公式：n*(n+1)//2 → 100*101//2 = 5050，O(1) 秒出","Python 内置 sum(range(1, 101)) 一行也行"]},{"title":"列表去重（保持顺序）","level":2,"desc":"写一个函数 dedupe(lst)，去掉列表里重复的元素，并保持原来出现的顺序。\n\n测试用例：\n  dedupe([1, 2, 2, 3, 1]) → [1, 2, 3]\n  dedupe(['a', 'b', 'a']) → ['a', 'b']","starter":"def dedupe(lst):\n    # 在这里写你的代码\n    return lst\n\nprint(dedupe([1, 2, 2, 3, 1]))","tests":[["print(dedupe([1, 2, 2, 3, 1]))","[1, 2, 3]"],["print(dedupe(['a', 'b', 'a']))","['a', 'b']"],["print(dedupe([5]))","[5]"]],"ref":"def dedupe(lst):\n    return list(dict.fromkeys(lst))\n\n# 或者：\n# result = []\n# for x in lst:\n#     if x not in result:\n#         result.append(x)\n# return result","tips":["list(dict.fromkeys(lst)) 是最优雅的写法：字典键唯一且保序（Python 3.7+）","不要用 list(set(lst)) · 集合无序，会把原来的顺序打乱","如果数据量大（10 万条以上），dict.fromkeys 是 O(n)，双重循环是 O(n²)"]},{"title":"统计词频","level":2,"desc":"给定字符串 text，统计每个字符出现的次数，用字典返回。\n\n测试用例：\n  count(\"aab\") → {'a': 2, 'b': 1}","starter":"def count(text):\n    result = {}\n    # 在这里写你的代码\n    return result\n\nprint(count(\"aab\"))","tests":[["print(count(\"aab\"))","{'a': 2, 'b': 1}"],["print(count(\"abc\"))","{'a': 1, 'b': 1, 'c': 1}"]],"ref":"def count(text):\n    result = {}\n    for ch in text:\n        result[ch] = result.get(ch, 0) + 1\n    return result\n\n# 或者用 collections.Counter：\n# from collections import Counter\n# return dict(Counter(text))","tips":["关键在 result.get(ch, 0) + 1 —— get 的第二个参数是默认值，避免 KeyError","标准库 collections.Counter 一行就能统计：Counter(text)","如果要做「按次数排序」，用 sorted(d.items(), key=lambda x: -x[1])"]},{"title":"找最大值（不用 max）","level":2,"desc":"写一个函数 find_max(lst)，返回列表里的最大值。\n不允许使用内置函数 max()。\n\n测试用例：\n  find_max([3, 7, 2]) → 7","starter":"def find_max(lst):\n    # 在这里写你的代码\n    return 0\n\nprint(find_max([3, 7, 2]))","tests":[["print(find_max([3, 7, 2]))","7"],["print(find_max([-5, -1, -9]))","-1"],["print(find_max([42]))","42"]],"ref":"def find_max(lst):\n    m = lst[0]\n    for x in lst:\n        if x > m:\n            m = x\n    return m","tips":["初始值要用 lst[0]，不能写 0 —— 否则全是负数时答案错","这样写是 O(n)，只遍历一遍，是最优的","实际项目直接 max(lst) 就行，这个题是练基本功"]},{"title":"判断素数","level":2,"desc":"写一个函数 is_prime(n)，判断 n 是不是素数（质数），返回 True 或 False。\n\n测试用例：\n  is_prime(7) → True\n  is_prime(8) → False","starter":"def is_prime(n):\n    # 在这里写你的代码\n    return False\n\nprint(is_prime(7))","tests":[["print(is_prime(7))","True"],["print(is_prime(8))","False"],["print(is_prime(2))","True"],["print(is_prime(1))","False"]],"ref":"def is_prime(n):\n    if n < 2:\n        return False\n    for i in range(2, int(n ** 0.5) + 1):\n        if n % i == 0:\n            return False\n    return True","tips":["必须先处理 n < 2 的情况（1、0、负数都不是素数）","循环只需要到 √n，不用到 n · 这是最关键的优化，复杂度从 O(n) 降到 O(√n)","sqrt 用 int(n ** 0.5) 就行，或者 import math 用 math.isqrt(n)"]},{"title":"斐波那契数列","level":3,"desc":"写一个函数 fib(n)，返回第 n 个斐波那契数。\n定义：fib(0)=0, fib(1)=1, fib(n)=fib(n-1)+fib(n-2)\n\n测试用例：\n  fib(0) → 0\n  fib(6) → 8","starter":"def fib(n):\n    # 在这里写你的代码\n    return 0\n\nprint(fib(6))","tests":[["print(fib(0))","0"],["print(fib(1))","1"],["print(fib(6))","8"],["print(fib(10))","55"]],"ref":"def fib(n):\n    if n < 2:\n        return n\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a","tips":["递归写法 fib(n-1) + fib(n-2) 会重复计算，O(2^n) 慢得离谱（n=35 要算好几秒）","迭代写法 O(n)，两个变量滚动就够了，内存 O(1)","如果只是要第 n 项，还可以用矩阵快速幂做到 O(log n)"]},{"title":"九九乘法表","level":2,"desc":"用嵌套循环打印九九乘法表的下三角。\n\n要求输出第一行是 1*1=1，第二行是 1*2=2 2*2=4，以此类推。\n只打印 i >= j 的部分（j 从 1 到 i）。\n\n示例（前两行）：\n1*1=1\n1*2=2 2*2=4","starter":"# 用两层 for 循环\nfor i in range(1, 10):\n    # 在这里写内层循环\n    pass","expect_contains":["1*1=1","2*2=4","3*3=9","9*9=81"],"ref":"for i in range(1, 10):\n    for j in range(1, i + 1):\n        print(f\"{j}*{i}={j*i}\", end=\" \")\n    print()","tips":["内层 range(1, i+1) 是关键 —— 只循环到 i，才能形成三角形","end=\" \" 让同一行不换行，每行结束后单独 print() 换行","f\"{j}*{i}={j*i}\" 是 f-string，比 \"%d*%d=%d\" % (...) 更清楚"]},{"title":"字符串反转","level":1,"desc":"写一个函数 reverse(s)，把字符串倒过来。\n\n测试用例：\n  reverse(\"abc\") → \"cba\"","starter":"def reverse(s):\n    # 在这里写你的代码\n    return s\n\nprint(reverse(\"abc\"))","tests":[["print(reverse(\"abc\"))","cba"],["print(reverse(\"hello\"))","olleh"]],"ref":"def reverse(s):\n    return s[::-1]\n\n# 或者：\n# return \"\".join(reversed(s))","tips":["s[::-1] 是切片步长 -1，一行搞定，Python 最地道的写法","\"\".join(reversed(s)) 也可以，但略啰嗦","不要用 for 循环一个个拼字符串 · 因为字符串不可变，每次都新建，O(n²)"]},{"title":"成绩等级转换","level":2,"desc":"写一个函数 grade(score)，按分数返回等级：\n  90 分以上（含 90）→ \"A\"\n  80-89 → \"B\"\n  70-79 → \"C\"\n  60-69 → \"D\"\n  60 分以下 → \"不及格\"\n\n测试用例：\n  grade(95) → A\n  grade(59) → 不及格","starter":"def grade(score):\n    # 在这里写你的代码\n    return \"\"\n\nprint(grade(95))","tests":[["print(grade(95))","A"],["print(grade(85))","B"],["print(grade(70))","C"],["print(grade(60))","D"],["print(grade(59))","不及格"],["print(grade(90))","A"]],"ref":"def grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    elif score >= 60:\n        return \"D\"\n    else:\n        return \"不及格\"","tips":["if/elif 的顺序很重要：必须从高到低，否则 95 会先命中 60 那个条件","边界值要特别注意：90 应该是 A（用 >= 不是 >）","干净点可以用字典 + 二分，但成绩这种简单的 if/elif 最清楚"]},{"title":"设计一个学生类","level":3,"desc":"设计一个类 Student，要求：\n· 创建时传入 name 和 score\n· 有一个方法 is_pass()，分数 >= 60 返回 True\n· 有一个方法 show()，打印「姓名：xxx，分数：xxx」\n\n测试用例：\n  s = Student(\"小明\", 85)；print(s.is_pass()) → True","starter":"class Student:\n    def __init__(self, name, score):\n        # 在这里写你的代码\n        pass\n\n    def is_pass(self):\n        pass\n\n    def show(self):\n        pass\n\n\ns = Student(\"小明\", 85)\nprint(s.is_pass())\ns.show()","tests":[["s = Student(\"小明\", 85)\nprint(s.is_pass())","True"],["s = Student(\"小红\", 55)\nprint(s.is_pass())","False"],["s = Student(\"小明\", 85)\ns.show()","姓名：小明，分数：85"]],"ref":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def is_pass(self):\n        return self.score >= 60\n\n    def show(self):\n        print(f\"姓名：{self.name}，分数：{self.score}\")","tips":["self.name = name 这一步不能漏 · 否则方法里访问不到","方法里访问属性必须写 self.xxx，不能直接写 name（那是局部变量）","更规范的做法是加 @property 和类型标注（def __init__(self, name: str, score: float)）"]}]};

const STORE = 'pyquiz_v1';
let store = { wrong: {}, stats: { right: 0, wrong: 0 }, codeDone: {} };
try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s) store = Object.assign(store, s); } catch(e){}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(store)); } catch(e){} }

let session = null;
const app = document.getElementById('app');
const titleEl = document.querySelector('.top h1');
const backBtn = document.getElementById('backBtn');
const progWrap = document.getElementById('progWrap');
const progi = document.getElementById('progi');
const progt = document.getElementById('progt');

const TYPES = {
  judge:  { name: '判断题',   desc: '点「对」或「错」✦ 键盘按 1 / 2' },
  choice: { name: '选择题',   desc: '选中后点提交 ✦ 可能是多选' },
  fill:   { name: '填空题',   desc: '手打答案 ✦ 回车或点提交' },
  read:   { name: '代码阅读', desc: '看代码 ✦ 说出输出结果 ⭐ 最像考试题' },
  code:   { name: '代码实操', desc: '真跑 Python ✦ 输出对就算过 ⭐ 实验课风格' },
};

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function goHome(){
  session = null;
  titleEl.innerHTML = '<span>🐍</span> Python 刷题器';
  backBtn.style.display = 'none';
  progWrap.style.display = 'none';
  renderHome();
}

function renderHome(){
  const total = DATA.judge.length + DATA.choice.length + DATA.fill.length + DATA.read.length + DATA.code.length;
  const wrongN = Object.keys(store.wrong).length;
  const codeDone = Object.keys(store.codeDone || {}).length;
  let h = '<div class="menu">';
  h += `<div class="item" onclick="start('all')"><span class="n">共 ${total} 题</span><h3>全部混合刷</h3><p>随机顺序 ✦ 四种题型混着来</p></div>`;
  for (const k of ['judge','choice','fill','read']){
    h += `<div class="item" onclick="start('${k}')"><span class="n">${DATA[k].length} 题</span><h3>${TYPES[k].name}</h3><p>${TYPES[k].desc}</p></div>`;
  }
  h += `<div class="item code" onclick="start('code')"><span class="n">${DATA.code.length} 题 ${codeDone ? '· 已过 ' + codeDone : ''}</span><h3>💻 代码实操</h3><p>${TYPES.code.desc}</p></div>`;
  if (wrongN > 0){
    h += `<div class="item special" onclick="start('wrong')"><span class="n">${wrongN} 题</span><h3>⭐ 错题重练</h3><p>只刷之前做错的</p></div>`;
  }
  h += '</div>';
  const s = store.stats;
  const acc = (s.right + s.wrong) > 0 ? Math.round(s.right / (s.right + s.wrong) * 100) : 0;
  h += `<div style="text-align:center;color:var(--dim);font-size:13px;margin-top:18px">
          累计答对 <b style="color:var(--ok)">${s.right}</b> 题 ✦ 答错 <b style="color:var(--bad)">${s.wrong}</b> 题 ✦
          正确率 <b style="color:var(--accent)">${acc}%</b></div>`;
  h += `<div style="text-align:center;margin-top:14px"><button class="back" onclick="resetAll()">清空所有记录</button></div>`;
  app.innerHTML = h;
}

function resetAll(){
  if (!confirm('确定清空全部刷题记录？')) return;
  store = { wrong:{}, stats:{right:0,wrong:0}, codeDone:{} };
  save(); renderHome();
}

function start(mode){
  let list = [];
  if (mode === 'all'){
    list = shuffle([
      ...DATA.judge.map((x,i)=>({...x,type:'judge',oi:i})),
      ...DATA.choice.map((x,i)=>({...x,type:'choice',oi:i})),
      ...DATA.fill.map((x,i)=>({...x,type:'fill',oi:i})),
      ...DATA.read.map((x,i)=>({...x,type:'read',oi:i})),
    ]);
  } else if (mode === 'wrong'){
    for (const k of ['judge','choice','fill','read']){
      DATA[k].forEach((x,i)=>{ if (store.wrong[k+':'+i]) list.push({...x,type:k,oi:i}); });
    }
    list = shuffle(list);
  } else if (mode === 'code'){
    list = shuffle(DATA.code.map((x,i)=>({...x,type:'code',oi:i})));
  } else {
    list = shuffle(DATA[mode].map((x,i)=>({...x,type:mode,oi:i})));
  }
  if (!list.length){ alert('这个类别没有题目'); return; }
  session = { list, idx:0, right:0, mode };
  backBtn.style.display = 'block';
  progWrap.style.display = mode === 'code' ? 'none' : 'block';
  titleEl.textContent = mode === 'all' ? '全部混合' : (mode === 'wrong' ? '错题重练' : TYPES[mode].name);
  renderQ();
}

function updateProg(){
  const s = session;
  if (!s.list.length) return;
  progi.style.width = (s.idx / s.list.length * 100) + '%';
  progt.textContent = `${s.idx} / ${s.list.length}　对 ${s.right}`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hlPy(code){
  let s = esc(code);
  s = s.replace(/\b(def|return|if|elif|else|for|while|import|from|class|try|except|with|as|in|not|and|or|break|continue|pass|lambda|None|True|False)\b/g,'<span class="kw">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g,'<span class="st">$1</span>');
  return s;
}

function renderQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderResult();
  updateProg();
  const q = s.list[s.idx];
  const t = TYPES[q.type];
  let h = `<div class="qcard"><div class="qtype">${t.name}　第 ${s.idx+1} / ${s.list.length} 题</div>`;

  if (q.type === 'read'){
    h += `<div class="qtext">这段代码输出什么？</div>`;
    h += `<div class="codeblock">${hlPy(q.code)}</div>`;
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerRead();return false;">
            <input id="fillInput" placeholder="输入输出结果 ✦ 多行用分号或回车分开" autocomplete="off" enterkeyhint="done" required>
            <div class="btns"><button type="submit">提交</button><button type="button" onclick="showReadAnswer()">看答案</button></div>
          </form>`;
  } else if (q.type === 'judge'){
    h += `<div class="qtext">${esc(q.q)}</div>`;
    h += `<div class="tf"><button onclick="answerTF('对')" id="btnT">✓ 对</button><button onclick="answerTF('错')" id="btnF">， 错</button></div>`;
  } else if (q.type === 'choice'){
    h += `<div class="qtext">${esc(q.q)}</div><div class="opts">`;
    q.opts.forEach((o,i)=>{ h += `<div class="opt" onclick="answerChoice(${i})">${esc(o)}</div>`; });
    h += `</div><div class="actions"><button class="btn-next" id="submitChoice" onclick="submitChoice()" disabled>提交</button></div>`;
    s.choiceSel = new Set();
  } else if (q.type === 'fill'){
    h += `<div class="qtext">${esc(q.q)}</div>`;
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerFill();return false;">
            <input id="fillInput" placeholder="输入答案" autocomplete="off" enterkeyhint="done" required>
            <div class="btns"><button type="submit">提交</button><button type="button" onclick="showFillAnswer()">看答案</button></div>
          </form>`;
  }

  h += `<div class="ansbox" id="ansbox"></div>`;
  h += `<div class="feedback" id="fb" style="display:none"></div>`;
  h += `<div class="actions" id="nextWrap" style="display:none"><button class="btn-next" onclick="nextQ()">下一题 →</button></div>`;
  h += '</div>';
  app.innerHTML = h;

  const inp = document.getElementById('fillInput');
  if (inp) inp.focus();
}

function norm(s){
  return String(s).toLowerCase().replace(/[\s，,。．.、；;：:（）()【】\[\]"'"'']/g,'').trim();
}

function showAnswer(ans, ok, mono){
  const box = document.getElementById('ansbox');
  box.innerHTML = '<b>正确答案</b><br>' + (mono ? `<span class="mono">${esc(ans)}</span>` : esc(ans));
  box.classList.add('show');
  const fb = document.getElementById('fb');
  fb.style.display = 'block';
  if (ok === true){ fb.className='feedback good'; fb.textContent='✅ 答对了'; }
  else if (ok === false){ fb.className='feedback bad'; fb.textContent='❌ 答错了，看上面的正确答案'; }
  else { fb.className='feedback mid'; fb.textContent='看完自己判断 ✦ 点「我记住了」继续'; }
  document.getElementById('nextWrap').style.display = 'flex';
  if (ok !== true) addSelfEval();
}

function addSelfEval(){
  const wrap = document.getElementById('nextWrap');
  if (wrap.querySelector('.btn-self')) return;
  const btn = document.createElement('button');
  btn.className = 'btn-self';
  btn.textContent = '我记住了 ✓';
  btn.onclick = () => { markRight(); nextQ(); };
  wrap.insertBefore(btn, wrap.firstChild);
}

function markRight(){
  const s = session; const q = s.list[s.idx];
  const id = q.type + ':' + q.oi;
  delete store.wrong[id];
  store.stats.right++;
  save();
}

function mark(ok){
  const s = session; const q = s.list[s.idx];
  const id = q.type + ':' + (q.oi !== undefined ? q.oi : s.idx);
  if (ok){ s.right++; store.stats.right++; delete store.wrong[id]; }
  else { store.stats.wrong++; store.wrong[id] = true; }
  save(); updateProg();
}

function answerTF(val){
  const q = session.list[session.idx];
  const ok = (val === q.a);
  document.getElementById('btnT').disabled = true;
  document.getElementById('btnF').disabled = true;
  document.getElementById('btnT').className = (q.a==='对') ? 'ok' : (val==='对'?'no':'');
  document.getElementById('btnF').className = (q.a==='错') ? 'ok' : (val==='错'?'no':'');
  mark(ok);
  showAnswer(q.a, ok);
}

function answerChoice(i){
  const s = session; const q = s.list[s.idx];
  if (s.submitted) return;
  const el = document.querySelectorAll('.opt')[i];
  if (s.choiceSel.has(i)){ s.choiceSel.delete(i); el.classList.remove('right'); el.classList.add('dim'); }
  else { s.choiceSel.add(i); el.classList.add('right'); el.classList.remove('dim'); }
  document.getElementById('submitChoice').disabled = s.choiceSel.size === 0;
}

function submitChoice(){
  const s = session; const q = s.list[s.idx];
  s.submitted = true;
  const L = 'ABCDEF';
  const mine = [...s.choiceSel].map(i=>L[i]).sort().join('');
  const ok = (mine === q.a);
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.onclick = null;
    if (q.a.includes(L[i])) { el.classList.remove('dim'); el.classList.add('right'); }
    else if (s.choiceSel.has(i)) { el.classList.remove('right'); el.classList.add('wrong'); }
    else el.classList.add('dim');
  });
  const btn = document.getElementById('submitChoice');
  if (btn) btn.style.display = 'none';
  mark(ok);
  showAnswer(q.a, ok);
  s.submitted = false;
}

function answerFill(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a);
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok);
}

function showFillAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  showAnswer(q.a, null);
}

function answerRead(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a) || norm(mine) === norm(q.a.replace(/\n/g,''));
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok, true);
}

function showReadAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  showAnswer(q.a, null, true);
}

function nextQ(){ session.idx++; renderQ(); }

function renderResult(){
  const s = session;
  const total = s.list.length;
  const acc = Math.round(s.right / total * 100);
  let h = `<div class="qcard result"><div class="big">${acc}%</div>
            <div class="lbl">本轮 ${total} 题 ✦ 答对 ${s.right} 题</div>
            <div class="row"><div class="g"><b>${s.right}</b>答对</div><div class="r"><b>${total-s.right}</b>答错</div></div>`;
  if (acc >= 90) h += '<div style="color:var(--ok);font-size:15px">很棒 ✦ 这个掌握得不错</div>';
  else if (acc >= 70) h += '<div style="color:var(--warn);font-size:15px">还行 ✦ 错的那几题再刷一遍</div>';
  else h += '<div style="color:var(--bad);font-size:15px">先把错题重练一遍吧</div>';
  h += `<button onclick="start('${s.mode}')">再来一轮</button>`;
  h += `<button class="sec" onclick="goHome()">回首页</button></div>`;
  app.innerHTML = h;
  progWrap.style.display = 'none';
}

/* ══════════ 代码实操题 ══════════ */
let pyodide = null;
let pyReady = false;

async function ensurePyodide(){
  if (pyodide) return pyodide;
  if (typeof loadPyodide !== 'function') throw new Error('Pyodide 脚本没加载成功（可能被网络拦截）');
  const idx = window.__PY_IDX || window.__PY_CDNS[0];
  pyodide = await loadPyodide({ indexURL: idx });
  return pyodide;
}

const RUNNER = `
import sys, io, json, traceback

def _run(user_code, tests_json, mode):
    tests = json.loads(tests_json)
    result = {"mode": mode, "rows": [], "error": None, "base_output": ""}

    # 1) 先执行用户代码 · 捕获输出
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    g = {}
    try:
        exec(user_code, g)
    except SyntaxError as e:
        sys.stdout = old
        result["error"] = "语法错误（第 %s 行）: %s" % (e.lineno, e.msg)
        return json.dumps(result, ensure_ascii=False)
    except Exception as e:
        sys.stdout = old
        result["error"] = "运行报错: %s: %s" % (type(e).__name__, e)
        return json.dumps(result, ensure_ascii=False)
    sys.stdout = old
    result["base_output"] = buf.getvalue()

    if mode == "all":
        got = result["base_output"].strip()
        result["rows"].append({"call": "完整输出", "got": got, "expect": tests[0], "ok": got == tests[0]})
        return json.dumps(result, ensure_ascii=False)

    if mode == "contains":
        out = result["base_output"]
        for kw in tests:
            result["rows"].append({"call": "包含 " + kw, "got": "找到" if kw in out else "没找到", "expect": kw, "ok": kw in out})
        return json.dumps(result, ensure_ascii=False)

    # mode == tests · 逐个跑测试用例
    for item in tests:
        call, expect = item[0], item[1]
        buf2 = io.StringIO()
        sys.stdout = buf2
        try:
            exec(call, g)
            got = buf2.getvalue().strip()
            ok = (got == expect.strip())
            sys.stdout = old
            result["rows"].append({"call": call.replace(chr(10), " ; "), "got": got, "expect": expect, "ok": ok})
        except Exception as e:
            sys.stdout = old
            result["rows"].append({"call": call.replace(chr(10), " ; "), "got": "报错: %s: %s" % (type(e).__name__, e), "expect": expect, "ok": False})
    return json.dumps(result, ensure_ascii=False)
`;

async function runCodeTests(){
  const q = session.list[session.idx];
  const editor = document.getElementById('editor');
  const results = document.getElementById('testResults');
  const status = document.getElementById('pyStatus');
  const userCode = editor.value;

  if (!userCode.trim()){ alert('先写点代码吧'); return; }

  // 显示加载状态
  results.innerHTML = '<div style="color:var(--dim);font-size:13.5px">⏳ 正在准备 Python 环境（首次约 10-30 秒）...</div>';
  status.className = 'pyodide-status';
  status.textContent = '⏳ 加载 Python 运行时...';

  try {
    const py = await ensurePyodide();
    status.className = 'pyodide-status ready';
    status.textContent = '✅ Python 3.12 已就绪';

    // 准备测试数据
    let mode, tests;
    if (q.tests){
      mode = 'tests';
      tests = JSON.stringify(q.tests);
    } else if (q.expect_all_at_once !== undefined){
      mode = 'all';
      tests = JSON.stringify([q.expect_all_at_once]);
    } else if (q.expect_contains){
      mode = 'contains';
      tests = JSON.stringify(q.expect_contains);
    } else {
      results.innerHTML = '<div style="color:var(--bad)">这道题没有配置测试用例</div>';
      return;
    }

    await py.runPythonAsync(RUNNER);
    const resJson = py.globals.get('_run')(
      userCode,
      tests,
      mode
    );
    const res = JSON.parse(resJson);

    if (res.error){
      results.innerHTML = `<div class="testrow fail"><div class="call">运行出错</div>
        <div class="kv got">${esc(res.error)}</div></div>`;
      status.textContent = '❌ 运行出错';
      status.className = 'pyodide-status err';
      return;
    }

    // 渲染结果
    let h = '<div class="testlist">';
    let passN = 0;
    res.rows.forEach(r => {
      if (r.ok) passN++;
      h += `<div class="testrow ${r.ok ? 'pass' : 'fail'}">
              <div class="call">${r.ok ? '✅' : '❌'} ${esc(r.call)}</div>
              <div class="kv">实际: <span class="${r.ok ? '' : 'got'}">${esc(r.got)}</span></div>
              <div class="kv">期望: <span class="exp">${esc(r.expect)}</span></div>
            </div>`;
    });
    h += '</div>';
    results.innerHTML = h;

    const total = res.rows.length;
    if (passN === total){
      status.className = 'pyodide-status ready';
      status.textContent = `🎉 全部通过（${passN}/${total}）`;
      store.codeDone = store.codeDone || {};
      store.codeDone[q.oi] = true;
      store.stats.right++;
      save();
      // 显示优化建议
      const tip = document.getElementById('tipBox');
      if (tip) tip.classList.add('show');
    } else {
      status.className = 'pyodide-status err';
      status.textContent = `通过 ${passN} / ${total} 个用例`;
      store.codeDone = store.codeDone || {};
      delete store.codeDone[q.oi];
      save();
    }
  } catch (e) {
    status.className = 'pyodide-status err';
    status.textContent = '❌ ' + e.message;
    results.innerHTML = `<div class="testrow fail"><div class="kv got">${esc(e.message)}</div>
      <div class="kv" style="color:var(--dim);margin-top:6px">如果一直失败，可能是 CDN 被拦截 ✦ 可以改用「看参考答案」自学</div></div>`;
  }
}

function showRef(){
  const tip = document.getElementById('tipBox');
  if (tip) tip.classList.add('show');
  const box = document.getElementById('refBox');
  if (box) box.style.display = 'block';
}

function renderCodeQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderCodeResult();
  const q = s.list[s.idx];

  let h = `<div class="qcard">
    <div class="qtype">代码实操　第 ${s.idx+1} / ${s.list.length} 题　难度 ${'⭐'.repeat(q.level)}</div>
    <div class="qtext" style="font-size:17px;font-weight:600;margin-bottom:12px">${esc(q.title)}</div>
    <div style="background:var(--card2);border-radius:10px;padding:14px;font-size:14.5px;line-height:1.8;white-space:pre-wrap">${esc(q.desc)}</div>
    <div style="margin-top:16px;font-size:13px;color:var(--dim);margin-bottom:6px">你的代码：</div>
    <textarea class="editor" id="editor" spellcheck="false">${esc(q.starter)}</textarea>
    <div class="actions">
      <button class="btn-run" onclick="runCodeTests()">▶ 运行测试</button>
      <button class="btn-ref" onclick="showRef()">看参考答案</button>
    </div>
    <div class="pyodide-status" id="pyStatus">首次运行需要加载 Python 运行时（约 10-30 秒）</div>
    <div id="testResults"></div>
    <div class="tipbox" id="tipBox">
      <h4>💡 优化建议</h4>
      <ul>${q.tips.map(t => '<li>' + esc(t) + '</li>').join('')}</ul>
    </div>
    <div id="refBox" style="display:none;margin-top:14px">
      <div style="font-size:13px;color:var(--py1);margin-bottom:6px">参考答案：</div>
      <div class="codeblock">${hlPy(q.ref)}</div>
    </div>
    <div class="actions" id="nextWrap">
      <button class="btn-self" onclick="nextCodeQ()">下一题 →</button>
    </div>
  </div>`;
  app.innerHTML = h;
}

function nextCodeQ(){ session.idx++; renderCodeQ(); }

function renderCodeResult(){
  const s = session;
  let h = `<div class="qcard result"><div class="big">${s.list.length}</div>
            <div class="lbl">实操题全部过了一遍</div>
            <button onclick="start('code')">再刷一轮</button>
            <button class="sec" onclick="goHome()">回首页</button></div>`;
  app.innerHTML = h;
}

/* 重写 start，让 code 走自己的渲染 */
const _start = start;
start = function(mode){
  _start(mode);
  if (mode === 'code') renderCodeQ();
};

const _renderQ = renderQ;
renderQ = function(){
  if (session && session.list[session.idx] && session.list[session.idx].type === 'code'){
    return renderCodeQ();
  }
  _renderQ();
};

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  if (!session || !session.list) return;
  const q = session.list[session.idx];
  if (!q) return;
  if (q.type === 'judge'){
    if (e.key === '1') answerTF('对');
    if (e.key === '2') answerTF('错');
  }
  if (q.type === 'choice' && !session.submitted){
    const L = 'ABCDEF';
    const i = L.indexOf(e.key.toUpperCase());
    if (i >= 0 && i < q.opts.length) answerChoice(i);
    if (e.key === 'Enter') submitChoice();
  }
});

renderHome();
