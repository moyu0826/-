月、%d 日、%H 时(24)、%M 分、%S 秒、%A 星期几、%B 月份名。"},{"t":"h","c":"字符串转日期（strptime）"},{"t":"code","c":"import datetime\n\ns = \"2026-10-28\"\nd = datetime.datetime.strptime(s, \"%Y-%m-%d\")\nprint(d)             # 2026-10-28 00:00:00\nprint(type(d))       # <class 'datetime.datetime'>\nprint(d.year)        # 2026"},{"t":"warn","c":"strptime 的格式串必须和字符串完全一致！少一个 - 就报错 · 这是最容易踩的坑。"},{"t":"h","c":"日期加减（timedelta）"},{"t":"code","c":"import datetime\n\ntoday = datetime.date.today()\nprint(today)                              # 2026-10-28\n\nprint(today + datetime.timedelta(days=7))     # 一周后\nprint(today - datetime.timedelta(days=30))    # 30 天前\nprint(today + datetime.timedelta(weeks=2))    # 两周后"},{"t":"h","c":"⭐ 算两个日期差多少天"},{"t":"code","c":"import datetime\n\nd1 = datetime.date(2026, 10, 28)\nd2 = datetime.date(2027, 6, 12)\n\ndiff = d2 - d1\nprint(diff)            # 227 days, 0:00:00\nprint(diff.days)       # 227    ⭐ 只要天数\nprint(diff.total_seconds())   # 秒数"},{"t":"tip","c":"两个日期相减得到 timedelta 对象 · 用 .days 取天数。算倒计时、算年龄、算复习剩余天数都靠它。"},{"t":"h","c":"实战：算英语四级倒计时"},{"t":"code","c":"import datetime\n\nexam = datetime.date(2027, 6, 12)     # 四级考试日期\ntoday = datetime.date.today()\ndays = (exam - today).days\n\nif days > 0:\n    print(f\"距离四级还有 {days} 天\")\n    print(f\"也就是 {days // 7} 周零 {days % 7} 天\")\nelse:\n    print(\"考试已经过了\")"},{"t":"h","c":"实战：生成日期列表"},{"t":"code","c":"import datetime\n\nstart = datetime.date(2026, 10, 1)\nfor i in range(7):\n    d = start + datetime.timedelta(days=i)\n    print(d.strftime(\"%m月%d日 %A\"))"},{"t":"h","c":"三个常用类"},{"t":"code","c":"import datetime\n\n# date      只日期（2026-10-28）\nd = datetime.date(2026, 10, 28)\n\n# time      只时间（14:30:00）\nt = datetime.time(14, 30)\n\n# datetime  日期 + 时间\ndt = datetime.datetime(2026, 10, 28, 14, 30)\n\n# timedelta 时间差（一段时间）\ntd = datetime.timedelta(days=7, hours=3)"},{"t":"warn","c":"date 和 datetime 不能直接混算 · 要统一类型。比如 date.today() + timedelta 可以，但 datetime.now() 和 date 相减会报错。"}]},{"id":24,"title":"文件与文件夹管理（os / pathlib）","sub":"第二十四课 · 教材 6.4","blocks":[{"t":"p","c":"前面用 open() 读写单个文件。但真实项目里经常要：新建文件夹、列目录内容、删文件、判断文件在不在、批量重命名 —— 这些用 os 或 pathlib。"},{"t":"h","c":"两个库：os 和 pathlib"},{"t":"code","c":"# os      老式写法，用字符串路径\nimport os\n\n# pathlib 现代写法，用 Path 对象 ⭐ 推荐\nfrom pathlib import Path"},{"t":"note","c":"pathlib 是 Python 3.4+ 引入的现代写法 · 比 os 更直观（path / \"子目录\" 就能拼路径）。新代码建议用 pathlib。"},{"t":"h","c":"常用操作（pathlib 版 ⭐）"},{"t":"code","c":"from pathlib import Path\n\np = Path(\"test.txt\")\nprint(p.exists())        # False   存在吗\nprint(p.is_file())       # 是文件吗\nprint(p.is_dir())        # 是文件夹吗\nprint(p.name)            # test.txt  文件名\nprint(p.stem)            # test      不带扩展名\nprint(p.suffix)          # .txt      扩展名\nprint(p.parent)          # .         所在目录"},{"t":"h","c":"路径拼接"},{"t":"code","c":"from pathlib import Path\n\n# ✅ pathlib 写法（自动处理分隔符）\ndata_dir = Path(\"D:/空白文件夹/学习笔记\")\nfile = data_dir / \"python.txt\"\nprint(file)      # D:\\空白文件夹\\学习笔记\\python.txt\n\n# ❌ 字符串拼接容易错\nbad = \"D:/空白文件夹/学习笔记\" + \"/\" + \"python.txt\""},{"t":"tip","c":"用 / 号拼路径是 pathlib 的特色 · 它会自动处理 Windows 的反斜杠和 Linux 的斜杠 · 跨平台安全。"},{"t":"h","c":"创建和删除"},{"t":"code","c":"from pathlib import Path\n\n# 创建文件夹（exist_ok=True 表示已存在也不报错）\nPath(\"新文件夹\").mkdir(exist_ok=True)\n\n# 创建多级\nPath(\"a/b/c\").mkdir(parents=True, exist_ok=True)\n\n# 删除文件\nPath(\"test.txt\").unlink(missing_ok=True)\n\n# 删除空文件夹\nPath(\"新文件夹\").rmdir()"},{"t":"warn","c":"rmdir() 只能删【空】文件夹 · 有文件会报错。要删整棵目录树用 shutil.rmtree() · 但那很危险 ⚠️ 删之前一定确认路径！"},{"t":"h","c":"遍历文件夹"},{"t":"code","c":"from pathlib import Path\n\nd = Path(\".\")\n\n# 只列当前层\nfor f in d.iterdir():\n    print(f.name, \"文件夹\" if f.is_dir() else \"文件\")\n\n# 递归列出所有文件\nfor f in d.rglob(\"*.py\"):\n    print(f)          # 所有 .py 文件（包括子目录里的）"},{"t":"h","c":"复制和移动"},{"t":"code","c":"import shutil\nfrom pathlib import Path\n\nsrc = Path(\"a.txt\")\ndst = Path(\"b.txt\")\n\nshutil.copy(src, dst)      # 复制文件\nshutil.move(str(src), str(dst))   # 移动/重命名\nshutil.copytree(\"src目录\", \"dst目录\")   # 复制整个目录"},{"t":"h","c":"实战：批量重命名"},{"t":"code","c":"from pathlib import Path\n\nd = Path(\"图片\")\nfor i, f in enumerate(d.glob(\"*.jpg\"), 1):\n    new_name = d / f\"pic_{i:03d}.jpg\"\n    f.rename(new_name)\n    print(f\"{f.name} → {new_name.name}\")"},{"t":"out","c":"a.jpg → pic_001.jpg\nb.jpg → pic_002.jpg"},{"t":"h","c":"常用方法速查"},{"t":"code","c":"# pathlib.Path 常用\n.exists() / .is_file() / .is_dir()\n.name / .stem / .suffix / .parent\n.mkdir(parents=True, exist_ok=True)\n.unlink() / .rmdir()\n.iterdir() / .glob(\"*.txt\") / .rglob(\"*.py\")\n.read_text(encoding=\"utf-8\")      # 一次读完\n.write_text(\"内容\", encoding=\"utf-8\")   # 一次写完\n.rename(新路径)"},{"t":"tip","c":"Path.read_text() 和 Path.write_text() 是捷径 · 不用写 with open() 的 4 行 · 一行搞定简单读写。"},{"t":"h","c":"实战：找出所有大文件"},{"t":"code","c":"from pathlib import Path\n\nfor f in Path(\".\").rglob(\"*\"):\n    if f.is_file() and f.stat().st_size > 10 * 1024 * 1024:   # > 10MB\n        mb = f.stat().st_size / 1024 / 1024\n        print(f\"{mb:.1f} MB  {f}\")"}]},{"id":25,"title":"二进制文件与 pickle","sub":"第二十五课 · 教材 6.3","blocks":[{"t":"p","c":"前面读写的都是「文本文件」（txt / csv / py）。但图片、音频、视频、Excel 都是「二进制文件」—— 不能按行读，要按字节读。"},{"t":"h","c":"文本模式 vs 二进制模式"},{"t":"code","c":"# 文本模式（默认）， 会自动处理编码\nwith open(\"a.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()          # 返回 str\n\n# 二进制模式 · 加 b · 不做任何编码转换\nwith open(\"a.jpg\", \"rb\") as f:\n    data = f.read()          # 返回 bytes"},{"t":"note","c":"带 b 就是二进制模式：rb 读、wb 写、ab 追加。读写内容是 bytes 类型而不是 str，而且【不能指定 encoding】。"},{"t":"h","c":"复制一个二进制文件"},{"t":"code","c":"# 复制图片\nwith open(\"原图.jpg\", \"rb\") as src:\n    data = src.read()\n\nwith open(\"副本.jpg\", \"wb\") as dst:\n    dst.write(data)\nprint(f\"复制了 {len(data)} 字节\")"},{"t":"tip","c":"大文件不要一次性 read() · 内存会爆 · 应该一块一块读（每次 1MB），下面有写法。"},{"t":"h","c":"分块读写大文件"},{"t":"code","c":"CHUNK = 1024 * 1024      # 1 MB 一块\n\nwith open(\"大视频.mp4\", \"rb\") as src, open(\"副本.mp4\", \"wb\") as dst:\n    while True:\n        chunk = src.read(CHUNK)\n        if not chunk:\n            break\n        dst.write(chunk)\nprint(\"复制完成\")"},{"t":"h","c":"⭐ pickle：直接存 Python 对象"},{"t":"code","c":"import pickle\n\ndata = {\n    \"name\": \"小明\",\n    \"scores\": [85, 92, 78],\n    \"info\": {\"age\": 18}\n}\n\n# 存（序列化）\nwith open(\"data.pkl\", \"wb\") as f:\n    pickle.dump(data, f)\n\n# 读（反序列化）\nwith open(\"data.pkl\", \"rb\") as f:\n    loaded = pickle.load(f)\nprint(loaded)        # 原样的字典！"},{"t":"out","c":"{'name': '小明', 'scores': [85, 92, 78], 'info': {'age': 18}}"},{"t":"note","c":"pickle 能把任何 Python 对象（列表、字典、类实例）原样存进文件，再原样读回来。注意必须用二进制模式（wb / rb）。"},{"t":"warn","c":"⚠️ pickle 只能读【自己生成的文件】， 别人给你的 .pkl 绝对不要直接 load · 它可以在加载时执行任意代码（安全风险极高）⚠️"},{"t":"h","c":"pickle vs json"},{"t":"code","c":"import pickle, json\n\ndata = {\"name\": \"小明\", \"scores\": [85, 92]}\n\n# json：纯文本 · 人能看懂 · 跨语言 · 只能存基本类型\nwith open(\"d.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, ensure_ascii=False)\n\n# pickle：二进制 · 人看不懂 · 只给 Python · 能存任意对象\nwith open(\"d.pkl\", \"wb\") as f:\n    pickle.dump(data, f)"},{"t":"tip","c":"选哪个？要给别人看 / 跨语言 → json。只在自己 Python 程序里存中间数据 → pickle。"},{"t":"h","c":"实战：统计文件大小"},{"t":"code","c":"from pathlib import Path\n\np = Path(\"视频.mp4\")\nsize = p.stat().st_size\nprint(f\"{size} 字节 = {size/1024/1024:.2f} MB\")"},{"t":"h","c":"常见二进制文件格式"},{"t":"code","c":"# 图片  .jpg .png .bmp .gif\n# 音频  .mp3 .wav .flac\n# 视频  .mp4 .avi .mkv\n# 压缩  .zip .rar .7z\n# 文档  .docx .xlsx .pdf\n# 数据  .pkl .npy .h5\n\n# 后三个.docx/.xlsx 本质是 zip 压缩包\n# 可以用 zipfile 库打开看内部结构"}]},{"id":26,"title":"类的继承：站在别人的肩膀上","sub":"第二十六课 · 教材 7.3","blocks":[{"t":"p","c":"你写了一个 Student 类，现在要写一个「班长」类 —— 它有 Student 的全部能力，还多一个「管理班级」的方法。复制粘贴代码？不 · 用继承。"},{"t":"h","c":"最小例子"},{"t":"code","c":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def show(self):\n        print(f\"{self.name}：{self.score} 分\")\n\n\nclass Monitor(Student):        # ⭐ 括号里写父类名\n    def manage(self):\n        print(f\"{self.name} 在管理班级\")\n\n\nm = Monitor(\"小明\", 95)\nm.show()        # 继承来的方法 ✅\nm.manage()      # 自己新增的方法 ✅"},{"t":"out","c":"小明：95 分\n小明 在管理班级"},{"t":"note","c":"class 子类(父类): 就够了。子类自动拥有父类的所有属性和方法，还能加自己的。Monitor 不用重写 __init__ 和 show。"},{"t":"h","c":"super()：调用父类的方法"},{"t":"code","c":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n\nclass Monitor(Student):\n    def __init__(self, name, score, duty):\n        super().__init__(name, score)     # ⭐ 先让父类初始化\n        self.duty = duty                  # 再加自己的属性\n\n    def show(self):\n        super().show()                    # 先调父类的 show\n        print(f\"职务：{self.duty}\")        # 再加自己的\n\n\nm = Monitor(\"小明\", 95, \"班长\")\nm.show()"},{"t":"out","c":"小明：95 分\n职务：班长"},{"t":"tip","c":"super() 是「调用父类的同名方法」。子类要重写 __init__ 时，几乎总要先 super().__init__(...) 让父类把基础属性设好。"},{"t":"h","c":"方法重写（Override）"},{"t":"code","c":"class Animal:\n    def speak(self):\n        print(\"...\")\n\n\nclass Dog(Animal):\n    def speak(self):          # 重写父类方法\n        print(\"汪汪\")\n\n\nclass Cat(Animal):\n    def speak(self):\n        print(\"喵喵\")\n\n\nfor a in [Dog(), Cat(), Animal()]:\n    a.speak()"},{"t":"out","c":"汪汪\n喵喵\n..."},{"t":"note","c":"子类定义了同名方法就会「盖住」父类的。这叫多态 —— 同一个 speak()，不同对象有不同表现。"},{"t":"h","c":"判断类型的两个函数"},{"t":"code","c":"class Animal: pass\nclass Dog(Animal): pass\n\nd = Dog()\n\nprint(isinstance(d, Dog))       # True   d 是 Dog 的实例\nprint(isinstance(d, Animal))    # True   ⭐ d 也是 Animal 的实例（继承关系）\nprint(type(d) == Dog)           # True\nprint(type(d) == Animal)        # False  精确类型不同"},{"t":"tip","c":"判断类型用 isinstance() 而不是 type() == · 因为 isinstance 会考虑继承关系，type() 不会。"},{"t":"h","c":"多重继承（了解即可）"},{"t":"code","c":"class A:\n    def hello(self): print(\"A\")\n\nclass B:\n    def hello(self): print(\"B\")\n\nclass C(A, B):\n    pass\n\nc = C()\nc.hello()       # A   ← 按括号里的顺序，先找到 A 的"},{"t":"warn","c":"多重继承容易搞出「菱形问题」（同一个方法从两条路径继承）， 实际项目里少用 · 大部分情况用「组合」（把对象当属性）比继承更清楚。"},{"t":"h","c":"继承 vs 组合"},{"t":"code","c":"# 继承：\"是一个\" 关系\n#   Dog is an Animal    ✅ 该用继承\n\n# 组合：\"有一个\" 关系\n#   Car has an Engine   ✅ 该用组合\n\nclass Engine:\n    def start(self): print(\"引擎启动\")\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()      # ⭐ 把 Engine 当属性\n    def start(self):\n        self.engine.start()\n        print(\"车开走了\")"},{"t":"note","c":"判断口诀：「是（is-a）」用继承 ，「有（has-a）」用组合。Car 不是 Engine，所以用组合。"},{"t":"h","c":"完整例子：员工与经理"},{"t":"code","c":"class Employee:\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n\n    def work(self):\n        print(f\"{self.name} 在工作\")\n\n    def info(self):\n        return f\"{self.name}（月薪 {self.salary}）\"\n\n\nclass Manager(Employee):\n    def __init__(self, name, salary, team):\n        super().__init__(name, salary)\n        self.team = team\n\n    def work(self):\n        super().work()\n        print(f\"  正在管理 {len(self.team)} 个人\")\n\n\nm = Manager(\"老王\", 20000, [\"小明\", \"小红\"])\nm.work()\nprint(m.info())"},{"t":"out","c":"老王 在工作\n  正在管理 2 个人\n老王（月薪 20000）"}]},{"id":27,"title":"实战：智慧农业三大案例","sub":"第二十七课 · 教材第 8 章","blocks":[{"t":"p","c":"这一章把前面学的全串起来，用 3 个真实案例展示 Python 在农业领域的应用。案例代码需要第三方库，小程序里不能跑，但思路要懂。"},{"t":"h","c":"案例 1：中央一号文件词频统计"},{"t":"code","c":"import jieba\nfrom collections import Counter\n\n# 1) 读文件\ntext = open(\"一号文件.txt\", encoding=\"utf-8\").read()\n\n# 2) 中文分词（jieba 是第三方库，要 pip install jieba）\nwords = jieba.lcut(text)\n\n# 3) 过滤：去掉单字、去停用词\nstop = {\"的\", \"了\", \"和\", \"是\", \"在\", \"有\"}\nwords = [w for w in words if len(w) > 1 and w not in stop]\n\n# 4) 统计频率\ncounter = Counter(words)\nfor word, count in counter.most_common(20):\n    print(f\"{word}: {count}\")"},{"t":"out","c":"农业: 156\n农村: 142\n粮食: 98\n农民: 87\n..."},{"t":"note","c":"这就是「文本分析」的基本套路：读文本 → 分词 → 过滤 → 统计 → 排序。英文不用分词（空格天然分隔），中文要 jieba。"},{"t":"h","c":"案例 2：农业数据爬取与可视化"},{"t":"code","c":"import requests\nimport matplotlib.pyplot as plt\n\n# 1) 爬取数据\nurl = \"https://example.com/api/price\"\nresp = requests.get(url, timeout=10)\ndata = resp.json()\n\n# 2) 提取x/y\nmonths = [d[\"month\"] for d in data]\nprices = [d[\"price\"] for d in data]\n\n# 3) 画折线图 ⚠️ 中文要设字体\nplt.rcParams[\"font.sans-serif\"] = [\"SimHei\"]\nplt.rcParams[\"axes.unicode_minus\"] = False\n\nplt.plot(months, prices, marker=\"o\")\nplt.title(\"农产品价格走势\")\nplt.xlabel(\"月份\")\nplt.ylabel(\"价格（元/斤）\")\nplt.grid(True)\nplt.show()"},{"t":"warn","c":"matplotlib 默认不支持中文 · 不设 font.sans-serif 中文会变方块 ⚠️ Windows 用 SimHei，Mac 用 PingFang SC。"},{"t":"h","c":"爬虫的三步走"},{"t":"code","c":"import requests\nfrom bs4 import BeautifulSoup\n\n# ① 发请求拿 HTML\nresp = requests.get(\"https://example.com\", headers={\n    \"User-Agent\": \"Mozilla/5.0 (Windows NT 10.0) Chrome/130.0\"\n}, timeout=10)\n\n# ② 解析\nsoup = BeautifulSoup(resp.text, \"html.parser\")\ntitles = soup.find_all(\"h2\")\n\n# ③ 提取\nfor t in titles:\n    print(t.get_text(strip=True))"},{"t":"tip","c":"爬虫一定要加 User-Agent（否则被拒），一定要设 timeout（否则卡死），一定要控制频率（别把人家服务器打挂 · 这是法律红线）。"},{"t":"h","c":"案例 3：鸢尾花分类（机器学习入门）"},{"t":"code","c":"from sklearn.datasets import load_iris\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.neighbors import KNeighborsClassifier\n\n# 1) 加载数据集（150 朵花，4 个特征，3 个品种）\nX, y = load_iris(return_X_y=True)\n\n# 2) 划分训练集/测试集\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.3, random_state=42)\n\n# 3) 训练模型（K 近邻）\nmodel = KNeighborsClassifier(n_neighbors=3)\nmodel.fit(X_train, y_train)\n\n# 4) 评估\nscore = model.score(X_test, y_test)\nprint(f\"准确率：{score:.2%}\")"},{"t":"out","c":"准确率：100.00%"},{"t":"note","c":"机器学习的最小套路：准备数据 → 划分训练/测试 → 选模型 → fit 训练 → score 评估。鸢尾花数据集太小，随便都是 95%+ 准确率，是入门教学用的。"},{"t":"h","c":"三个案例的共同点"},{"t":"code","c":"# 都是「输入 → 处理 → 输出」的流程\n#\n# 案例1: 文本 → 分词统计 → 词频榜\n# 案例2: 网页 → 解析提取 → 图表\n# 案例3: 数据 → 训练模型 → 预测\n#\n# 用的都是前面学的基础：\n#   文件读写、列表、字典、循环、函数、类\n# 只是换成了第三方库来干活"},{"t":"h","c":"这些库怎么装"},{"t":"code","c":"# 在命令行（不是 Python 里）执行：\n#\n# pip install requests          爬虫\n# pip install beautifulsoup4    解析 HTML\n# pip install jieba             中文分词\n# pip install matplotlib        画图\n# pip install numpy             数值计算\n# pip install pandas            表格处理\n# pip install scikit-learn      机器学习\n#\n# 国内慢的话加镜像：\n# pip install -i https://pypi.tuna.tsinghua.edu.cn/simple 包名"},{"t":"warn","c":"pip install 如果报「不是内部或外部命令」→ Python 没加到 PATH · 用 python -m pip install 包名 代替。"}]},{"id":28,"title":"附录：调试 / 第三方库 / 打包","sub":"第二十八课 · 教材附录 1-3","blocks":[{"t":"p","c":"写代码的时间有 20% 在写，80% 在调 bug。这一课讲怎么高效排错，顺便说清楚「第三方库」和「打包成 exe」这两件事。"},{"t":"h","c":"读报错信息（最重要）"},{"t":"code","c":"Traceback (most recent call last):\n  File \"demo.py\", line 3, in <module>\n    print(1 / 0)\nZeroDivisionError: division by zero"},{"t":"p","c":"读法：① 最后一行是错误类型和原因 ② 倒数第二行是出错的那行代码 ③ 往上是调用链（谁调了谁）。★ 永远先看最后一行。"},{"t":"note","c":"新手最大的问题不是不会写，是【不看报错】， 直接来问。其实报错信息已经把「哪一行、什么错」写清楚了 ✅"},{"t":"h","c":"六大常见错误对照表"},{"t":"code","c":"# SyntaxError          语法错：少冒号、少括号、引号不配对\n# IndentationError     缩进错：多了或少了空格\n# NameError            名字错：变量名打错，或用了没定义的\n# TypeError            类型错：str + int、None + 1\n# ValueError           值错：int(\"abc\")\n# IndexError           下标越界：列表只有 3 个却取 [5]\n# KeyError             字典没这个键\n# AttributeError       对象没这个属性/方法"},{"t":"h","c":"print 调试法（最原始但最有用）"},{"t":"code","c":"def calc(a, b):\n    print(f\"[调试] a={a}, b={b}\")      # 加这句看输入\n    result = a / b\n    print(f\"[调试] result={result}\")    # 加这句看中间结果\n    return result\n\ncalc(10, 2)"},{"t":"tip","c":"在怀疑出错的地方插 print，打印变量值。简单粗暴但 90% 的 bug 都能靠这个定位。"},{"t":"h","c":"断点调试（VS Code / PyCharm）"},{"t":"code","c":"# 1) 在行号左边点一下 · 出现红点（断点）\n# 2) 按 F5 启动调试\n# 3) 程序会停在那行\n# 4) 鼠标悬停变量看值\n# 5) F10 单步跳过 / F11 单步进入 / F5 继续\n#\n# 优点：不用改代码，能看所有变量的值"},{"t":"h","c":"assert 断言（自检）"},{"t":"code","c":"def sqrt(x):\n    assert x >= 0, \"不能对负数开方\"    # 条件为假就抛 AssertionError\n    return x ** 0.5\n\nprint(sqrt(9))     # 3.0\nsqrt(-1)           # ❌ AssertionError: 不能对负数开方"},{"t":"note","c":"assert 是用来「自检」的：假设这里一定满足某条件，不满足就立刻报错。写测试时常用。"},{"t":"h","c":"第三方库是什么"},{"t":"code","c":"# Python 的生态：\n#   标准库    装了 Python 就有（math / os / datetime / json）\n#   第三方库  要 pip install 才有\n#\n# 常见的：\n#   requests     发 HTTP 请求（爬虫）\n#   numpy        数值数组（比 list 快几十倍）\n#   pandas       表格数据分析\n#   matplotlib   画图\n#   flask        web 网站（后端）\n#   django       web 框架（大项目）\n#   pygame       游戏开发\n#   opencv       图像处理\n#   scikit-learn 机器学习"},{"t":"h","c":"pip 常用命令"},{"t":"code","c":"# 装\npip install requests\n\n# 装指定版本\npip install requests==2.31.0\n\n# 升级\npip install --upgrade requests\n\n# 卸载\npip uninstall requests\n\n# 看已装的\npip list\n\n# 导出依赖清单\npip freeze > requirements.txt\n\n# 按清单装（别人拿到你的项目时）\npip install -r requirements.txt"},{"t":"tip","c":"国内 pip 慢的话，加清华镜像：pip install -i https://pypi.tuna.tsinghua.edu.cn/simple 包名。想永久设置：pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple"},{"t":"h","c":"打包成 exe（让别人不装 Python 也能用）"},{"t":"code","c":"# 用 PyInstaller（要 pip install pyinstaller）\n#\n# 最简单的打包：\n#   pyinstaller -F 你的程序.py\n#\n# 参数说明：\n#   -F  打包成单个 exe 文件\n#   -w  不显示控制台黑窗口（GUI 程序用）\n#   -i  图标   pyinstaller -F -w -i icon.ico main.py\n#\n# 结果在 dist 文件夹里"},{"t":"warn","c":"PyInstaller 打出来的 exe 体积很大（几十 MB 起步）， 因为要把整个 Python 解释器塞进去。而且被杀毒软件误报很常见 ⚠️ 加数字签名能缓解。"},{"t":"h","c":"虚拟环境（项目隔离）"},{"t":"code","c":"# 为什么不直接全局装？\n#   项目 A 要 requests 2.0，项目 B 要 3.0 · 冲突\n#\n# 解决：每个项目一个独立环境\n\n# 创建\npython -m venv myenv\n\n# 激活（Windows）\nmyenv\\Scripts\\activate\n\n# 激活（Mac/Linux）\nsource myenv/bin/activate\n\n# 退出\ndeactivate"},{"t":"note","c":"看到命令行前面多了 (myenv) 就是激活成功了。以后 pip install 都只装在这一环境里 · 不影响全局 ✅"},{"t":"h","c":"排错心态"},{"t":"code","c":"# 1) 别慌 · 报错是正常的，程序员每天都在看报错\n# 2) 从最后一行读起\n# 3) 把报错信息完整复制去搜索\n# 4) 用 print 或断点看变量值\n# 5) 把问题最小化：注释掉一半代码，看还报不报错\n# 6) 实在不行换个思路重写那一段"},{"t":"tip","c":"调试的核心是「缩小范围」：从一大段代码里找出真正出问题的那几行。二分法最快 —— 注释掉一半，还报错就在另一半里。"}]}];

function renderBlock(b){

  switch (b.t) {
    case 'h':    return `<div class="nb-h">${esc(c)}</div>`;
    case 'code': return `<pre class="nb-code">${hlPy(c)}</pre>`;
    case 'out':  return `<div class="nb-out"><b>运行结果</b><pre>${esc(c)}</pre></div>`;
    case 'tip':  return `<div class="nb-tip">💡 ${esc(c)}</div>`;
    case 'warn': return `<div class="nb-warn">⚠️ ${esc(c)}</div>`;

  progWrap.style.display = 'none';

function openLevels(){
  titleEl.textContent = '🚩 闯关模式';
  backBtn.style.display = 'block';
  progWrap.style.display = 'none';

  let h = '';
  const done = store.levelDone || {};
  let passedCount = 0;
  LEVELS.forEach(lv => {
    const passed = !!done[lv.id];
    // 解锁条件：第 1 关永远开；其他关需要上一关通过
    const unlocked = (lv.id === 1) || !!done[lv.id - 1];
    if (passed) passedCount++;
    const n = lv.judge.length + lv.choice.length + lv.fill.length + lv.read.length;
    const cls = passed ? 'levelitem passed' : (unlocked ? 'levelitem' : 'levelitem locked');
    const click = unlocked ? `onclick="startLevel(${lv.id})"` : '';
    h += `<div class="${cls}" ${click}>
            <span class="lnum">${passed ? '✓' : (unlocked ? lv.id : '🔒')}</span>
            <span class="lt">
              <b>${esc(lv.name)}</b>
              <small>${esc(lv.topic)}　·　${n} 题　·　通过线 ${lv.pass}%</small>
            </span>
            <span class="lstate ${passed ? 'ok' : 'lock'}">${passed ? '已通关' : (unlocked ? '未挑战' : '未解锁')}</span>
          </div>`;
  });

  const top = `<div class="qcard" style="padding:16px 17px;text-align:center">
                 <div style="font-size:15px;color:var(--navy);font-weight:600;margin-bottom:6px">
                   已通关 ${passedCount} / ${LEVELS.length} 关

                   每关 ${LEVELS[0].pass}% 以上算通过 ✦ 通过才解锁下一关

  app.innerHTML = top + h;
}

function startLevel(id){
  const L = LEVELS.find(x => x.id === id);
  if (!L) return;
  const list = [];
  L.judge.forEach(i => { if (DATA.judge[i]) list.push({...DATA.judge[i], type:'judge', oi:i}); });
  L.choice.forEach(i => { if (DATA.choice[i]) list.push({...DATA.choice[i], type:'choice', oi:i}); });
  L.fill.forEach(i => { if (DATA.fill[i]) list.push({...DATA.fill[i], type:'fill', oi:i}); });
  L.read.forEach(i => { if (DATA.read[i]) list.push({...DATA.read[i], type:'read', oi:i}); });
  if (!list.length){ alert('这一关没有题目'); return; }
  session = { list: shuffle(list), idx: 0, right: 0, mode: 'level', level: L };

  renderQ();
}

const AVATARS = ['\u{1F42B}','\u{1F433}','\u{1F42C}','\u{1F988}','\u{1F41F}','\u{1F991}','\u{1F419}','\u{2B50}','\u{1F30A}','\u{1F380}','\u{1F9C1}','\u{2728}'];
function avFor(name){
  let s = 0;
  for (let i = 0; i < name.length; i++) s += name.charCodeAt(i);
  return AVATARS[s % AVATARS.length];
}

function timeAgo(ts){
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  if (d < 86400 * 7) return Math.floor(d / 86400) + ' 天前';
  const dt = new Date(ts);
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}

  const liked = !!(store.liked && store.liked[m.id]);
  return `<div class="msgcard">
            <div class="msghead">
              <span class="av">` + avFor(m.name) + `</span>
              <span class="who"><b>` + esc(m.name) + `</b><small>` + timeAgo(m.time) + `</small></span>
            </div>
            <div class="msgbody">` + esc(m.text) + `</div>
            <div class="msgfoot">
              <span class="act ` + (liked ? 'liked' : '') + `" onclick="likeMsg('` + m.id + `')">` + (liked ? '\u2764\uFE0F' : '\u{1F90D}') + ` ` + (m.likes || 0) + `</span>
              <span class="act del" onclick="delMsg('` + m.id + `')">删除</span>
            </div>
          </div>`;
}

function postMsg(){
  const nameEl = document.getElementById('talkName');
  const msgEl = document.getElementById('talkMsg');
  const name = (nameEl.value || '').trim() || '游客';
  const text = (msgEl.value || '').trim();
  if (!text){ alert('先写点内容吧'); return; }
  store.myName = name;
  store.msgs = store.msgs || [];
  store.msgs.unshift({
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
    name: name, text: text, time: Date.now(), likes: 0
  });
  save();
  renderTalk();
}

function likeMsg(id){
  store.liked = store.liked || {};
  const m = (store.msgs || []).find(x => x.id === id);
  if (!m) return;
  if (store.liked[id]) { store.liked[id] = false; m.likes = Math.max(0, (m.likes || 0) - 1); }
  else { store.liked[id] = true; m.likes = (m.likes || 0) + 1; }
  save();
  renderTalk();
}

function delMsg(id){
  if (!confirm('删除这条留言？')) return;
  store.msgs = (store.msgs || []).filter(x => x.id !== id);
  save();
  renderTalk();
}

function resetAll(){
  if (!confirm('确定清空全部刷题记录？')) return;
  store = { wrong:{}, stats:{right:0,wrong:0}, codeDone:{} };
  save(); renderHome();
}

function start(mode){
  let list = [];
  if (mode === 'all'){
    list = shuffle([
      ...DATA.judge.map((x,i)=>({...x,type:'judge',oi:i})),
      ...DATA.choice.map((x,i)=>({...x,type:'choice',oi:i})),
      ...DATA.fill.map((x,i)=>({...x,type:'fill',oi:i})),
      ...DATA.read.map((x,i)=>({...x,type:'read',oi:i})),
    ]);
  } else if (mode === 'wrong'){
    for (const k of ['judge','choice','fill','read']){
      DATA[k].forEach((x,i)=>{ if (store.wrong[k+':'+i]) list.push({...x,type:k,oi:i}); });
    }
    list = shuffle(list);
  } else if (mode === 'code'){
    list = shuffle(DATA.code.map((x,i)=>({...x,type:'code',oi:i})));
  } else {
    list = shuffle(DATA[mode].map((x,i)=>({...x,type:mode,oi:i})));
  }
  if (!list.length){ alert('这个类别没有题目'); return; }
  session = { list, idx:0, right:0, mode };
  backBtn.style.display = 'block';
  progWrap.style.display = mode === 'code' ? 'none' : 'block';
  titleEl.textContent = mode === 'all' ? '全部混合' : (mode === 'wrong' ? '错题重练' : TYPES[mode].name);
  renderQ();
}

function updateProg(){
  const s = session;
  if (!s.list.length) return;
  progi.style.width = (s.idx / s.list.length * 100) + '%';
  progt.textContent = `${s.idx} / ${s.list.length}　对 ${s.right}`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hlPy(code){
  let s = esc(code);
  s = s.replace(/\b(def|return|if|elif|else|for|while|import|from|class|try|except|with|as|in|not|and|or|break|continue|pass|lambda|None|True|False)\b/g,'<span class="kw">$1</span>');
  s = s.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g,'<span class="st">$1</span>');
  return s;
}

function renderQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderResult();
  updateProg();
  const q = s.list[s.idx];
  const t = TYPES[q.type];
  let h = `<div class="qcard"><div class="qtype">${t.name}　第 ${s.idx+1} / ${s.list.length} 题</div>`;

  if (q.type === 'read'){
    h += `<div class="qtext">这段代码输出什么？</div>`;
    h += `<div class="codeblock">${hlPy(q.code)}</div>`;
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerRead();return false;">
            <input id="fillInput" placeholder="输入输出结果 ✦ 多行用分号或回车分开" autocomplete="off" enterkeyhint="done" required>
            <div class="btns"><button type="submit">提交</button><button type="button" onclick="showReadAnswer()">看答案</button></div>
          </form>`;
  } else if (q.type === 'judge'){
    h += `<div class="qtext">${esc(q.q)}</div>`;
    h += `<div class="tf"><button onclick="answerTF('对')" id="btnT">✓ 对</button><button onclick="answerTF('错')" id="btnF">， 错</button></div>`;
  } else if (q.type === 'choice'){
    h += `<div class="qtext">${esc(q.q)}</div><div class="opts">`;
    q.opts.forEach((o,i)=>{ h += `<div class="opt" onclick="answerChoice(${i})">${esc(o)}</div>`; });
    h += `</div><div class="actions"><button class="btn-next" id="submitChoice" onclick="submitChoice()" disabled>提交</button></div>`;
    s.choiceSel = new Set();
  } else if (q.type === 'fill'){
    h += `<div class="qtext">${esc(q.q)}</div>`;
    h += `<form class="fillbox" onsubmit="event.preventDefault();answerFill();return false;">
            <input id="fillInput" placeholder="输入答案" autocomplete="off" enterkeyhint="done" required>
            <div class="btns"><button type="submit">提交</button><button type="button" onclick="showFillAnswer()">看答案</button></div>
          </form>`;
  }

  h += `<div class="ansbox" id="ansbox"></div>`;
  h += `<div class="feedback" id="fb" style="display:none"></div>`;
  h += `<div class="actions" id="nextWrap" style="display:none"><button class="btn-next" onclick="nextQ()">下一题 →</button></div>`;
  h += '</div>';
  app.innerHTML = h;

  const inp = document.getElementById('fillInput');
  if (inp) inp.focus();
}

function norm(s){
  return String(s).toLowerCase().replace(/[\s，,。．.、；;：:（）()【】\[\]"'"'']/g,'').trim();
}

function showAnswer(ans, ok, mono, explain){
  const box = document.getElementById('ansbox');
  let html = '<b>正确答案</b><br>' + (mono ? `<span class="mono">${esc(ans)}</span>` : esc(ans));
  if (explain) {
    html += '<div class="explain"><b>💡 解析</b><br>' + esc(explain).replace(/\n/g, '<br>') + '</div>';
  }
  box.innerHTML = html;
  box.classList.add('show');
  const fb = document.getElementById('fb');
  fb.style.display = 'block';
  if (ok === true){ fb.className='feedback good'; fb.textContent='✅ 答对了'; }
  else if (ok === false){ fb.className='feedback bad'; fb.textContent='❌ 答错了，看上面的正确答案'; }
  else { fb.className='feedback mid'; fb.textContent='看完自己判断 ✦ 点「我记住了」继续'; }
  document.getElementById('nextWrap').style.display = 'flex';
  if (ok !== true) addSelfEval();
}

function addSelfEval(){
  const wrap = document.getElementById('nextWrap');
  if (wrap.querySelector('.btn-self')) return;
  const btn = document.createElement('button');
  btn.className = 'btn-self';
  btn.textContent = '我记住了 ✓';
  btn.onclick = () => { markRight(); nextQ(); };
  wrap.insertBefore(btn, wrap.firstChild);
}

function markRight(){
  const s = session; const q = s.list[s.idx];
  const id = q.type + ':' + q.oi;
  delete store.wrong[id];
  store.stats.right++;
  save();
}

function mark(ok){
  const s = session; const q = s.list[s.idx];
  const id = q.type + ':' + (q.oi !== undefined ? q.oi : s.idx);
  if (ok){ s.right++; store.stats.right++; delete store.wrong[id]; }
  else { store.stats.wrong++; store.wrong[id] = true; }
  save(); updateProg();
}

function answerTF(val){
  const q = session.list[session.idx];
  const ok = (val === q.a);
  document.getElementById('btnT').disabled = true;
  document.getElementById('btnF').disabled = true;
  document.getElementById('btnT').className = (q.a==='对') ? 'ok' : (val==='对'?'no':'');
  document.getElementById('btnF').className = (q.a==='错') ? 'ok' : (val==='错'?'no':'');
  mark(ok);
  showAnswer(q.a, ok, false, q.e);
}

function answerChoice(i){
  const s = session; const q = s.list[s.idx];
  if (s.submitted) return;
  const el = document.querySelectorAll('.opt')[i];
  if (s.choiceSel.has(i)){ s.choiceSel.delete(i); el.classList.remove('right'); el.classList.add('dim'); }
  else { s.choiceSel.add(i); el.classList.add('right'); el.classList.remove('dim'); }
  document.getElementById('submitChoice').disabled = s.choiceSel.size === 0;
}

function submitChoice(){
  const s = session; const q = s.list[s.idx];
  s.submitted = true;
  const L = 'ABCDEF';
  const mine = [...s.choiceSel].map(i=>L[i]).sort().join('');
  const ok = (mine === q.a);
  document.querySelectorAll('.opt').forEach((el,i)=>{
    el.onclick = null;
    if (q.a.includes(L[i])) { el.classList.remove('dim'); el.classList.add('right'); }
    else if (s.choiceSel.has(i)) { el.classList.remove('right'); el.classList.add('wrong'); }
    else el.classList.add('dim');
  });
  const btn = document.getElementById('submitChoice');
  if (btn) btn.style.display = 'none';
  mark(ok);
  showAnswer(q.a, ok, false, q.e);
  s.submitted = false;
}

function answerFill(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a);
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok, false, q.e);
}

function showFillAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  showAnswer(q.a, null, false, q.e);
}

function answerRead(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  const mine = inp.value;
  if (!mine.trim()) return;
  const ok = norm(mine) === norm(q.a) || norm(mine) === norm(q.a.replace(/\n/g,''));
  inp.disabled = true;
  mark(ok);
  showAnswer(q.a, ok, true, q.e);
}

function showReadAnswer(){
  const q = session.list[session.idx];
  const inp = document.getElementById('fillInput');
  if (inp) inp.disabled = true;
  showAnswer(q.a, null, true, q.e);
}

function nextQ(){ session.idx++; renderQ(); }

function renderResult(){
  const s = session;
  const total = s.list.length;
  const acc = Math.round(s.right / total * 100);
  let h = `<div class="qcard result"><div class="big">${acc}%</div>
            <div class="lbl">本轮 ${total} 题 ✦ 答对 ${s.right} 题</div>
            <div class="row"><div class="g"><b>${s.right}</b>答对</div><div class="r"><b>${total-s.right}</b>答错</div></div>`;
  if (acc >= 90) h += '<div style="color:var(--ok);font-size:15px">很棒 ✦ 这个掌握得不错</div>';
  else if (acc >= 70) h += '<div style="color:var(--warn);font-size:15px">还行 ✦ 错的那几题再刷一遍</div>';
  else h += '<div style="color:var(--bad);font-size:15px">先把错题重练一遍吧</div>';
  if (s.mode === 'level' && s.level) {
    const pct = Math.round(s.right / total * 100);
    const passed = pct >= s.level.pass;
    h += `<div style="margin:16px 0;padding:14px;border-radius:11px;text-align:center;font-size:15px;font-weight:600;
            background:${passed ? 'rgba(74,138,94,.14)' : 'rgba(182,74,69,.12)'};
            color:${passed ? 'var(--ok)' : 'var(--bad)'}">
            ${passed ? '🎉 通关！已解锁第 ' + (s.level.id + 1) + ' 关' : '差一点 · 需要 ' + s.level.pass + '% 才能通关'}
          </div>`;
    h += `<button onclick="startLevel(${s.level.id})">再挑战一次</button>`;
    h += `<button class="sec" onclick="openLevels()">回到关卡列表</button>`;
  } else {
    h += `<button onclick="start('${s.mode}')">再来一轮</button>`;
  }
  h += `<button class="sec" onclick="goHome()">回首页</button></div>`;
  app.innerHTML = h;
  progWrap.style.display = 'none';

  // 闯关：记录通关状态
  if (s.mode === 'level' && s.level) {
    const pct = Math.round(s.right / total * 100);
    if (pct >= s.level.pass) {
      store.levelDone = store.levelDone || {};
      store.levelDone[s.level.id] = true;
      save();
    }
  }
}

/* ══════════ 代码实操题 ══════════ */
let pyodide = null;
let pyReady = false;

async function ensurePyodide(){
  if (pyodide) return pyodide;
  if (typeof loadPyodide !== 'function') throw new Error('Pyodide 脚本没加载成功（可能被网络拦截）');
  const idx = window.__PY_IDX || window.__PY_CDNS[0];
  pyodide = await loadPyodide({ indexURL: idx });
  return pyodide;
}

const RUNNER = `
import sys, io, json, traceback

def _run(user_code, tests_json, mode):
    tests = json.loads(tests_json)
    result = {"mode": mode, "rows": [], "error": None, "base_output": ""}

    # 1) 先执行用户代码 · 捕获输出
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    g = {}
    try:
        exec(user_code, g)
    except SyntaxError as e:
        sys.stdout = old
        result["error"] = "语法错误（第 %s 行）: %s" % (e.lineno, e.msg)
        return json.dumps(result, ensure_ascii=False)
    except Exception as e:
        sys.stdout = old
        result["error"] = "运行报错: %s: %s" % (type(e).__name__, e)
        return json.dumps(result, ensure_ascii=False)
    sys.stdout = old
    result["base_output"] = buf.getvalue()

    if mode == "all":
        got = result["base_output"].strip()
        result["rows"].append({"call": "完整输出", "got": got, "expect": tests[0], "ok": got == tests[0]})
        return json.dumps(result, ensure_ascii=False)

    if mode == "contains":
        out = result["base_output"]
        for kw in tests:
            result["rows"].append({"call": "包含 " + kw, "got": "找到" if kw in out else "没找到", "expect": kw, "ok": kw in out})
        return json.dumps(result, ensure_ascii=False)

    # mode == tests · 逐个跑测试用例
    for item in tests:
        call, expect = item[0], item[1]
        buf2 = io.StringIO()
        sys.stdout = buf2
        try:
            exec(call, g)
            got = buf2.getvalue().strip()
            ok = (got == expect.strip())
            sys.stdout = old
            result["rows"].append({"call": call.replace(chr(10), " ; "), "got": got, "expect": expect, "ok": ok})
        except Exception as e:
            sys.stdout = old
            result["rows"].append({"call": call.replace(chr(10), " ; "), "got": "报错: %s: %s" % (type(e).__name__, e), "expect": expect, "ok": False})
    return json.dumps(result, ensure_ascii=False)
`;

async function runCodeTests(){
  const q = session.list[session.idx];
  const editor = document.getElementById('editor');
  const results = document.getElementById('testResults');
  const status = document.getElementById('pyStatus');
  const userCode = editor.value;

  if (!userCode.trim()){ alert('先写点代码吧'); return; }

  // 显示加载状态
  results.innerHTML = '<div style="color:var(--dim);font-size:13.5px">⏳ 正在准备 Python 环境（首次约 10-30 秒）...</div>';
  status.className = 'pyodide-status';
  status.textContent = '⏳ 加载 Python 运行时...';

  try {
    const py = await ensurePyodide();
    status.className = 'pyodide-status ready';
    status.textContent = '✅ Python 3.12 已就绪';

    // 准备测试数据
    let mode, tests;
    if (q.tests){
      mode = 'tests';
      tests = JSON.stringify(q.tests);
    } else if (q.expect_all_at_once !== undefined){
      mode = 'all';
      tests = JSON.stringify([q.expect_all_at_once]);
    } else if (q.expect_contains){
      mode = 'contains';
      tests = JSON.stringify(q.expect_contains);
    } else {
      results.innerHTML = '<div style="color:var(--bad)">这道题没有配置测试用例</div>';
      return;
    }

    await py.runPythonAsync(RUNNER);
    const resJson = py.globals.get('_run')(
      userCode,
      tests,
      mode
    );
    const res = JSON.parse(resJson);

    if (res.error){
      results.innerHTML = `<div class="testrow fail"><div class="call">运行出错</div>
        <div class="kv got">${esc(res.error)}</div></div>`;
      status.textContent = '❌ 运行出错';
      status.className = 'pyodide-status err';
      return;
    }

    // 渲染结果
    let h = '<div class="testlist">';
    let passN = 0;
    res.rows.forEach(r => {
      if (r.ok) passN++;
      h += `<div class="testrow ${r.ok ? 'pass' : 'fail'}">
              <div class="call">${r.ok ? '✅' : '❌'} ${esc(r.call)}</div>
              <div class="kv">实际: <span class="${r.ok ? '' : 'got'}">${esc(r.got)}</span></div>
              <div class="kv">期望: <span class="exp">${esc(r.expect)}</span></div>
            </div>`;
    });
    h += '</div>';
    results.innerHTML = h;

    const total = res.rows.length;
    if (passN === total){
      status.className = 'pyodide-status ready';
      status.textContent = `🎉 全部通过（${passN}/${total}）`;
      store.codeDone = store.codeDone || {};
      store.codeDone[q.oi] = true;
      store.stats.right++;
      save();
      // 显示优化建议
      const tip = document.getElementById('tipBox');
      if (tip) tip.classList.add('show');
    } else {
      status.className = 'pyodide-status err';
      status.textContent = `通过 ${passN} / ${total} 个用例`;
      store.codeDone = store.codeDone || {};
      delete store.codeDone[q.oi];
      save();
    }
  } catch (e) {
    status.className = 'pyodide-status err';
    status.textContent = '❌ ' + e.message;
    results.innerHTML = `<div class="testrow fail"><div class="kv got">${esc(e.message)}</div>
      <div class="kv" style="color:var(--dim);margin-top:6px">如果一直失败，可能是 CDN 被拦截 ✦ 可以改用「看参考答案」自学</div></div>`;
  }
}

function showRef(){
  const tip = document.getElementById('tipBox');
  if (tip) tip.classList.add('show');
  const box = document.getElementById('refBox');
  if (box) box.style.display = 'block';
}

function renderCodeQ(){
  const s = session;
  if (s.idx >= s.list.length) return renderCodeResult();
  const q = s.list[s.idx];

  let h = `<div class="qcard">
    <div class="qtype">代码实操　第 ${s.idx+1} / ${s.list.length} 题　难度 ${'⭐'.repeat(q.level)}</div>
    <div class="qtext" style="font-size:17px;font-weight:600;margin-bottom:12px">${esc(q.title)}</div>
    <div style="background:var(--card2);border-radius:10px;padding:14px;font-size:14.5px;line-height:1.8;white-space:pre-wrap">${esc(q.desc)}</div>
    <div style="margin-top:16px;font-size:13px;color:var(--dim);margin-bottom:6px">你的代码：</div>
    <textarea class="editor" id="editor" spellcheck="false">${esc(q.starter)}</textarea>
    <div class="actions">
      <button class="btn-run" onclick="runCodeTests()">▶ 运行测试</button>
      <button class="btn-ref" onclick="showRef()">看参考答案</button>
    </div>
    <div class="pyodide-status" id="pyStatus">首次运行需要加载 Python 运行时（约 10-30 秒）</div>
    <div id="testResults"></div>
    <div class="tipbox" id="tipBox">
      <h4>💡 优化建议</h4>
      <ul>${q.tips.map(t => '<li>' + esc(t) + '</li>').join('')}</ul>
    </div>
    <div id="refBox" style="display:none;margin-top:14px">
      <div style="font-size:13px;color:var(--py1);margin-bottom:6px">参考答案：</div>
      <div class="codeblock">${hlPy(q.ref)}</div>
    </div>
    <div class="actions" id="nextWrap">
      <button class="btn-self" onclick="nextCodeQ()">下一题 →</button>
    </div>
  </div>`;
  app.innerHTML = h;
}

function nextCodeQ(){ session.idx++; renderCodeQ(); }

function renderCodeResult(){
  const s = session;
  let h = `<div class="qcard result"><div class="big">${s.list.length}</div>
            <div class="lbl">实操题全部过了一遍</div>
            <button onclick="start('code')">再刷一轮</button>
            <button class="sec" onclick="goHome()">回首页</button></div>`;
  app.innerHTML = h;
}

/* 重写 start，让 code 走自己的渲染 */
const _start = start;
start = function(mode){
  _start(mode);
  if (mode === 'code') renderCodeQ();
};

const _renderQ = renderQ;
renderQ = function(){
  if (session && session.list[session.idx] && session.list[session.idx].type === 'code'){
    return renderCodeQ();
  }
  _renderQ();
};

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  if (!session || !session.list) return;
  const q = session.list[session.idx];
  if (!q) return;
  if (q.type === 'judge'){
    if (e.key === '1') answerTF('对');
    if (e.key === '2') answerTF('错');
  }
  if (q.type === 'choice' && !session.submitted){
    const L = 'ABCDEF';
    const i = L.indexOf(e.key.toUpperCase());
    if (i >= 0 && i < q.opts.length) answerChoice(i);
    if (e.key === 'Enter') submitChoice();
  }
});

renderHome();

/* 首页后台预热 Pyodide ✦ 点进实操题时就不用等了 */
setTimeout(() => { ensurePyodide().catch(() => {}); }, 2500);
</script>
